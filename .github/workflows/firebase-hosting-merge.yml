name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      PW_TEST_SPACE_ID: ${{ secrets.PW_TEST_SPACE_ID }}
      PW_TEST_SPACE_CODE: ${{ secrets.PW_TEST_SPACE_CODE }}
      PW_MICROSOFT_LOGIN_EMAIL: ${{ secrets.PW_MICROSOFT_LOGIN_EMAIL }}
      PW_MICROSOFT_LOGIN_PASSWORD: ${{ secrets.PW_MICROSOFT_LOGIN_PASSWORD }}
      SHARE_SPACE_CREATE_SECRET: ${{ secrets.SHARE_SPACE_CREATE_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tier 1
        run: >
          npm run playwright:linux:test --
          tests/cloud-switch-persist.spec.ts
          tests/cloud-sync-persist.spec.ts
          tests/microsoft-oauth-proxy.spec.ts
          --workers=1
          --reporter=line
          --config=playwright.config.ts

      - run: npm run build:prod

      - name: List files to deploy
        run: ls -R public

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-tier1-merge-artifacts
          path: |
            test-results
            playwright-report
            .tmp/playwright-suite-metrics.json
          if-no-files-found: ignore

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GOTOOLKIT }}
          channelId: live
          projectId: gotoolkit
