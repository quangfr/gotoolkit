<!DOCTYPE html>
<html lang="fr">

<head>
    <script>
        (function () {
            const storedTheme = localStorage.getItem('go-toolkit-theme');
            const theme = storedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'cream');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Go-Toolkit Hub | Go-Toolkit</title>
    <link rel="stylesheet" href="styles/style.css?v=2026.01.28.10">
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        .scan-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px;
            background: linear-gradient(160deg, rgba(25, 118, 210, 0.08), rgba(0, 0, 0, 0));
        }

        .scan-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .scan-title {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .scan-title h1 {
            margin: 0;
            font-size: 22px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .scan-title span {
            font-size: 13px;
            opacity: 0.7;
        }

        .scan-actions {
            display: flex;
            gap: 8px;
        }

        .handoff-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .handoff-card {
            border-radius: 16px;
            border: 1px solid var(--border-main);
            background: var(--bg-surface);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 110px;
        }

        .handoff-card h3 {
            margin: 0;
            font-size: 15px;
        }

        .handoff-card span {
            font-size: 12px;
            opacity: 0.7;
        }

        .handoff-card__actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-left: auto;
        }

        .handoff-card__footer {
            margin-top: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .handoff-card__meta {
            font-size: 11px;
            opacity: 0.6;
        }

        .handoff-card__desc {
            font-size: 12px;
            opacity: 0.75;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .handoff-empty {
            grid-column: 1 / -1;
            border: 1px dashed var(--border-main);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            font-size: 13px;
            opacity: 0.7;
        }

        .capture-modal {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            border-radius: 0;
        }

        #captureModal.modal-overlay {
            padding: 0;
        }

        .capture-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            overflow: hidden;
        }

        .capture-instruction {
            font-size: 12px;
            opacity: 0.7;
        }

        .capture-step {
            display: none;
            flex-direction: column;
            gap: 12px;
        }

        .capture-step.active {
            display: flex;
        }

        #captureStep2 {
            flex: 1;
            min-height: 0;
        }

        .capture-preview {
            width: 100%;
            flex: 1;
            border-radius: 12px;
            border: 1px solid var(--border-main);
            background: var(--bg-surface);
            padding: 6px 8px;
            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
            line-height: 1.4;
            resize: none;
            overflow: auto;
        }

        .capture-loader {
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .capture-loader.active {
            display: flex;
        }

        .capture-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        #captureCameraBtn,
        #captureAudioBtn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 18px 16px;
            font-weight: 600;
            text-transform: uppercase;
        }

        #captureCameraBtn svg,
        #captureAudioBtn svg {
            width: 42px;
            height: 42px;
        }

        .qr-modal {
            width: min(420px, 92vw);
        }

        .qr-video {
            width: 100%;
            border-radius: 16px;
            border: 1px solid var(--border-main);
            background: #000;
        }

        @media (max-width: 640px) {
            .handoff-grid {
                grid-template-columns: 1fr;
            }

            .capture-actions {
                width: 100%;
            }

            #captureCameraBtn,
            #captureAudioBtn {
                flex: 1 1 0;
                max-width: 50%;
            }
        }
    </style>
</head>

<body class="app-body">
    <div class="scan-shell">
        <header class="scan-header">
            <div class="scan-title">
                <h1><i data-lucide="scan-text"></i>Go-Toolkit Hub</h1>
                <span>Envoie tes scans et audios dans ton document sur PC</span>
            </div>
            <div class="scan-actions">
                <button id="scanQrBtn" class="btn btn-secondary" type="button" title="Scanner un QR">
                    <i data-lucide="qr-code"></i>
                </button>
                <button id="scanCodeBtn" class="btn btn-secondary" type="button" title="Entrer un code">
                    <i data-lucide="keyboard"></i>
                </button>
            </div>
        </header>

        <section id="handoffGrid" class="handoff-grid"></section>
    </div>

    <div class="modal-overlay" id="captureModal" role="dialog" aria-modal="true" aria-labelledby="captureModalTitle">
        <div class="modal capture-modal">
            <div class="modal-header">
                <h3 id="captureModalTitle" title="Capture Mobile"><i data-lucide="scan-text"
                        style="width:16px;height:16px;vertical-align:middle;margin-right:6px;"></i>Capture Mobile</h3>
                <button class="modal-close" id="captureModalClose" type="button" aria-label="Fermer"><i
                        data-lucide="x"></i></button>
            </div>
            <div class="capture-body">
                <div>
                    <strong id="captureDocTitle">Document</strong>
                </div>
                <div id="captureStep1" class="capture-step active">
                    <input id="captureInput" type="file" accept="image/*" capture="environment" multiple hidden>
                    <input id="captureAudioInput" type="file" accept="audio/*" hidden>
                    <div class="capture-actions">
                        <button id="captureCameraBtn" type="button" class="btn btn-secondary">
                            <i data-lucide="image-up"></i>
                            <span>Scan</span>
                        </button>
                        <button id="captureAudioBtn" type="button" class="btn btn-secondary">
                            <i data-lucide="audio-lines"></i>
                            <span>Enregistrement</span>
                        </button>
                    </div>
                </div>
                <div id="captureStep2" class="capture-step">
                    <div class="capture-loader" id="captureLoader"><i data-lucide="image-up"></i><span>OCR en
                            cours...</span>
                    </div>
                    <div class="capture-instruction">
                        Cliquez sur “Récupérer” côté PC pour importer votre scan.
                    </div>
                    <textarea id="capturePreview" class="capture-preview"
                        placeholder="Le texte OCR apparaîtra ici..."></textarea>
                </div>
                <div class="modal-actions" style="justify-content: flex-end; gap: 8px;">
                    <button id="captureDeleteBtn" type="button" class="btn btn-secondary"
                        style="margin-left: auto;">Recommencer</button>
                    <button id="captureCancelBtn" type="button" class="btn btn-primary">Fermer</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="codeModal" role="dialog" aria-modal="true" aria-labelledby="codeModalTitle">
        <div class="modal">
            <div class="modal-header">
                <h3 id="codeModalTitle" title="Code session"><i data-lucide="keyboard"
                        style="width:16px;height:16px;vertical-align:middle;margin-right:6px;"></i>Code session</h3>
                <button class="modal-close" id="codeModalClose" type="button" aria-label="Fermer"><i
                        data-lucide="x"></i></button>
            </div>
            <div class="ia-actions" style="gap: 12px;">
                <span style="font-size: 13px; opacity: 0.7;">Entrez le code à 4 caractères affiché sur votre
                    Docs.</span>
                <input id="codeInput" type="text" maxlength="4"
                    style="width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border-main); background: var(--bg-surface); text-transform: uppercase; letter-spacing: 0.2em; text-align: center; font-weight: 600;">
                <div class="modal-actions" style="justify-content: flex-end; gap: 8px;">
                    <button id="codeCancelBtn" type="button" class="btn btn-secondary">Annuler</button>
                    <button id="codeSubmitBtn" type="button" class="btn-primary">Valider</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="qrModal" role="dialog" aria-modal="true" aria-labelledby="qrModalTitle">
        <div class="modal qr-modal">
            <div class="modal-header">
                <h3 id="qrModalTitle" title="Scanner"><i data-lucide="qr-code"
                        style="width:16px;height:16px;vertical-align:middle;margin-right:6px;"></i>Scanner</h3>
                <button class="modal-close" id="qrModalClose" type="button" aria-label="Fermer"><i
                        data-lucide="x"></i></button>
            </div>
            <div class="ia-actions" style="gap: 12px;">
                <video id="qrVideo" class="qr-video" autoplay playsinline muted></video>
                <span style="font-size: 12px; opacity: 0.7;">Centrez le QR Code dans le cadre.</span>
                <div class="modal-actions" style="justify-content: flex-end; gap: 8px;">
                    <button id="qrCancelBtn" type="button" class="btn btn-secondary">Annuler</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.GO_TOOLKIT_SHARE_API_URL =
            window.GO_TOOLKIT_SHARE_API_URL || "https://share.gotoolkit.workers.dev/";
    </script>
    <script src="js/config.js?v=2026.01.28.10"></script>
    <script src="prompt.js?v=2026.01.28.10"></script>
    <script src="js/ia-config.js?v=2026.01.28.10"></script>
    <script src="js/ia-client.js?v=2026.01.28.10"></script>
    <script src="js/share-worker-client.js?v=2026.01.28.10"></script>
    <script src="js/voice-transcript.js?v=2026.01.28.10"></script>
    <script src="js/scan.js?v=2026.01.28.10"></script>
    <script>
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
</body>

</html>
