            async function ensureScreenCapture() {
                if (screenStream) return { ok: true, cancelled: false };
                if (!navigator.mediaDevices?.getDisplayMedia) {
                    showToast("Capture d'écran indisponible.", true);
                    return { ok: false, cancelled: false };
                }
                try {
                    const displayStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { cursor: "always" },
                        audio: false
                    });
                    const videoTrack = displayStream.getVideoTracks()[0];
                    if (!videoTrack) {
                        throw new Error("Flux vidéo indisponible");
                    }
                    screenStream = displayStream;
                    videoTrack.addEventListener("ended", () => {
                        screenStream = null;
                        applyScreenCapturePreference(false);
                        updateRecordingPrepTiles();
                        updateRecordingLiveOverlay();
                    });
                    if (typeof window.focus === "function") {
                        try {
                            window.focus();
                        } catch (err) {
                            console.warn("Impossible de ramener le focus après capture écran", err);
                        }
                    }
                    return { ok: true, cancelled: false };
                } catch (err) {
                    const cancelled = err?.name === "AbortError" || err?.name === "NotAllowedError";
                    console.warn("Capture écran impossible", err);
                    const toastMessage = cancelled
                        ? "Capture d'écran annulée. Capture désactivée pour cette session."
                        : "Capture d'écran annulée.";
                    showToast(toastMessage, !cancelled);
                    return { ok: false, cancelled };
                }
            }

            function stopScreenRecording() {
                try {
                    if (screenRecorder && screenRecorder.state === "recording") {
                        screenRecorder.stop();
                    }
                } catch (err) {
                    console.warn("Arrêt capture écran", err);
                }
                releaseCompositeRecordingResources();
                updateRecordingControlsState();
            }

            function releaseScreenCaptureStream() {
                if (screenStream) {
                    screenStream.getTracks().forEach(track => track.stop());
                    screenStream = null;
                }
            }

            function stopMicPreview() {
                if (micWaveAnimationId) {
                    cancelAnimationFrame(micWaveAnimationId);
                    micWaveAnimationId = null;
                }
                if (micAudioContext) {
                    try { micAudioContext.close(); } catch (e) { /* ignore */ }
                    micAudioContext = null;
                }
                micAnalyser = null;
                micAnalyserData = null;
                if (micPreviewStream) {
                    micPreviewStream.getTracks().forEach(track => track.stop());
                    micPreviewStream = null;
                }
                micEnabled = false;
                if (micWaveCanvas) {
                    const ctx = micWaveCanvas.getContext("2d");
                    if (ctx) ctx.clearRect(0, 0, micWaveCanvas.width, micWaveCanvas.height);
                }
            }

            function startMicWaveLoop() {
                if (!micWaveCanvas || !micAnalyser) return;
                const ctx = micWaveCanvas.getContext("2d");
                if (!ctx) return;
                const { width, height } = micWaveCanvas;
                const buffer = [];
                const maxPoints = Math.max(24, Math.floor(width / 4));
                const draw = () => {
                    if (!micAnalyser || !micWaveCanvas) return;
                    micAnalyser.getByteTimeDomainData(micAnalyserData);
                    let sumSquares = 0;
                    const length = Math.max(1, micAnalyserData.length);
                    for (let i = 0; i < micAnalyserData.length; i++) {
                        const normalized = (micAnalyserData[i] - 128) / 128;
                        sumSquares += normalized * normalized;
                    }
                    const rms = Math.sqrt(sumSquares / length);
                    const amplitude = Math.min(1, rms * 2.5);
                    buffer.push(amplitude);
                    if (buffer.length > maxPoints) buffer.shift();
                    ctx.clearRect(0, 0, width, height);
                    ctx.beginPath();
                    const baseline = height / 2;
                    buffer.forEach((val, idx) => {
                        const pointX = (idx / Math.max(1, maxPoints - 1)) * width;
                        const waveHeight = Math.max(1, val * height * 0.35);
                        const harmonic = Math.sin((idx / maxPoints) * Math.PI * 2);
                        const jitterScale = Math.max(1, 6 * (1 - val));
                        const jitter = Math.sin((idx / maxPoints) * Math.PI * 4) * jitterScale;
                        const pointY = baseline + harmonic * waveHeight + jitter;
                        if (idx === 0) ctx.moveTo(pointX, pointY);
                        else ctx.lineTo(pointX, pointY);
                    });
                    ctx.strokeStyle = "#facc15";
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    micWaveAnimationId = requestAnimationFrame(draw);
                };
                if (micWaveAnimationId) cancelAnimationFrame(micWaveAnimationId);
                micWaveAnimationId = requestAnimationFrame(draw);
            }

            function setupMicAnalyser() {
                if (!micPreviewStream) return;
                try { micAudioContext?.close(); } catch (e) { /* ignore */ }
                micAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                micAnalyser = micAudioContext.createAnalyser();
                micAnalyser.fftSize = 256;
                const source = micAudioContext.createMediaStreamSource(micPreviewStream);
                source.connect(micAnalyser);
                micAnalyserData = new Uint8Array(micAnalyser.frequencyBinCount);
                startMicWaveLoop();
            }

            async function ensureMicPreviewStream() {
                if (micPreviewStream) {
                    micEnabled = true;

                }
                if (!navigator.mediaDevices?.getUserMedia) return false;
                try {

                    micEnabled = true;

            function stopWebcamPreview() {

            async function ensureWebcamPreview() {
                if (webcamStream) {
                    webcamEnabled = true;

            function attachVideoStream(videoEl, stream) {
                if (!videoEl) return;
                if (videoEl.srcObject === stream) return;
                videoEl.srcObject = stream || null;
                if (stream) {
                    videoEl.play().catch(() => { /* ignore play errors */ });
                }

            function ensureCompositeResources() {
                if (!compositeCanvas) {
                    compositeCanvas = document.createElement("canvas");
                    compositeCanvas.width = COMPOSITE_DEFAULT_WIDTH;
                    compositeCanvas.height = COMPOSITE_DEFAULT_HEIGHT;
                }
                if (!compositeCtx && compositeCanvas) {
                    compositeCtx = compositeCanvas.getContext("2d");
                }
                if (!compositeScreenVideo) {
                    compositeScreenVideo = document.createElement("video");
                    compositeScreenVideo.autoplay = true;
                    compositeScreenVideo.muted = true;
                    compositeScreenVideo.playsInline = true;
                }
                if (!compositeWebcamVideo) {
                    compositeWebcamVideo = document.createElement("video");
                    compositeWebcamVideo.autoplay = true;
                    compositeWebcamVideo.muted = true;
                    compositeWebcamVideo.playsInline = true;
                }
            }

            function clampCompositeSize(width, height) {
                const safeWidth = width || COMPOSITE_DEFAULT_WIDTH;
                const safeHeight = height || COMPOSITE_DEFAULT_HEIGHT;
                const aspect = safeWidth && safeHeight ? safeWidth / safeHeight : 16 / 9;
                let clampedWidth = Math.min(safeWidth, COMPOSITE_MAX_WIDTH);
                let clampedHeight = Math.round(clampedWidth / aspect);
                if (clampedHeight > COMPOSITE_MAX_HEIGHT) {
                    clampedHeight = COMPOSITE_MAX_HEIGHT;
                    clampedWidth = Math.round(clampedHeight * aspect);
                }
                return { width: clampedWidth, height: clampedHeight };
            }

            function updateCompositeCanvasSize() {
                if (!compositeCanvas || !compositeScreenVideo) return;
                const sourceWidth = compositeScreenVideo.videoWidth || COMPOSITE_DEFAULT_WIDTH;
                const sourceHeight = compositeScreenVideo.videoHeight || COMPOSITE_DEFAULT_HEIGHT;
                const { width: nextWidth, height: nextHeight } = clampCompositeSize(sourceWidth, sourceHeight);
                if (!nextWidth || !nextHeight) return;
                if (compositeCanvas.width !== nextWidth || compositeCanvas.height !== nextHeight) {
                    compositeCanvas.width = nextWidth;
                    compositeCanvas.height = nextHeight;
                }
            }

            function drawCompositeFrame() {
                if (!compositeCtx || !compositeCanvas || !compositeScreenVideo) return;
                updateCompositeCanvasSize();
                const { width, height } = compositeCanvas;
                if (!width || !height) return;
                compositeCtx.fillStyle = "#000";
                compositeCtx.fillRect(0, 0, width, height);
                if (compositeScreenVideo.readyState >= compositeScreenVideo.HAVE_CURRENT_DATA) {
                    compositeCtx.drawImage(compositeScreenVideo, 0, 0, width, height);
                }
                if (!compositeWebcamVideo) return;
                if (compositeWebcamVideo.readyState < compositeWebcamVideo.HAVE_CURRENT_DATA) return;
                const overlaySize = Math.max(1, Math.round(width * COMPOSITE_WEBCAM_WIDTH_RATIO));
                const margin = Math.max(8, Math.round(width * COMPOSITE_MARGIN_RATIO));
                const overlayX = Math.max(margin, width - overlaySize - margin);
                const overlayY = Math.max(margin, height - overlaySize - margin);
                const sourceWidth = compositeWebcamVideo.videoWidth || overlaySize;
                const sourceHeight = compositeWebcamVideo.videoHeight || overlaySize;
                let sx = 0;
                let sy = 0;
                let sw = sourceWidth;
                let sh = sourceHeight;
                if (sourceWidth > sourceHeight) {
                    sw = sourceHeight;
                    sx = Math.max(0, Math.floor((sourceWidth - sourceHeight) / 2));
                } else if (sourceHeight > sourceWidth) {
                    sh = sourceWidth;
                    sy = Math.max(0, Math.floor((sourceHeight - sourceWidth) / 2));
                }
                compositeCtx.drawImage(
                    compositeWebcamVideo,
                    sx,
                    sy,
                    sw,
                    sh,
                    overlayX,
                    overlayY,
                    overlaySize,
                    overlaySize
                );
            }

            function startCompositeLoop() {
                if (compositeAnimationFrameId) return;
                const frameInterval = 1000 / COMPOSITE_FRAME_RATE;
                const loop = timestamp => {
                    if (!lastCompositeFrameTime || (timestamp - lastCompositeFrameTime) >= frameInterval) {
                        lastCompositeFrameTime = timestamp;
                        drawCompositeFrame();
                    }
                    compositeAnimationFrameId = requestAnimationFrame(loop);
                };
                compositeAnimationFrameId = requestAnimationFrame(loop);
            }

            function stopCompositeLoop() {
                if (compositeAnimationFrameId) {
                    cancelAnimationFrame(compositeAnimationFrameId);
                    compositeAnimationFrameId = null;
                }
                lastCompositeFrameTime = 0;
            }

            function releaseCompositeRecordingResources() {
                stopCompositeLoop();
                if (compositeCaptureStream) {
                    compositeCaptureStream.getTracks().forEach(track => track.stop());
                    compositeCaptureStream = null;
                }
                if (compositeCtx && compositeCanvas) {
                    compositeCtx.clearRect(0, 0, compositeCanvas.width, compositeCanvas.height);
                }
                if (compositeScreenVideo) {
                    compositeScreenVideo.srcObject = null;
                }
                if (compositeWebcamVideo) {
                    compositeWebcamVideo.srcObject = null;
                }
                if (compositeCanvas) {
                    compositeCanvas.width = COMPOSITE_DEFAULT_WIDTH;
                    compositeCanvas.height = COMPOSITE_DEFAULT_HEIGHT;
                }
            }

            function createCompositeRecordingStream() {
                if (!screenStream || !webcamStream) return null;
                releaseCompositeRecordingResources();
                ensureCompositeResources();
                attachVideoStream(compositeScreenVideo, screenStream);
                attachVideoStream(compositeWebcamVideo, webcamStream);
                startCompositeLoop();
                if (!compositeCanvas) return null;
                let captureStream = null;
                try {
                    captureStream = compositeCanvas.captureStream(COMPOSITE_FRAME_RATE);
                } catch (err) {
                    console.warn("Capture composite indisponible", err);
                    return null;
                }
                if (!captureStream) return null;
                const videoTrack = captureStream.getVideoTracks()[0];
                if (!videoTrack) {
                    captureStream.getTracks().forEach(track => track.stop());
                    return null;
                }
                compositeCaptureStream = captureStream;
                const combined = new MediaStream();
                combined.addTrack(videoTrack);
                const micTrack = mediaStream?.getAudioTracks?.()[0];
                if (micTrack) {
                    combined.addTrack(micTrack.clone());
                }
                return combined;
            }

            function setRecordingPrepKeyListener(enabled) {

                        if (event.key !== "Escape") return;
                        if (!recordingPrepOverlay?.classList.contains("visible")) return;
                        event.preventDefault();
                        closeRecordingPrepOverlay();
                    };
                    document.addEventListener("keydown", recordingPrepKeydownHandler);
                } else if (recordingPrepKeydownHandler) {
                    document.removeEventListener("keydown", recordingPrepKeydownHandler);
                    recordingPrepKeydownHandler = null;
                }
            }

                if (enabled) {

                        const confirmed = window.confirm("Arrêter l'enregistrement ?");
                        if (confirmed) {
                            pauseRecording();

                    document.addEventListener("keydown", recordingLiveKeydownHandler);

            async function runPrepCountdown() {
                if (!recordingReadyNode) return true;
                if (prepCountdownTimeout) {
                    clearTimeout(prepCountdownTimeout);
                    prepCountdownTimeout = null;
                }
                const steps = ["3", "2", "1", "Go!"];
                let idx = 0;
                return new Promise(resolve => {
                    const tick = () => {
                        if (!recordingReadyNode) {
                            resolve(false);
                            return;
                        }
                        if (idx >= steps.length) {
                            recordingReadyNode.textContent = "◉ Prêt";
                            prepCountdownTimeout = null;
                            resolve(true);
                            return;
                        }
                        recordingReadyNode.textContent = steps[idx];
                        idx += 1;
                        prepCountdownTimeout = window.setTimeout(tick, 850);
                    };
                    tick();
                });
            }

                if (audioRecordingActive) return;
                if (!micEnabled) {
                    showToast("Active le micro avant de démarrer.", true);

                if (!ok) return;
                if (recordingReadyNode) recordingReadyNode.textContent = "◉ Prêt";
                closeRecordingPrepOverlay();
                const started = await startRecording({ skipCountdown: true, openLiveOverlay: true, requireMicReady: true });
                if (!started) {
                    openRecordingPrepOverlay();
                }

            function updateRecordingLiveTimer() {
                if (!recordingTimerText) return;
                const total = Math.max(0, Math.floor(recordingElapsedSec || 0));
                const m = String(Math.floor(total / 60)).padStart(2, "0");
                const s = String(total % 60).padStart(2, "0");
                const guidelinesDurationLabel = guidelineDuration ? formatGuidelineDurationClock(guidelineDuration.value) : "";
                const guidelinesSuffix = guidelinesDurationLabel ? ` / ${guidelinesDurationLabel}` : "";
                recordingTimerText.textContent = `${m}:${s}${guidelinesSuffix}`;
            }

            function parseMinutes(value, fallback = 0) {
                const num = Number(value);
                return Number.isFinite(num) ? num : fallback;
            }

            function formatMinutesLabel(value) {
                const minutes = Number(value);
                return Number.isFinite(minutes) && minutes > 0 ? `${Math.round(minutes)}'` : "";
            }

            function formatGuidelineDurationClock(value) {
                const minutes = Number(value);
                if (!Number.isFinite(minutes) || minutes <= 0) return "";
                const totalSeconds = Math.max(0, Math.round(minutes * 60));
                const hours = Math.floor(totalSeconds / 3600);
                const mins = Math.floor((totalSeconds % 3600) / 60);
                const secs = totalSeconds % 60;
                const mm = String(mins).padStart(2, "0");
                const ss = String(secs).padStart(2, "0");
                return hours > 0
                    ? `${hours}:${mm}:${ss}`
                    : `${mm}:${ss}`;
            }

            function getSortedSubjects() {
                const page = getActivePage();
                if (!page || !Array.isArray(page.subjects)) return [];
                return [...page.subjects].sort((a, b) => {
                    const aStart = parseMinutes(a?.timeframe?.start, 0);
                    const bStart = parseMinutes(b?.timeframe?.start, 0);
                    return aStart - bStart;
                });
            }

            function applyKeyStatusClass(el, status) {
                if (!el) return;
                el.classList.remove("status-addressed", "status-done");
                if (status === 1) el.classList.add("status-addressed");
                if (status === 2) el.classList.add("status-done");
            }

            function getKeyStatus(subjectId, idx) {
                if (!subjectId) return 0;
                const marks = keySentenceMarks.get(subjectId) || [];
                return marks[idx] || 0;
            }

            function setKeyStatus(subjectId, idx, status, el) {
                if (!subjectId) return;
                const marks = keySentenceMarks.get(subjectId) || [];
                marks[idx] = status;
                keySentenceMarks.set(subjectId, marks);
                applyKeyStatusClass(el, status);
            }

            function renderRecordingKeys(subject) {
                if (!recordingKeyList) return;
                recordingKeyList.innerHTML = "";
                if (!subject) return;
                const subjectId = subject.id || "";
                const sentences = Array.isArray(subject.keySentences) ? subject.keySentences : [];
                sentences.forEach((ks, idx) => {
                    const item = document.createElement("div");
                    item.className = "recording-live-key";
                    item.textContent = ks?.text || `Point ${idx + 1}`;
                    const status = getKeyStatus(subjectId, idx);
                    applyKeyStatusClass(item, status);
                    item.addEventListener("click", () => {
                        const next = ((getKeyStatus(subjectId, idx) || 0) + 1) % 3;
                        setKeyStatus(subjectId, idx, next, item);
                    });
                    recordingKeyList.appendChild(item);
                });
            }

            function setRecordingSubject(subject) {
                recordingCurrentSubjectId = subject?.id || null;
                if (recordingSubjectTitle) {
                    const title = subject?.title || "Sujet";
                    const startMin = parseMinutes(subject?.timeframe?.start, 0);
                    const endMin = parseMinutes(subject?.timeframe?.end, startMin);
                    const duration = Math.max(0, endMin - startMin);
                    const durationLabel = formatMinutesLabel(duration);
                    const subjects = getSortedSubjects();
                    const total = subjects.length;
                    const idx = total ? subjects.findIndex(s => s.id === recordingCurrentSubjectId) : -1;
                    const positionLabel = total ? `${idx >= 0 ? idx + 1 : 1}/${total}` : "0/0";
                    const durationSuffix = durationLabel ? ` (${durationLabel})` : "";
                    recordingSubjectTitle.textContent = `${positionLabel} — ${title}${durationSuffix}`;
                }
                const page = getActivePage();
                if (page) {
                    page.activeSubjectId = recordingCurrentSubjectId;
                }

            async function mergeVideoSegmentsWithFfmpeg(previousBlob, nextBlob) {
                if (!previousBlob || !nextBlob) return null;
                if (typeof FFmpeg === "undefined") return null;
                const ffmpeg = await ensureFfmpegReady();
                if (!ffmpeg || typeof FFmpeg.fetchFile !== "function") return null;
                try {
                    const inputs = [
                        { name: "segment-0.webm", blob: previousBlob },
                        { name: "segment-1.webm", blob: nextBlob }
                    ];
                    const outputName = "merged-output.webm";
                    for (const input of inputs) {
                        ffmpeg.FS("writeFile", input.name, await FFmpeg.fetchFile(input.blob));
                    }
                    await ffmpeg.run(
                        "-i", inputs[0].name,
                        "-i", inputs[1].name,
                        "-filter_complex", `[0:v][0:a][1:v][1:a]concat=n=2:v=1:a=1[outv][outa]`,
                        "-map", "[outv]",
                        "-map", "[outa]",
                        "-c:v", "libvpx",
                        "-c:a", "libvorbis",
                        "-y",
                        outputName
                    );
                    const data = ffmpeg.FS("readFile", outputName);
                    return new Blob([data.buffer], { type: "video/webm" });
                } catch (err) {
                    console.warn("Fusion FFmpeg impossible", err);
                    return null;
                } finally {
                    try { ffmpeg.FS("unlink", "segment-0.webm"); } catch (err) { /* noop */ }
                    try { ffmpeg.FS("unlink", "segment-1.webm"); } catch (err) { /* noop */ }
                    try { ffmpeg.FS("unlink", "merged-output.webm"); } catch (err) { /* noop */ }
                }
            }

            async function mergeAudioSegmentsWithFfmpeg(segments = []) {
                if (!Array.isArray(segments) || segments.length < 2) return null;
                if (typeof FFmpeg === "undefined") return null;
                const ffmpeg = await ensureFfmpegReady();
                if (!ffmpeg || typeof FFmpeg.fetchFile !== "function") return null;
                const inputs = segments.map((blob, idx) => ({
                    name: `audio-segment-${idx}.webm`,
                    blob
                }));
                const outputName = "merged-audio.webm";
                try {
                    for (const input of inputs) {
                        ffmpeg.FS("writeFile", input.name, await FFmpeg.fetchFile(input.blob));
                    }
                    const args = [];
                    inputs.forEach(input => {
                        args.push("-i", input.name);
                    });
                    const filterInputs = inputs.map((_, idx) => `[${idx}:a]`).join("");
                    args.push(
                        "-filter_complex", `${filterInputs}concat=n=${inputs.length}:v=0:a=1[outa]`,
                        "-map", "[outa]",
                        "-c:a", "libvorbis",
                        "-y",
                        outputName
                    );
                    await ffmpeg.run(...args);
                    const data = ffmpeg.FS("readFile", outputName);
                    return new Blob([data.buffer], { type: "audio/webm" });
                } catch (err) {
                    console.warn("Fusion audio FFmpeg impossible", err);
                    return null;
                } finally {
                    inputs.forEach(input => {
                        try { ffmpeg.FS("unlink", input.name); } catch (err) { /* noop */ }
                    });
                    try { ffmpeg.FS("unlink", outputName); } catch (err) { /* noop */ }
                }
            }

            async function captureSequentialVideoSegments(segments, mimeType, fallbackBlob) {
                return new Promise(resolve => {
                    const { videoEl, wrapper } = createHiddenPlaybackContainer();
                    const captureStream = videoEl.captureStream?.();
                    if (!captureStream) {
                        if (wrapper.parentNode) {
                            wrapper.parentNode.removeChild(wrapper);
                        }
                        resolve(fallbackBlob);
                        return;
                    }
                    let recorder;
                    try {
                        recorder = new MediaRecorder(captureStream, { mimeType: mimeType || undefined });
                    } catch (err) {
                        if (wrapper.parentNode) {
                            wrapper.parentNode.removeChild(wrapper);
                        }
                        resolve(fallbackBlob);
                        return;
                    }
                    const recordedChunks = [];
                    const urls = segments.map(segment => URL.createObjectURL(segment));
                    let finished = false;
                    const cleanup = () => {
                        try { videoEl.pause(); } catch (err) { /* noop */ }
                        videoEl.removeAttribute("src");
                        videoEl.load();
                        if (wrapper.parentNode) {
                            wrapper.parentNode.removeChild(wrapper);
                        }
                        urls.forEach(url => {
                            try {
                                URL.revokeObjectURL(url);
                            } catch (err) { /* noop */ }
                        });
                    };
                    const finalize = () => {
                        if (finished) return;
                        finished = true;
                        cleanup();
                        if (recordedChunks.length) {
                            resolve(new Blob(recordedChunks, { type: mimeType || fallbackBlob?.type || "video/webm" }));
                        } else {
                            resolve(fallbackBlob);
                        }
                    };
                    recorder.ondataavailable = event => {
                        if (event.data && event.data.size) {
                            recordedChunks.push(event.data);
                        }
                    };
                    recorder.onerror = () => {
                        if (recorder.state === "recording") {
                            recorder.stop();
                        }
                    };
                    recorder.onstop = finalize;
                    let currentIndex = 0;
                    const playNextSegment = () => {
                        if (currentIndex >= urls.length) {
                            if (recorder.state === "recording") {
                                recorder.stop();
                            }
                            return;
                        }
                        const currentUrl = urls[currentIndex];
                        videoEl.src = currentUrl;
                        videoEl.onended = () => {
                            currentIndex += 1;
                            if (currentIndex < urls.length) {
                                playNextSegment();
                            } else if (recorder.state === "recording") {
                                recorder.stop();
                            }
                        };
                        videoEl.play().catch(() => {
                            if (recorder.state === "recording") {
                                recorder.stop();
                            }
                        });
                    };
                    try {
                        recorder.start();
                    } catch (err) {
                        finalize();
                        return;
                    }
                    playNextSegment();
                });
            }

            async function transcodeVideoSegments(previousBlob, nextBlob) {
                const segments = [];
                if (previousBlob) segments.push(previousBlob);
                if (nextBlob) segments.push(nextBlob);
                if (!segments.length) return null;
                if (segments.length === 1) return segments[0];
                const fallbackBlob = concatenateVideoBlobs(segments);
                if (!fallbackBlob) return null;
                const ffmpegBlob = await mergeVideoSegmentsWithFfmpeg(previousBlob, nextBlob);
                if (ffmpegBlob) return ffmpegBlob;
                if (!canCapturePlaybackStream()) {
                    return fallbackBlob;
                }
                const mimeType = chooseVideoTranscodeMimeType() || fallbackBlob?.type || "video/webm";
                try {
                    const merged = await captureSequentialVideoSegments(segments, mimeType, fallbackBlob);
                    return merged || fallbackBlob;
                } catch (err) {
                    console.warn("Transcodage vidéo impossible", err);
                    return fallbackBlob;
                }
            }

                    if (screenChunks.length) {
                        chunkBlob = new Blob(screenChunks, { type: screenChunks[0]?.type || "video/webm" });
                        if (videoBlob) {
                            const mergedBlob = await transcodeVideoSegments(videoBlob, chunkBlob);
                            if (mergedBlob) {

                            } else if (chunkBlob) {

                            }
                        } else if (chunkBlob) {

                } catch (err) {

            function parseVttTimestamp(value = "") {
                const normalized = String(value || "").trim();
                if (!normalized) return NaN;
                const sanitized = normalized.replace(/,/g, ".");
                const parts = sanitized.split(":");
                let hours = 0;
                let minutes = 0;
                let seconds = 0;
                if (parts.length === 3) {
                    hours = Number(parts[0]);
                    minutes = Number(parts[1]);
                    seconds = Number(parts[2]);
                } else if (parts.length === 2) {
                    minutes = Number(parts[0]);
                    seconds = Number(parts[1]);
                } else {
                    return NaN;
                }
                if ([hours, minutes, seconds].some(num => Number.isNaN(num))) return NaN;
                return hours * 3600 + minutes * 60 + seconds;
            }

            function formatVttTimestamp(value = 0) {
                const totalMillis = Math.max(0, Math.floor((Number(value) || 0) * 1000));
                const hours = Math.floor(totalMillis / 3600000);
                const minutes = Math.floor((totalMillis % 3600000) / 60000);
                const seconds = Math.floor((totalMillis % 60000) / 1000);
                const millis = totalMillis % 1000;
                return `${String(hours).padStart(2, "0")}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}.${String(millis).padStart(3, "0")}`;
            }

            function parseSrtTimestamp(value = "") {
                const normalized = String(value || "").trim();
                const match = normalized.match(/(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})/);
                if (!match) return NaN;
                const hours = Number(match[1]);
                const minutes = Number(match[2]);
                const seconds = Number(match[3]);
                const rawMillis = match[4] || "0";
                const padded = (rawMillis + "000").slice(0, 3);
                const millis = Number(padded);
                if ([hours, minutes, seconds, millis].some(num => Number.isNaN(num))) return NaN;
                return hours * 3600 + minutes * 60 + seconds + millis / 1000;
            }

            function parseVttTranscript(text) {
                const raw = String(text || "").trim();
                if (!raw) return [];
                const lines = raw.split(/\r?\n/);
                const blocks = [];
                let current = [];
                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (!trimmed || trimmed === "---") {
                        if (current.length) {
                            blocks.push(current);
                            current = [];
                        }
                        return;
                    }
                    if (trimmed.toUpperCase().startsWith("WEBVTT") || trimmed.toUpperCase().startsWith("NOTE")) {
                        return;
                    }
                    current.push(trimmed);
                });
                if (current.length) {
                    blocks.push(current);
                }
                return blocks.map((block, index) => {
                    const timingIndex = block.findIndex(line => line.includes("-->"));
                    if (timingIndex === -1) return null;
                    const timing = block[timingIndex];
                    const [startPart, endPart] = timing.split("-->").map(part => part.trim());
                    const start = parseVttTimestamp(startPart);
                    const end = parseVttTimestamp(endPart);
                    if (!Number.isFinite(start)) return null;
                    const safeEnd = Number.isFinite(end) && end > start ? end : start + 2;
                    const contentLines = block.slice(timingIndex + 1);
                    const textContent = contentLines.join("\n").trim();
                    const id = timingIndex > 0 ? block[0] : `segment-${index}`;
                    return {
                        id,
                        text: textContent,
                        start,
                        end: safeEnd
                    };
                }).filter(Boolean);
            }

            function parseSrtTranscript(text) {
                const raw = String(text || "").trim();
                if (!raw) return [];
                const blocks = raw.split(/\r?\n\r?\n/).map(block => block.trim()).filter(Boolean);
                return blocks.map((block, index) => {
                    const lines = block.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
                    if (!lines.length) return null;
                    const timingIndex = lines.findIndex(line => line.includes("-->"));
                    if (timingIndex === -1) return null;
                    const timing = lines[timingIndex];
                    const [startPart, endPart] = timing.split("-->").map(part => part.trim());
                    const start = parseSrtTimestamp(startPart);
                    const end = parseSrtTimestamp(endPart);
                    if (!Number.isFinite(start)) return null;
                    const safeEnd = Number.isFinite(end) && end > start ? end : start + 2;
                    const contentLines = lines.slice(timingIndex + 1);
                    const textContent = contentLines.join("\n").trim();
                    const firstLine = lines[0];
                    const id = firstLine && /^\d+$/.test(firstLine) ? `segment-${firstLine}` : `segment-${index}`;
                    return {
                        id,
                        text: textContent,
                        start,
                        end: safeEnd
                    };
                }).filter(Boolean);
            }

            function buildVttFromSegments(segments = []) {
                if (!Array.isArray(segments) || !segments.length) return "";
                const entries = segments.map(segment => {
                    const start = formatVttTimestamp(segment.start);
                    const end = formatVttTimestamp(segment.end);
                    const content = (segment.text || "").trim();
                    return `${start} --> ${end}\n${content}`;
                });
                return `WEBVTT\n\n${entries.join("\n\n")}`;
            }

            async function ensureVideoTranscriptSegments(page, options = {}) {
                if (!page || !page.videoTranscriptId) return [];
                const { forceRefresh = false } = options;
                const storedSegments = Array.isArray(page.videoTranscriptSentences) ? page.videoTranscriptSentences : [];
                const syncedForCurrentId = page.videoTranscriptFetchedId === page.videoTranscriptId && storedSegments.length;
                const hasManualEdits = Boolean(page.videoTranscriptLastManualEditAt);
                if (syncedForCurrentId && (!forceRefresh || hasManualEdits)) {
                    return storedSegments;
                }
                if (!storedSegments.length && page.videoTranscript) {
                    const parsed = parseVttTranscript(page.videoTranscript);
                    if (parsed.length) {
                        page.videoTranscriptSentences = parsed;
                        page.videoTranscriptFetchedId = page.videoTranscriptId;
                        persistState();
                        return parsed;
                    }
                }
                try {
                    const assemblyKey = getAssemblyApiKey();
                    const vtt = await fetchAssemblyTranscriptVtt(page.videoTranscriptId, assemblyKey);
                    const vttSegments = vtt ? parseVttTranscript(vtt) : [];
                    if (vttSegments.length) {
                        page.videoTranscript = vtt;
                        page.videoTranscriptSentences = vttSegments;
                        page.videoTranscriptFetchedId = page.videoTranscriptId;
                        page.videoTranscriptLastManualEditAt = 0;
                        persistState();
                        return vttSegments;
                    }
                    const fallback = Array.isArray(page.assemblyTranscriptSentences)
                        ? page.assemblyTranscriptSentences
                        : [];
                    if (fallback.length) {
                        const fallbackVtt = buildVttFromSegments(fallback);
                        if (fallbackVtt) {
                            page.videoTranscript = fallbackVtt;
                        }
                        page.videoTranscriptSentences = fallback;
                        page.videoTranscriptFetchedId = page.videoTranscriptId;
                        page.videoTranscriptLastManualEditAt = 0;
                        persistState();
                        return fallback;
                    }
                } catch (err) {
                    console.warn("Échec de la récupération VTT vidéo", err);
                }
                return Array.isArray(page.videoTranscriptSentences) ? page.videoTranscriptSentences : [];
            }

            function getVideoTranscriptSegments(page) {
                if (!page) return [];
                const stored = Array.isArray(page.videoTranscriptSentences) ? page.videoTranscriptSentences : [];
                if (stored.length) {
                    return stored.map((sentence, index) => {
                        const start = Number.isFinite(sentence.start) ? sentence.start : 0;
                        let end = Number.isFinite(sentence.end) ? sentence.end : start + 2;
                        if (end <= start) end = start + 2;
                        return {
                            id: sentence.id || `segment-${index}`,
                            text: sentence.text || "",
                            start,
                            end
                        };
                    });
                }
                const parsed = parseVttTranscript(page.videoTranscript || "");
                if (parsed.length) return parsed;
                const legacyParsed = parseSrtTranscript(page.videoTranscript || "");
                if (legacyParsed.length) {
                    const converted = buildVttFromSegments(legacyParsed);
                    if (converted) {
                        page.videoTranscript = converted;
                    }
                    page.videoTranscriptSentences = legacyParsed;
                    persistState();
                    return legacyParsed;
                }
                const assembly = Array.isArray(page.assemblyTranscriptSentences) ? page.assemblyTranscriptSentences : [];
                if (assembly.length) {
                    return assembly.map((sentence, index) => ({
                        id: sentence.id || `sentence-${index}`,
                        text: sentence.text || "",
                        start: Number.isFinite(sentence.start) ? sentence.start : 0,
                        end: Number.isFinite(sentence.end) ? sentence.end : (Number.isFinite(sentence.start) ? sentence.start + 2 : 2)
                    }));
                }
                return [{
                    id: "segment-0",
                    text: page.videoTranscript || page.assemblyTranscript || "",
                    start: 0,
                    end: 2
                }];
            }

            function handleTranscriptUpdateFromModal(sentences) {

            function getAssemblyProxyUrl(path = "") {

            function getVoiceContextData() {
                const page = getActivePage();
                const participants = Array.isArray(page?.participants)
                    ? page.participants.map(participant => ({
                        name: participant?.name || "",
                        role: participant?.role || ""
                    })).filter(p => p.name || p.role)
                    : [];
                const subjects = Array.isArray(page?.subjects)
                    ? page.subjects.map(subject => ({
                        title: subject.title || "",
                        keySentences: (subject.keySentences || []).map(ks => ks?.text || "").filter(Boolean)
                    }))
                    : [];
                const voiceContextStrings = [
                    page?.title,
                    promptCreate?.value,
                    ...participants.map(p => [p.name, p.role].filter(Boolean).join(" ")),
                    ...subjects.flatMap(subject => [
                        subject.title,
                        ...subject.keySentences
                    ])
                ].filter(Boolean);
                return {
                    pageTitle: page?.title || "",
                    promptValue: promptCreate?.value || "",
                    participants,
                    subjects,
                    voiceContextStrings
                };
            }

            function getAssemblyKnownValues(page) {
                if (!page) return [];
                const values = [];
                (page.participants || []).forEach(participant => {
                    const name = (participant?.name || "").trim();
                    if (!name) return;
                    const role = (participant?.role || "").trim();
                    values.push(role ? `${name} (${role})` : name);
                });
                return values;
            }

            function buildAssemblyTranscriptPayload(uploadUrl, speakersExpected, knownValues = []) {
                const {
                    participants,
                    subjects,
                    voiceContextStrings
                } = getVoiceContextData();
                const keyterms = [];
                const seenKeyterms = new Set();
                voiceContextStrings.forEach(entry => {
                    const tokens = String(entry || "")
                        .split(/[^A-Za-zÀ-ÿ0-9'-]+/)
                        .filter(Boolean);
                    tokens.forEach(token => {
                        const lowered = token.toLowerCase();
                        if (seenKeyterms.has(lowered) || keyterms.length >= 14) return;
                        seenKeyterms.add(lowered);
                        keyterms.push(token);
                    });
                });
                const payload = {
                    audio_url: uploadUrl,
                    auto_chapters: true,
                    filter_profanity: true,
                    speaker_labels: true,
                    language_detection: true,
                    language_detection_options: {
                        expected_languages: ["en", "fr"],
                        fallback_language: "fr",
                    },
                    punctuate: true,
                    format_text: true,
                    ...(keyterms.length ? { keyterms_prompt: keyterms } : {})
                };
                if (speakersExpected > 0) {
                    payload.speakers_expected = speakersExpected;
                }
                if (knownValues.length) {
                    payload.speech_understanding = {
                        request: {
                            speaker_identification: {
                                speaker_type: "name",
                                known_values: knownValues
                            }
                        }
                    };
                }
                return payload;
            }

            function getNoteContentForMode(page, mode) {
                if (!page) return "";

                    if (Array.isArray(page.videoTranscriptSentences) && page.videoTranscriptSentences.length) {

                if (mode === NOTE_MODE_TRANSCRIPT_IA) {
                    return page.assemblyTranscript || "";

                if (mode === NOTE_MODE_TRANSCRIPT_AUTO) {
                    return page.manualTranscript || "";

            function formatAssemblyTimestamp(ms = 0) {
                const totalSeconds = Math.max(0, Math.floor(Number(ms) / 1000));
                const hours = Math.floor(totalSeconds / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;
                if (hours > 0) {
                    return `[${hours}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}]`;
                }
                return `[${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}]`;
            }

            function formatChapterTimestamp(ms) {
                const numeric = Number(ms);
                if (!Number.isFinite(numeric)) return "";
                const totalSeconds = Math.max(0, Math.floor(numeric / 1000));
                const hours = Math.floor(totalSeconds / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;
                const minuteStr = String(minutes).padStart(2, "0");
                const secondStr = String(seconds).padStart(2, "0");
                if (hours > 0) {
                    return `${String(hours).padStart(2, "0")}:${minuteStr}:${secondStr}`;
                }
                return `${minuteStr}:${secondStr}`;
            }

            function buildAutoTranscriptSummary(chapters) {
                if (!Array.isArray(chapters) || !chapters.length) return "";
                const entries = chapters
                    .map(chapter => {
                        const gist = (chapter?.gist || chapter?.headline || "").trim();
                        const summary = String(chapter?.summary || "").trim();
                        const timestamp = formatChapterTimestamp(chapter?.start ?? chapter?.start_time);
                        const headerParts = [];
                        if (timestamp) headerParts.push(timestamp);
                        if (gist) headerParts.push(gist);
                        const lines = [];
                        if (headerParts.length) {
                            lines.push(headerParts.join(" "));
                        }
                        if (summary) {
                            lines.push(summary);
                        }
                        if (!lines.length) return null;
                        return lines.join("\n");
                    })
                    .filter(Boolean);
                return entries.join("\n\n");
            }

            function buildTranscriptFromUtterances(result) {
                const utterances = Array.isArray(result?.utterances) ? result.utterances : [];
                if (!utterances.length) {
                    return (result?.text || "").trim();
                }
                return utterances
                    .map(utterance => {
                        const speaker = (utterance?.speaker || "Participant").trim();
                        const text = (utterance?.text || "").trim();
                        if (!text) return null;
                        const timestamp = formatAssemblyTimestamp(utterance?.start);
                        return `${timestamp} ${speaker}\n${text}`;
                    })
                    .filter(Boolean)
                    .join("\n\n");
            }

            function extractAssemblySentences(result) {
                if (!result) return [];
                const mapSentences = (raw = []) => {
                    return raw
                        .map((sentence, index) => {
                            const startMs = Number.isFinite(sentence.start)
                                ? sentence.start
                                : Number.isFinite(sentence.start_time)
                                    ? sentence.start_time
                                    : 0;
                            const endMs = Number.isFinite(sentence.end)
                                ? sentence.end
                                : Number.isFinite(sentence.end_time)
                                    ? sentence.end_time
                                    : startMs;
                            const start = startMs / 1000;
                            const end = endMs > start ? endMs / 1000 : start + 0.1;
                            return {
                                id: sentence.id || `sentence-${index}`,
                                text: (sentence.text || "").trim(),
                                start,
                                end
                            };
                        })
                        .filter(sentence => Boolean(sentence.text) || sentence.start >= 0);
                };
                const rawSentences = Array.isArray(result.sentences) ? result.sentences : [];
                if (rawSentences.length) {
                    return mapSentences(rawSentences);
                }
                const utterances = Array.isArray(result.utterances) ? result.utterances : [];
                if (utterances.length) {
                    return mapSentences(
                        utterances.map(utterance => ({
                            id: utterance.id || undefined,
                            text: utterance.text || "",
                            start: utterance.start,
                            end: utterance.end
                        }))
                    );
                }
                return [];
            }

            function delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            async function uploadAudioToAssembly(blob, key) {
                if (!blob) throw new Error("Audio absent");
                const url = getAssemblyProxyUrl("upload");
                if (!url) throw new Error("Proxy AssemblyAI indisponible");
                const response = await fetch(url, {
                    method: "POST",
                    headers: {
                        ...(key ? { "X-AssemblyAI-Key": key } : {}),
                        "Content-Type": blob.type || "audio/webm"
                    },
                    body: blob
                });
                let data = null;
                try {
                    data = await response.json();
                } catch (err) {
                    console.warn("AssemblyAI upload response parse failed", err);
                }
                if (!response.ok) {
                    throw new Error(`Envoi audio échoué (${response.status})`);
                }
                if (!data?.upload_url) {
                    throw new Error("URL audio manquante");
                }
                return data.upload_url;
            }

            async function requestAssemblyTranscript(payload, key) {
                const url = getAssemblyProxyUrl("transcript");
                if (!url) throw new Error("Proxy AssemblyAI indisponible");
                const response = await fetch(url, {
                    method: "POST",
                    headers: {
                        ...(key ? { "X-AssemblyAI-Key": key } : {}),
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });
                const responseText = await response.text();
                if (!response.ok) {
                    const detail = responseText ? `: ${responseText.replace(/\s+/g, " ").trim()}` : "";
                    const err = new Error(`Requête transcription échouée (${response.status})${detail}`);
                    err.status = response.status;
                    err.responseText = responseText;
                    throw err;
                }
                let data;
                try {
                    data = responseText ? JSON.parse(responseText) : null;
                } catch (err) {
                    console.warn("AssemblyAI transcript response parse failed", err);
                    data = null;
                }
                if (!data?.id) {
                    throw new Error("ID de transcription manquante");
                }
                return data.id;
            }

            async function pollAssemblyTranscript(transcriptId, key) {
                const url = getAssemblyProxyUrl(`transcript/${transcriptId}`);
                if (!url) throw new Error("Proxy AssemblyAI indisponible");
                for (let attempt = 0; attempt < 40; attempt++) {
                    const response = await fetch(url, {
                        headers: key ? { "X-AssemblyAI-Key": key } : {}
                    });
                    const responseText = await response.text();
                    const preview = responseText.slice(0, 400);
                    if (!response.ok) {
                        throw new Error(`Échec du suivi (${response.status})`);
                    }
                    let data = null;
                    try {
                        data = responseText ? JSON.parse(responseText) : null;
                    } catch (err) {
                        console.warn("AssemblyAI transcript GET response parse failed", err);
                        throw new Error("Réponse AssemblyAI invalide");
                    }
                    if (!data) {
                        throw new Error("Réponse AssemblyAI invalide");
                    }
                    if (data.status === "completed") {
                        return data;
                    }
                    if (data.status === "error") {
                        throw new Error(data.error || "Erreur AssemblyAI");
                    }
                    await delay(1200);
                }
                throw new Error("Timeout AssemblyAI");
            }

            async function processAssemblyRecording(blob, options = {}) {
                const {
                    targetNoteMode = NOTE_MODE_TRANSCRIPT_IA,
                    skipModeApply = false,
                    toastLabel = "Transcription"
                } = options;
                if (!blob) return;
                if (assemblyRequestInProgress) return;
                const assemblyKey = getAssemblyApiKey();
                const baseUrl = ASSEMBLY_PROXY_BASE_URL;
                if (!baseUrl) {
                    showToast("Proxy AssemblyAI indisponible.", true);
                    return;
                }
                assemblyRequestInProgress = true;
                showToast(`${toastLabel} en cours…`, false, 5200);
                try {
                    const uploadUrl = await uploadAudioToAssembly(blob, assemblyKey);
                    const page = getActivePage();
                    const participantsWithNames = (page?.participants || []).filter(participant => (participant?.name || "").trim());
                    const knownValues = getAssemblyKnownValues(page);
                    const payload = buildAssemblyTranscriptPayload(uploadUrl, participantsWithNames.length, knownValues);
                    let transcriptId;
                    try {
                        transcriptId = await requestAssemblyTranscript(payload, assemblyKey);
                    } catch (err) {
                        const responseText = String(err?.responseText || "");
                        const schemaError = responseText.includes("Invalid endpoint schema");
                        if (err?.status === 400 && schemaError) {
                            const fallbackPayload = {
                                audio_url: uploadUrl,
                                speaker_labels: true,
                                language_detection: true,
                                punctuate: true,
                                format_text: true,
                                ...(participantsWithNames.length > 0 ? { speakers_expected: participantsWithNames.length } : {})
                            };
                            console.warn("AssemblyAI payload rejected, retrying with fallback schema", {
                                error: responseText,
                                fallbackPayload
                            });
                            transcriptId = await requestAssemblyTranscript(fallbackPayload, assemblyKey);
                        } else {
                            throw err;
                        }
                    }
                    const result = await pollAssemblyTranscript(transcriptId, assemblyKey);
                    const finalText = buildTranscriptFromUtterances(result);
                    if (!finalText) {
                        throw new Error("Transcription vide");
                    }
                    transcriptPrefix = finalText;
                    lastCaret = finalText.length;
                    const activePage = getActivePage();
                    if (activePage) {
                        const assemblySentences = extractAssemblySentences(result);
                        const videoTranscriptString = assemblySentences.length
                            ? buildVttFromSegments(assemblySentences)
                            : "";
                        activePage.assemblyTranscript = finalText;
                        activePage.assemblyTranscriptId = transcriptId;
                        activePage.assemblyTranscriptSentences = assemblySentences;
                        activePage.assemblyTranscriptLastManualEditAt = 0;
                        activePage.videoTranscript = videoTranscriptString;
                        activePage.videoTranscriptId = transcriptId;
                        activePage.videoTranscriptSentences = assemblySentences;
                        activePage.videoTranscriptFetchedId = transcriptId;
                        activePage.videoTranscriptLastManualEditAt = 0;
                        activePage.audioTranscriptVersion = Number.isFinite(activePage.audioRecordingVersion)
                            ? activePage.audioRecordingVersion
                            : 0;
                        const transcriptSummary = buildAutoTranscriptSummary(result?.chapters);
                        const previousTranscriptSummary = activePage.transcriptSummary || "";
                        activePage.manualTranscriptSummary = previousTranscriptSummary;
                        activePage.autoTranscriptSummary = transcriptSummary;
                        activePage.transcriptSummary = transcriptSummary;
                        if (isTranscriptSummaryMode(activeNoteMode)) {
                            refreshSummaryTextarea();
                        }
                    }
                    if (!skipModeApply) {
                        applyNoteMode(targetNoteMode);
                    } else {
                        persistState();
                    }
                    showToast(`${toastLabel} terminée.`);
                } catch (err) {
                    console.error("AssemblyAI transcription failed", err);

            function updateAudioProgress() {
                if (!audioProgress) return;
                const totalDuration = Math.max(
                    0,
                    Number.isFinite(audioPlayer?.duration) ? audioPlayer.duration : 0,
                    Number.isFinite(recordingElapsedSec) ? recordingElapsedSec : 0
                );
                if (!totalDuration) {
                    audioProgress.value = 0;
                    return;
                }
                const ratio = Math.min(1, Math.max(0, audioPlayer.currentTime / totalDuration));
                audioProgress.value = ratio;
            }

            async function ensureAudioRecording() {
                if (!navigator.mediaDevices?.getUserMedia) return false;
                if (mediaRecorder && mediaRecorder.state === "recording") return true;
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                } catch (err) {
                    console.error("Micro indisponible", err);
                    showToast("Micro indisponible pour l'enregistrement audio.", true);
                    return false;
                }
                const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
                    ? "audio/webm;codecs=opus"
                    : "audio/webm";
                audioChunks = [];
                try {
                    mediaRecorder = new MediaRecorder(mediaStream, { mimeType: mime });
                } catch (err) {
                    console.error("MediaRecorder indisponible", err);
                    showToast("Enregistrement local indisponible.", true);
                    return false;
                }
                mediaRecorder.ondataavailable = e => {
                    if (e.data && e.data.size > 0) {
                        audioChunks.push(e.data);
                    }
                };
                mediaRecorder.onstop = async () => {
                    if (mediaStream) {
                        mediaStream.getTracks().forEach(track => track.stop());
                        mediaStream = null;
                    }
                    try {
                        await finalizeAudioSegment(mime);
                        if (audioBlob && !assemblyRequestInProgress) {
                            await processAssemblyRecording(audioBlob, {
                                targetNoteMode: NOTE_MODE_TRANSCRIPT_IA,
                                skipModeApply: false,
                                toastLabel: "Transcription"
                            });
                        }
                    } catch (err) {
                        console.warn("Finalisation audio échouée", err);
                    }
                    mediaRecorder = null;
                };
                mediaRecorder.start();
                return true;
            }

            function stopAudioRecording() {
                try {
                    if (mediaRecorder && mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                    } else if (mediaStream) {
                        mediaStream.getTracks().forEach(track => track.stop());
                        mediaStream = null;
                        mediaRecorder = null;
                    }
                } catch (err) {
                    console.warn("Stop audio recording", err);

                stopScreenRecording();
                audioRecordingActive = false;

                pendingAudioMerge.catch(() => { /* noop */ }).then(() => {
                    const duration = Number.isFinite(audioPlayer?.duration) ? audioPlayer.duration : 0;
                    const nearEnd = duration > 0 && (audioPlayer.ended || audioPlayer.currentTime >= duration - 0.05);
                    const needsReload = !duration || Number.isNaN(duration) || audioPlayer.readyState < 1;
                    if (needsReload) {
                        audioPlayer.load();
                    }
                    if (nearEnd || needsReload) {
                        audioPlayer.currentTime = 0;
                        if (audioProgress) {

            function normalizePlaybackRate(value) {
                const numeric = Number(value);

                return Math.min(2, Math.max(0.5, Math.round(numeric * 10) / 10));
            }

            async function completeGuidelinesFromTranscript() {
                const page = getActivePage();
                if (!page) return;
                const summaryContent = (summaryTextarea?.value || "").trim();
                if (!summaryContent) {
                    showToast("Ajoute un résumé avant d'exécuter ⌘ Retranscrire.", true);
                    return;
                }
                const transcript = (transcribeInput?.value || "").trim();
                if (!transcript) {
                    showToast("Ajoute une transcription avant de compléter.", true);
                    return;
                }
                if (hasCustomGuidelineData(page)) {
                    const preview = transcript.replace(/\s+/g, " ").slice(0, 120);
                    const labelSuffix = transcript.length > 120 ? "…" : "";
                    const confirmMsg = preview
                        ? `Des sujets existent déjà et seront remplacés par cette transcription : "${preview}${labelSuffix}". Continuer ?`
                        : "Des sujets existent déjà et seront remplacés par la transcription actuelle. Continuer ?";
                    if (!window.confirm(confirmMsg)) return;
                    clearGuidelineData();
                }
                completeBtn?.setAttribute("disabled", "true");
                completeActionCountdown?.start(30);
                try {
                    const promptTemplate = promptState.complete || promptDefaults.complete || "";
                    const transcriptContentParts = [];
                    if (summaryContent) transcriptContentParts.push(summaryContent);
                    if (transcript && transcript !== summaryContent) transcriptContentParts.push(transcript);
                    const transcriptPayload = transcriptContentParts.join("\n\n");
                    const prompt = promptTemplate.replace(/{{transcript_content}}/gi, transcriptPayload);
                    const payload = {
                        model: (window.GoToolkitIAConfig && window.GoToolkitIAConfig.getOpenAiModel?.()) || "gpt-5-nano",
                        input: [
                            {
                                role: "system",
                                content: prompt
                            }
                        ],
                        max_output_tokens: 1200
                    };
                    const response = await window.GoToolkitIA.chatCompletion({ payload });
                    const cleaned = response.trim().replace(/^```(?:json)?/i, "").replace(/```$/i, "").trim();
                    const parsed = JSON.parse(cleaned);
                    if (!parsed || typeof parsed !== "object") {
                        throw new Error("Réponse IA invalide");
                    }
                    const subjectsRaw = Array.isArray(parsed.subjects) ? parsed.subjects : [];
                    const subjectsWithMinutes = subjectsRaw.map(subject => {
                        const timeframe = subject.timeframe || {};
                        const startSeconds = Number.isFinite(Number(timeframe.start)) ? Number(timeframe.start) :
                            Number.isFinite(Number(timeframe.start_seconds)) ? Number(timeframe.start_seconds) :
                                Number.isFinite(Number(timeframe.startSeconds)) ? Number(timeframe.startSeconds) : 0;
                        const endSeconds = Number.isFinite(Number(timeframe.end)) ? Number(timeframe.end) :
                            Number.isFinite(Number(timeframe.end_seconds)) ? Number(timeframe.end_seconds) :
                                Number.isFinite(Number(timeframe.endSeconds)) ? Number(timeframe.endSeconds) :
                                    Math.max(startSeconds + DEFAULT_SUBJECT_DURATION * 60, 0);
                        const normalizedKeySentences = Array.isArray(subject.keySentences)
                            ? subject.keySentences.map(entry => {
                                if (!entry || typeof entry !== "object") return entry;
                                return {
                                    ...entry,
                                    match: entry.match === "indirect" ? "partiel" : entry.match
                                };
                            })
                            : subject.keySentences;
                        return {
                            ...subject,
                            timeframe: {
                                start: convertSecondsToMinutes(startSeconds),
                                end: convertSecondsToMinutes(Math.max(endSeconds, startSeconds + 1))
                            },
                            keySentences: normalizedKeySentences
                        };
                    });
                    const normalizedSubjects = normalizeSubjects(subjectsWithMinutes);
                    page.subjects = normalizedSubjects;
                    page.activeSubjectId = normalizedSubjects[0]?.id || null;
                    const lastSubject = normalizedSubjects[normalizedSubjects.length - 1];
                    const lastEnd = Number(lastSubject?.timeframe?.end || 0);
                    page.duration = lastEnd || page.duration || DEFAULT_SUBJECT_DURATION;
                    page.__guidelinesCleared = false;
                    if (Array.isArray(parsed.participants) && parsed.participants.length) {
                        page.participants = ensureParticipants(parsed.participants);
                    } else {
                        page.participants = ensureParticipants(page.participants);
                    }
                    const scriptPayload = JSON.stringify(parsed, null, 2);
                    if (promptModify) promptModify.value = scriptPayload;
                    page.script = scriptPayload;
                    persistState();
                    renderGuidelines();
                    showToast("Guidelines complétés.");
                } catch (err) {
                    console.error("Complete guidelines failed", err);
                    showToast("Impossible de compléter via IA.", true);
                } finally {
                    completeBtn?.removeAttribute("disabled");
                    completeActionCountdown?.stop();
                }
            }

            function hasCustomGuidelineData(page) {
                if (!page || !Array.isArray(page.subjects) || !page.subjects.length) return false;
                return page.subjects.some(subject => {

                    return hasCustomTitle || hasCustomKeys;

            function determineVoiceRestoreTarget(preferred, hasAi, hasManual) {
                if (preferred === "ai") {
                    if (hasAi) return "ai";

                    if (hasManual) return "manual";
                    if (hasAi) return "ai";
                }
                if (hasAi) return "ai";
                if (hasManual) return "manual";
                return null;
            }

            function nextVoiceRestorePreference(lastUsed, hasAi, hasManual) {
                if (lastUsed === "ai") {
                    return hasManual ? "manual" : (hasAi ? "ai" : "manual");
                }
                if (lastUsed === "manual") {
                    return hasAi ? "ai" : (hasManual ? "manual" : "ai");
