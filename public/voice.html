<!DOCTYPE html>
<html lang="fr">

<head>
    <script>window.GO_TOOLKIT_SHARE_API_URL = 'https://share.gotoolkit.workers.dev/'</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice | Go-Toolkit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="styles/app-shell.css?v=2025.12.28">
    <link rel="stylesheet" href="styles/cgu.css?v=2025.12.28">
    <style>
        :root {
            --bg: #f3f4f6;
            --surface: #ffffff;
            --surface-soft: #f8fafc;
            --border: #e5e7eb;
            --border-strong: #cbd5e1;
            --primary: #2a7a57;
            --primary-soft: rgba(42, 122, 87, 0.1);
            --text: #0f172a;
            --muted: #6b7280;
            --radius-lg: 16px;
            --radius-sm: 10px;
            --shadow-soft: 0 14px 34px rgba(15, 23, 42, 0.1);
        }

        #audioDownloadBtn:disabled,
        .audio-import-btn:disabled,
        .audio-import-btn[disabled] {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        .audio-import-btn {
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            border: 1px solid var(--app-border, #dfe3f5);
            background: var(--app-surface, #ffffff);
            color: var(--app-primary-strong, #1f2a56);
            padding: 6px 10px;
            min-height: 30px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, color 0.15s ease;
            box-shadow: none;

        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--app-font, "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
            overflow: hidden;
        }

        .app {
            height: 100vh;
            max-width: none;
        }

        .app-main {
            display: grid;
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
            gap: 12px;
            min-height: 0;
            height: calc(100vh - 20px);
        }

        .app-main.context-open {
            grid-template-columns: 1fr 350px;
        }

        .voice-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 0;
            width: 100%;
        }

        .voice-main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .voice-title {
            font-size: 15px;
            font-weight: 500;
            margin: 0;
            padding: 4px 8px;
            border-radius: 10px;
            border: 1px solid transparent;
            cursor: text;
            min-width: 120px;
            max-width: 100%;
        }

        .voice-title:focus-visible {
            outline: none;
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .voice-main-body {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 8px;
            min-height: 0;
            flex: 1 1 auto;
        }

        .app-main:not(.context-open) .voice-main-body {
            grid-template-columns: minmax(0, 1fr) 450px;
        }

        .panel {
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--surface-soft);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
            height: 100%;
            overflow: hidden;
        }

        .panel-columns {
            display: block;
        }

        @media (min-width: 1400px) {
            .app-main:not(.context-open) .panel-columns {
                display: grid;
                grid-template-columns: minmax(450px, 1fr) minmax(0, 1fr);
                gap: 12px;
                flex: 1 1 0;
                min-height: 0;
                align-content: stretch;
            }



            .app-main:not(.context-open) .summary-column {
                height: 100%;
                gap: 4px;
            }

            .app-main:not(.context-open) .summary-wrapper {
                flex: 1 1 0;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }

            .app-main:not(.context-open) .summary-area {
                flex: 1 1 0;
                min-height: 0;
                height: 100%;
                overflow-y: auto;
            }
        }

        .app-main.context-open .panel-columns {
            display: flex;
            flex-direction: column;
            flex: 1 1 0;
            min-height: 0;
            gap: 6px;
        }

        .app-main.context-open .note-column {
            flex: 1 1 0;
        }


        .note-column,
        .summary-column {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 0;
            height: 100%;
            margin-top: 0;
        }

        .note-column {
            min-width: 400px;
        }

        .note-column .transcribe-wrapper {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .note-column .transcribe-area {
            min-height: 100px;
        }

        .summary-column .summary-wrapper {
            flex: 0 0 auto;
            min-height: 0;
        }

        .app-main.context-open .note-column,
        .app-main.context-open .summary-column {
            height: auto;
            margin-top: 6px;
        }

        @media (max-width: 1399px) {

            .app-main:not(.context-open) .note-column,
            .app-main:not(.context-open) .summary-column {
                margin-top: 6px;
            }
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            color: var(--text);
            font-size: 14px;
        }

        .panel-header .summary-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .note-mode-select {
            font-size: 13px;
            border-radius: 8px;
            border: 1px solid var(--border-strong);
            padding: 4px 4px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
        }

        .recording-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .audio-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 170px;
            flex: 1 1 auto;
        }

        .audio-controls-left {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .audio-controls-right {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
            padding-left: 6px;
            margin-right: 6px;
        }

        .audio-download-right {
            margin-left: auto;
            display: flex;
            align-items: center;
        }

        .audio-download {
            position: relative;
            display: inline-flex;
        }

        #audioClearBtn {
            margin-left: auto;
        }



        .audio-download-menu {
            position: absolute;
            top: 110%;
            right: 0;
            background: #fff;
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            box-shadow: var(--shadow-soft);
            display: none;
            flex-direction: column;
            min-width: 180px;
            z-index: 20;
            padding: 6px 0;
        }

        .audio-download-menu.open {
            display: flex;
        }

        .audio-download-option {
            border: none;
            background: transparent;
            text-align: left;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 12px;
            color: var(--text);
            width: 100%;
        }

        .audio-download-option:hover:not(:disabled) {
            background: var(--surface-soft);
        }

        .audio-download-option:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #audioDownloadBtn {
            margin-right: 4px;
        }

        .audio-play-btn,
        .audio-download-btn,
        .screen-toggle {
            border: 1px solid var(--border-strong);
            background: transparent;
            border-radius: 8px;
            padding: 2px 6px;
            font-size: 15px;
            cursor: pointer;
        }


        .audio-progress {
            width: 90px;
            accent-color: var(--primary);
            appearance: none;
            height: 6px;
            border-radius: 6px;
            background: #e5e7eb;
            outline: none;
        }

        body.recording-border::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            border: 4px solid #B11226;
            box-shadow: 0 0 12px rgba(177, 18, 38, 0.45);
            animation: recording-border-pulse 1.6s infinite ease-in-out;
            z-index: 9998;
        }

        @keyframes recording-border-pulse {
            0% {
                box-shadow: 0 0 12px rgba(177, 18, 38, 0.45);
            }

            50% {
                box-shadow: 0 0 18px rgba(177, 18, 38, 0.65);
            }

            100% {
                box-shadow: 0 0 12px rgba(177, 18, 38, 0.45);
            }
        }

        .recording-countdown-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: #fff;
            font-family: "Inter", system-ui, sans-serif;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s ease, visibility 0.2s ease;
        }

        .recording-countdown-overlay.visible {
            visibility: visible;
            opacity: 1;
        }

        .recording-countdown-number {
            font-size: 120px;
            font-weight: 700;
        }

        .voice-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            z-index: 11000;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            padding: 32px;
            box-sizing: border-box;
        }

        .voice-overlay.visible {
            display: flex;
        }

        .voice-overlay__ready {
            font-size: 78px;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            user-select: none;
            line-height: 1;
            margin: 100px auto 0;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .voice-overlay__ready:hover {
            transform: scale(1.04);
            color: #facc15;
        }

        .voice-overlay__tiles {
            display: flex;
            gap: 18px;
            justify-content: center;
            align-items: flex-end;
            width: 100%;
            height: 66vh;
            pointer-events: none;
            position: relative;
            z-index: 2;
            align-self: flex-end;
        }

        .voice-overlay__tile {
            width: 300px;
            height: 300px;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.18), rgba(0, 0, 0, 0.5));
            position: relative;
            overflow: hidden;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5), 0 0 0 6px rgba(255, 255, 255, 0.05);
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
        }

        .voice-overlay__tile video,
        .voice-overlay__tile canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .voice-overlay__tile-label {
            position: relative;
            z-index: 2;
            padding: 8px 10px;
            backdrop-filter: blur(4px);
            background: rgba(0, 0, 0, 0.35);
            border-radius: 10px;
            font-size: 18px;
        }

        .voice-overlay__tile-label:empty {
            display: none;
        }

        .voice-overlay__tile--active {
            border-color: #facc15;
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.65), 0 0 0 6px rgba(250, 204, 21, 0.18);
        }

        .voice-overlay__caption {
            text-align: center;
            font-size: 14px;
            opacity: 0.85;
            margin-bottom: -8px;
        }

        .voice-overlay--recording {
            padding: 28px;
            background: #000;
        }

        .recording-live-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 18px;
            width: 100%;
            height: 100%;
            align-items: stretch;
        }

        .recording-live-column {
            display: flex;
            flex-direction: column;
            gap: 18px;
            height: 100%;
        }

        .recording-live-timer {
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 32px;
            font-weight: 700;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            height: 150px;
            align-self: start;
            width: 100%;
        }

        .recording-live-timer__logo {
            width: auto;
            height: 150px;
            object-fit: contain;
            transition: opacity 0.2s ease;
        }

        .recording-live-timer__value {
            min-width: 0;
            transition: opacity 0.2s ease;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-left: auto;
            height: 100%;
            text-align: center;
        }

        .recording-live-timer__text {
            z-index: 1;
            width: 100%;
        }

        .recording-live-stop-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-right: 18px;
            font-size: 48px;
            font-weight: 800;
            color: #f87171;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s ease;
            z-index: 2;
        }

        .recording-live-timer__value:hover .recording-live-stop-label {
            opacity: 1;
        }

        .recording-live-timer__value:hover .recording-live-timer__text {
            opacity: 0.15;
        }

        .recording-live-visual {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            height: 300px;
        }

        .recording-live-visual video,
        .recording-live-visual canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: rgba(255, 255, 255, 0.05);
        }

        .recording-live-note {
            background: transparent;
            border-radius: 16px;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }

        .recording-live-column--left .recording-live-subjects {
            flex: 1;
        }

        .recording-live-column--right .recording-live-visual {
            flex: 0 0 auto;
        }

        .recording-live-column--right .recording-live-note {
            flex: 1;
        }

        .recording-live-note-field {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 20px;
            font-family: var(--app-font, "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
            resize: none;
            width: 100%;
            min-height: 100px;
            outline: none;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 0 0 1px transparent;
            line-height: 1.4;
            flex: 1;
        }

        .recording-live-note-field:focus,
        .recording-live-note-field:focus-visible {
            border: 2px solid white;
        }

        .recording-live-note-field::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .recording-live-subjects {
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: hidden;
        }

        .recording-live-subject-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0;
            font-size: 36px;
            font-weight: 700;
            text-align: center;
        }

        .recording-live-arrow {
            border: none;
            background: transparent;
            color: #fff;
            border-radius: 12px;
            font-size: 28px;
            width: 60px;
            height: 60px;
            cursor: pointer;
        }

        .recording-live-subject-title {
            flex: 1 1 auto;
            text-align: center;
            padding: 0 12px;
            line-height: 1.2;
        }

        .recording-live-keylist {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            gap: 10px;
            align-items: flex-start;
        }

        .recording-live-key {
            border: 5px solid transparent;
            border-radius: 14px;
            padding: 12px;
            font-size: 30px;
            min-height: 110px;
            background: rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: left;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.12s ease, background 0.12s ease;

        }

        .recording-live-key.status-addressed {
            border-color: #fbbf24;
            background: rgba(251, 191, 36, 0.08);
        }

        .recording-live-key.status-done {
            border-color: #34d399;
            background: rgba(52, 211, 153, 0.1);
        }

        @media (max-width: 1100px) {
            .recording-live-grid {
                grid-template-columns: 1fr;
                grid-template-rows: 150px minmax(150px, 1fr) minmax(120px, 1fr);
            }

            .voice-overlay__tiles {
                height: 58vh;
            }
        }

        .audio-progress::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px var(--border-strong);
        }

        .audio-progress::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px var(--border-strong);
        }

        .audio-speed {
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 13px;
            background: #fff;
        }

        .screen-toggle.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .toast {
            z-index: 12100;
        }

        .info-popup {
            position: absolute;
            top: 56px;
            right: 12px;
            width: 280px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 15px;
            display: none;
            flex-direction: column;
            gap: 6px;
            font-size: 12px;
            z-index: 200;
        }

        .info-popup.open {
            display: flex;
        }

        .info-popup img {
            width: 144px;
            height: 144px;
            object-fit: contain;
            align-self: center;
        }

        .info-popup a {
            color: #2a7a57;
            text-decoration: none;
            font-weight: 600;
        }

        .info-popup button {
            border-radius: 8px;
            border: 1px solid rgba(15, 23, 42, 0.15);
            background: #fff;
            color: #0f172a;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
            min-width: 110px;
        }

        .info-popup button.update-btn {
            background: #2a7a57;
            border-color: #2a7a57;
            color: #fff;
        }

        .info-popup button.secondary {
            background: #fff;
            border-color: rgba(15, 23, 42, 0.15);
            color: #0f172a;
        }

        .info-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        textarea {
            width: 100%;
            border-radius: 10px;
            border: 1px solid var(--border-strong);
            padding: 8px 10px;
            font-size: 13px;
            font-family: Menlo, Consolas, "Courier New", monospace;
            resize: none;
            min-height: 120px;
            background: #fff;
            line-height: 1.45;
        }

        textarea:focus,
        input:focus {
            outline: none;
            border: 1px solid var(--primary);
            box-shadow: 0 0 0 1px var(--primary-soft);
        }

        .transcribe-area {
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.3;
            min-height: 0;
            height: 100%;
        }

        .transcribe-wrapper {
            position: relative;
            height: 100%;
            min-height: 0;
        }

        textarea::-webkit-scrollbar,
        .transcribe-area::-webkit-scrollbar,
        .summary-area::-webkit-scrollbar,
        .ia-prompt-field::-webkit-scrollbar,
        #iaTemplateEditor::-webkit-scrollbar,
        #promptCreate::-webkit-scrollbar,
        #promptModify::-webkit-scrollbar,
        #newSubjectPoints::-webkit-scrollbar {
            width: 2px;
        }

        textarea::-webkit-scrollbar-thumb,
        .transcribe-area::-webkit-scrollbar-thumb,
        .summary-area::-webkit-scrollbar-thumb,
        .ia-prompt-field::-webkit-scrollbar-thumb,
        #iaTemplateEditor::-webkit-scrollbar-thumb,
        #promptCreate::-webkit-scrollbar-thumb,
        #promptModify::-webkit-scrollbar-thumb,
        #newSubjectPoints::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.45);
            border-radius: 4px;
        }

        /* Firefox scrollbar color for textarea-like fields */
        textarea,
        .transcribe-area,
        .summary-area,
        .ia-prompt-field,
        #iaTemplateEditor,
        #promptCreate,
        #promptModify,
        #newSubjectPoints {
            scrollbar-color: rgba(156, 163, 175, 0.45) transparent;
        }

        .transcribe-ghost {
            position: absolute;
            inset: 0;
            padding: 8px 10px;
            pointer-events: none;
            transform: translate(0, 0);
            color: var(--muted);
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.3;
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            z-index: 3;
        }

        .transcribe-mirror {
            position: absolute;
            visibility: hidden;
            white-space: pre-wrap;
            word-wrap: break-word;
            padding: 8px 10px;
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.3;
            inset: 0;
        }

        .transcribe-ghost span {
            font-size: 13px;
        }

        .speech-field-wrapper {
            position: relative;
            height: 100%;
        }

        .speech-field-wrapper textarea {
            position: relative;
            z-index: 2;
        }

        .speech-button {
            position: absolute;
            top: 6px;
            right: 6px;

            function formatRelativeTime(value) {
                if (!value) return "";
                try {
                    const timestamp = new Date(value).getTime();
                    if (Number.isNaN(timestamp)) return "";
                    const deltaSeconds = Math.max(0, Math.floor((Date.now() - timestamp) / 1000));
                    if (deltaSeconds < 60) {
                        return "Mis à jour à l'instant";
                    }
                    const deltaMinutes = Math.floor(deltaSeconds / 60);
                    if (deltaMinutes < 60) {
                        return `Mis à jour il y a ${deltaMinutes} minute${deltaMinutes > 1 ? "s" : ""}`;
                    }
                    const deltaHours = Math.floor(deltaMinutes / 60);
                    if (deltaHours < 24) {
                        return `Mis à jour il y a ${deltaHours} heure${deltaHours > 1 ? "s" : ""}`;
                    }
                    const deltaDays = Math.floor(deltaHours / 24);
                    return `Mis à jour il y a ${deltaDays} jour${deltaDays > 1 ? "s" : ""}`;
                } catch (err) {

                    page.tabLabel = page.title;
                    state.pages = [page];
                    state.activePageId = page.id;
                    persistState();
                    renderTabs();
                    renderPage();
                    openTemplateModal();
                    return;
                }
                state.activePageId = state.pages[0]?.id || null;
                persistState();
                renderTabs();
                renderPage();
            }

            function renderTabs() {
                if (!viewTabs) return;
                viewTabs.innerHTML = "";
                state.pages.forEach((page, idx) => {
                    if (!page.tabLabel) {
                        page.tabLabel = page.title || `Page ${idx + 1}`;
                    }
                    const btn = document.createElement("button");
                    btn.className = "tab" + (page.id === state.activePageId ? " active" : "");
                    btn.type = "button";
                    btn.textContent = page.tabLabel || page.title || "Page";
                    btn.addEventListener("click", () => setActivePage(page.id));
                    btn.addEventListener("dblclick", () => {
                        const next = prompt("Renommer l'onglet ?", page.tabLabel || page.title || "");
                        if (next && next.trim()) {
                            page.tabLabel = next.trim();
                            persistState();
                            renderTabs();
                        }
                    });
                    viewTabs.appendChild(btn);
                });
            }

            function updateTranscriptMeta() {
                if (!transcribeInput || !transcriptMeta) return;
                const formatTime = secs => {
                    const total = Math.max(0, Math.floor(secs || 0));
                    const m = Math.floor(total / 60);
                    const s = total % 60;
                    return `${m}'${String(s).padStart(2, "0")}"`;
                };
                const page = getActivePage();
                const totalMinutes = page?.duration
                    ? Number(page.duration)
                    : (page?.subjects?.length || 0) * DEFAULT_SUBJECT_DURATION;
                const totalSeconds = Math.max(0, Math.floor((totalMinutes || 0) * 60));
                if (audioRecordingActive) {
                    transcriptMeta.textContent = `${formatTime(recordingElapsedSec)} / ${formatTime(totalSeconds)}`;
                    return;
                }
                const hasAudio = audioUrl && !Number.isNaN(audioPlayer?.duration || NaN) && (audioPlayer?.duration || 0) > 0;
                if (hasAudio) {
                    const rawCurrent = Math.max(0, audioPlayer.currentTime || 0);
                    const rawTotal = Math.max(0, audioPlayer.duration || 0);
                    const recordedTotal = Math.max(
                        Math.round(rawTotal),
                        Math.ceil(recordingElapsedSec || rawTotal || 0)
                    );
                    const nearEnd = recordedTotal > 0 && (audioPlayer.ended || rawCurrent >= rawTotal - 0.25);
                    const roundedCurrent = nearEnd
                        ? recordedTotal
                        : Math.min(recordedTotal, Math.max(0, Math.round(rawCurrent)));
                    transcriptMeta.textContent = `${formatTime(roundedCurrent)} / ${formatTime(recordedTotal)}`;
                    return;
                }
                const elapsedSec = recordingElapsedSec || 0;
                transcriptMeta.textContent = `${formatTime(elapsedSec)} / ${formatTime(totalSeconds)}`;
            }

            function getLastTimestampMinuteFromTranscript(text = "") {
                const regex = /\[(\d{2,}):(\d{2})\]/g;
                let match = null;
                let last = null;
                while ((match = regex.exec(text)) !== null) {
                    const mins = Number(match[1]);
                    const secs = Number(match[2]);
                    if (!Number.isNaN(mins) && !Number.isNaN(secs)) {
                        last = Math.floor((mins * 60 + secs) / 60);
                    }
                }
                return last;
            }

            function updateGhostOverlay(interimText = "") {
                if (!transcribeInput || !transcribeGhost || !transcribeMirror) return;
                const ghostText = interimText || "";
                if (!ghostText) {
                    transcribeGhost.textContent = "";
                    transcribeGhost.style.transform = "translate(0, 0)";
                    return;
                }
                const styles = window.getComputedStyle(transcribeInput);
                transcribeMirror.style.fontSize = styles.fontSize;
                transcribeMirror.style.lineHeight = styles.lineHeight;
                transcribeMirror.style.width = `${transcribeInput.clientWidth}px`;
                transcribeMirror.textContent = "";
                const before = document.createElement("span");
                const caret = document.createElement("span");
                caret.textContent = "\u200b";
                before.textContent = (transcribeInput.value || "").slice(0, transcribeInput.selectionStart || 0);
                transcribeMirror.append(before, caret);
                const caretRect = caret.getBoundingClientRect();
                const inputRect = transcribeInput.getBoundingClientRect();
                const paddingLeft = parseFloat(styles.paddingLeft) || 0;
                const paddingTop = parseFloat(styles.paddingTop) || 0;
                const left = caretRect.left - inputRect.left + transcribeInput.scrollLeft - paddingLeft + 5;
                const top = caretRect.top - inputRect.top + transcribeInput.scrollTop - paddingTop + 2;
                transcribeGhost.textContent = ghostText;
                transcribeGhost.style.transform = `translate(${left}px, ${top}px)`;
            }

            function updateRangeVisual(rangeInput, totalDurationMinutes = 0) {
                if (!rangeInput) return;
                const total = Math.max(1, Number(totalDurationMinutes) || 1);
                const progressRatio = Math.min(1, Math.max(0, (recordingElapsedSec / 60) / total));
                const pct = progressRatio * 100;
                if (pct <= 0.001) {
                    rangeInput.style.background = "#e5e7eb";
                } else {
                    rangeInput.style.background = `linear-gradient(to right, var(--primary) 0%, var(--primary) ${pct}%, #e5e7eb ${pct}%, #e5e7eb 100%)`;
                }
            }

            function refreshRecordingCounters() {
                updateTranscriptMeta();
                const page = getActivePage();
                const total = page?.duration || 0;
                const activeRange = subjectRanges?.querySelector('input[type="range"]');
                if (activeRange) {
                    updateRangeVisual(activeRange, total);
                }
                updateRecordingLiveOverlay();
            }

            function updateRecordingUi() {
                refreshRecordingCounters();
                updateNoteModeOptions();
                updateRecordingControlsState();
            }

            function updateRecordingControlsState() {
                const recordingInProgress = Boolean(screenRecordingActive || audioMergeInProgress);
                const hasAudio = Boolean(audioUrl);
                const lockControls = Boolean(recordingInProgress || audioRecordingActive);
                if (audioPlayBtn) {
                    const isPlaying = !audioPlayer?.paused && !audioPlayer?.ended && Boolean(audioUrl);
                    audioPlayBtn.disabled = audioMergeInProgress;
                    if (audioRecordingActive) {
                        audioPlayBtn.textContent = "■ Arrêter";
                        audioPlayBtn.title = "Arrêter l'enregistrement";
                        audioPlayBtn.setAttribute("aria-label", "Arrêter l'enregistrement");
                    } else if (!hasAudio && !recordingInProgress) {
                        audioPlayBtn.textContent = "◉ Enregistrer";
                        audioPlayBtn.title = "Démarrer l'enregistrement";
                        audioPlayBtn.setAttribute("aria-label", "Démarrer l'enregistrement");
                    } else if (hasAudio) {
                        audioPlayBtn.textContent = isPlaying ? "⏸ Pause" : "▶ Lire";
                        audioPlayBtn.title = isPlaying ? "Pause" : "Lire l'enregistrement";
                        audioPlayBtn.setAttribute("aria-label", isPlaying ? "Mettre en pause" : "Lire l'enregistrement");
                    }
                }
                if (audioImportBtn) {
                    audioImportBtn.disabled = hasAudio || recordingInProgress || audioRecordingActive;
                }
                if (audioDownloadBtn) {
                    audioDownloadBtn.disabled = lockControls || !hasAudio;
                }
                if (audioClearBtn) {
                    audioClearBtn.disabled = lockControls || !hasAudio;
                }
                if (screenCaptureToggleBtn) {
                    const baseDisabled = shouldDisableScreenCaptureToggle();
                    const recordingDisabled = lockControls;
                    screenCaptureToggleBtn.disabled = baseDisabled || recordingDisabled;
                    screenCaptureToggleBtn.setAttribute("aria-disabled", (baseDisabled || recordingDisabled) ? "true" : "false");
                }
            }

            function addDefaultSubjectsIfEmpty(page) {
                if (!page || (page.subjects && page.subjects.length)) return;
                if (page.__guidelinesCleared) {
                    return;
                }
                page.duration = 30;
                if (guidelineDuration) {
                    guidelineDuration.value = "30";
                }
                page.subjects = [
                    {
                        id: "subject-1",
                        title: "Sujet A",
                        timeframe: { start: 0, end: DEFAULT_SUBJECT_DURATION },
                        keySentences: [{ text: "Point A1", match: "pending" }, { text: "Point A2", match: "pending" }]
                    },
                    {
                        id: "subject-2",
                        title: "Sujet B",
                        timeframe: { start: DEFAULT_SUBJECT_DURATION, end: DEFAULT_SUBJECT_DURATION * 2 },
                        keySentences: [{ text: "Point B1", match: "pending" }, { text: "Point B2", match: "pending" }]
                    }
                ];
                page.activeSubjectId = page.subjects[0].id;
            }

            function normalizeSubjects(raw = []) {
                return raw.map((subject, index) => {
                    const keySentences = (subject["key-sentences"] || subject.keySentences || subject.key_sentence || subject.sentences || [])
                        .map((entry, idx) => {
                            if (typeof entry === "string") return { text: entry, match: "pending" };
                            if (entry && typeof entry === "object") {
                                return {
                                    text: entry.text || entry.label || entry.sentence || `Point ${idx + 1}`,
                                    match: entry.match || entry.status || "pending"
                                };
                            }
                            return { text: `Point ${idx + 1}`, match: "pending" };
                        })
                        .filter(item => item.text && item.text.trim());
                    return {
                        id: subject.id || `subject-${index + 1}`,
                        title: subject.title || subject.name || `Sujet ${index + 1}`,
                        timeframe: subject.timeframe || subject["time-frame"] || {},
                        keySentences
                    };
                });
            }

            function buildScriptPayloadFromPage(page) {
                if (!page) return null;
                const subjects = (page.subjects || []).map((subject, index) => {
                    const timeframe = subject.timeframe || {};
                    const start = Number.isFinite(timeframe.start) ? timeframe.start : index * DEFAULT_SUBJECT_DURATION;
                    let end = Number.isFinite(timeframe.end) ? timeframe.end : start + DEFAULT_SUBJECT_DURATION;
                    if (end <= start) {
                        end = start + DEFAULT_SUBJECT_DURATION;
                    }
                    const keySentences = (subject.keySentences || []).map(entry => {
                        const match = entry?.match || entry?.status;
                        return {
                            text: entry?.text || entry?.label || entry?.sentence || "",
                            match: match === "direct"
                                ? "direct"
                                : match === "indirect"
                                    ? "indirect"
                                    : match === "partiel"
                                        ? "partiel"
                                        : "missing"
                        };
                    }).filter(item => item.text);
                    const title = subject.title || subject.name || `Sujet ${index + 1}`;
                    return {
                        title,
                        timeframe: { start, end },
                        keySentences
                    };
                });
                const maxEnd = subjects.reduce((max, subject) => Math.max(max, subject.timeframe?.end || 0), 0);
                const pageDuration = Number(page.duration);
                const duration = Number.isFinite(pageDuration) && pageDuration > 0 ? pageDuration : (maxEnd || DEFAULT_SUBJECT_DURATION);
                const participants = (page.participants || [])
                    .map(participant => ({ name: participant?.name || "", role: participant?.role || "" }))
                    .filter(participant => participant.name || participant.role);
                if (!participants.length && Array.isArray(page.participants) && page.participants.length) {
                    const fallback = page.participants[0];
                    participants.push({ name: fallback?.name || "", role: fallback?.role || "" });
                }
                return {
                    title: page.title || "",
                    duration,
                    participants,
                    subjects
                };
            }

            function exportPageStateToScriptField() {
                if (!promptModify) return;
                const page = getActivePage();
                if (!page) return;
                const payload = buildScriptPayloadFromPage(page);
                if (!payload) return;
                const formattedScript = JSON.stringify(payload, null, 2);
                promptModify.value = formattedScript;
                page.script = formattedScript;
                persistState();
            }

            function applyScriptJson(text) {
                if (!text) return null;
                const cleaned = text.trim().replace(/^```(?:json)?/i, "").replace(/```$/i, "").trim();
                const parsed = JSON.parse(cleaned);
                const page = getActivePage();
                if (!page) return null;
                if (parsed.title) page.title = parsed.title;
                if (Array.isArray(parsed.subjects)) {
                    page.subjects = normalizeSubjects(parsed.subjects);
                    page.activeSubjectId = page.subjects[0]?.id || null;
                }
                if (parsed.duration) page.duration = parsed.duration;
                if (Array.isArray(parsed.participants)) page.participants = ensureParticipants(parsed.participants);
                else page.participants = ensureParticipants(page.participants);
                if (parsed.transcript && typeof parsed.transcript === "string") {
                    page.transcript = parsed.transcript;
                    if (transcribeInput) transcribeInput.value = parsed.transcript;
                }
                if (parsed.summary && typeof parsed.summary === "string") {
                    page.summary = parsed.summary;
                    refreshSummaryTextarea();
                }
                page.script = JSON.stringify(parsed, null, 2);
                page.__guidelinesCleared = false;
                persistState();
                renderPage();
                return parsed;
            }

            function openSubjectModal(subjectId) {
                const page = getActivePage();
                if (!page) return;
                subjectModalContextOpen = contextPanel ? contextPanel.classList.contains("open") : null;
                const subject = page.subjects?.find(s => s.id === subjectId);
                const titleInput = document.getElementById("newSubjectTitle");
                const durationInput = document.getElementById("newSubjectDuration");
                const pointsInput = document.getElementById("newSubjectPoints");
                const confirmBtn = document.getElementById("confirmSubjectModal");
                const heading = subjectModalOverlay?.querySelector(".modal-header h3");
                if (heading) heading.textContent = subject ? "Éditer un sujet" : "Ajouter un sujet";
                if (confirmBtn) confirmBtn.textContent = subject ? "Mettre à jour" : "Ajouter";
                if (titleInput) titleInput.value = subject?.title || "";
                if (durationInput) durationInput.value = subject ? (subject.timeframe?.end || DEFAULT_SUBJECT_DURATION) - (subject.timeframe?.start || 0) : String(DEFAULT_SUBJECT_DURATION);
                if (pointsInput) pointsInput.value = (subject?.keySentences || []).map(k => k.text || "").join("\n");
                confirmBtn.dataset.subjectId = subject?.id || "";
                subjectModalOverlay?.classList.add("open");
                subjectModalOverlay?.setAttribute("aria-hidden", "false");
            }

            function closeSubjectModalOverlay() {
                subjectModalOverlay.classList.remove("open");
                subjectModalOverlay.setAttribute("aria-hidden", "true");
                if (subjectModalContextOpen !== null) {
                    setContextPanelOpen(subjectModalContextOpen);
                    subjectModalContextOpen = null;
                }
            }

            function renderGuidelines() {
                const page = getActivePage();
                if (!page) return;
                if (Array.isArray(page.subjects) && page.subjects.length) {
                    page.__guidelinesCleared = false;
                }
                addDefaultSubjectsIfEmpty(page);
                page.participants = ensureParticipants(page.participants);
                const subjects = page.subjects || [];
                const totalDuration = page.duration || (subjects.length * DEFAULT_SUBJECT_DURATION);
                let rollingEnd = 0;
                const minDurationClamp = Math.max(0, totalDuration - 1);
                subjects.forEach((subject, idx) => {
                    const start = Math.min(idx === 0 ? 0 : rollingEnd, minDurationClamp);
                    const existingDuration = (typeof subject.timeframe?.end === "number" && typeof subject.timeframe?.start === "number")
                        ? Math.max(1, subject.timeframe.end - subject.timeframe.start)
                        : DEFAULT_SUBJECT_DURATION;
                    let end = typeof subject.timeframe?.end === "number" ? subject.timeframe.end : start + existingDuration;
                    end = Math.min(totalDuration, Math.max(start + 1, end));
                    if (idx === subjects.length - 1) {
                        end = totalDuration || Math.max(start + 1, DEFAULT_SUBJECT_DURATION);
                        if (end <= start) {
                            start = Math.max(0, end - 1);
                        }
                    }
                    subject.timeframe = { start, end };
                    rollingEnd = end;
                });
                function getSubjectStart(idx) {
                    if (idx === 0) return 0;
                    const prev = subjects[idx - 1];
                    return prev && typeof prev.timeframe?.end === "number" ? prev.timeframe.end : getSubjectStart(idx - 1) + DEFAULT_SUBJECT_DURATION;
                }
                if (subjectTabs) {
                    subjectTabs.innerHTML = "";
                    subjects.forEach(subject => {
                        const matched = (subject.keySentences || []).filter(item => item.match === "direct" || item.match === "partiel").length;
                        const total = subject.keySentences?.length || 0;
                        let statusClass = "status-dot status-dot--none";
                        if (matched > 0 && matched < total) {
                            statusClass = "status-dot status-dot--partial";
                        } else if (matched > 0 && matched === total) {
                            statusClass = "status-dot status-dot--complete";
                        }
                        const tab = document.createElement("button");
                        tab.className = "subject-tab" + (subject.id === page.activeSubjectId ? " active" : "");
                        tab.type = "button";
                        tab.innerHTML = `<div style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;">
<span style="display:flex;align-items:center;gap:8px;justify-content:space-between;width:100%;"><span><span class="${statusClass}" aria-hidden="true"></span>${subject.title}</span><span class="edit-subject-btn" role="button" data-id="${subject.id}" title="Éditer">✐</span></span>
</div>`;
                        tab.addEventListener("click", () => {
                            page.activeSubjectId = subject.id;
                            persistState();
                            renderGuidelines();
                        });
                        tab.addEventListener("dblclick", () => openSubjectModal(subject.id));
                        subjectTabs.appendChild(tab);
                    });
                    subjectTabs.querySelectorAll(".edit-subject-btn").forEach(btn => {
                        btn.addEventListener("click", ev => {
                            ev.stopPropagation();
                            const id = btn.getAttribute("data-id");
                            openSubjectModal(id);
                        });
                    });
                }

                const activeSubject =
                    subjects.find(s => s.id === page.activeSubjectId) || subjects[0] || null;
                if (!page.activeSubjectId && activeSubject) {
                    page.activeSubjectId = activeSubject.id;
                }

                if (guidelineMeta) {
                    guidelineMeta.innerHTML = "";
                    const header = document.createElement("div");
                    header.className = "participants-header";
                    const title = document.createElement("div");
                    title.style.fontWeight = "600";
                    title.textContent = "Participants";
                    const addBtn = document.createElement("button");
                    addBtn.type = "button";
                    addBtn.className = "btn";
                    addBtn.textContent = "+";
                    addBtn.addEventListener("click", () => {
                        if (page.participants.length >= MAX_PARTICIPANTS) {
                            showToast(`Maximum ${MAX_PARTICIPANTS} participants.`, true);
                            addBtn.disabled = true;
                            return;
                        }
                        page.participants.push({ name: "", role: "" });
                        persistState();
                        renderGuidelines();
                    });
                    addBtn.disabled = page.participants.length >= MAX_PARTICIPANTS;
                    header.append(title, addBtn);
                    const list = document.createElement("div");
                    list.className = "participants-list";
                    page.participants.forEach((participant, idx) => {
                        const row = document.createElement("div");
                        row.className = "participant-row";
                        const nameInput = document.createElement("input");
                        nameInput.type = "text";
                        nameInput.placeholder = idx === 0 ? "Moi" : `Participant ${idx + 1}`;
                        nameInput.value = participant.name || "";
                        const roleInput = document.createElement("input");
                        roleInput.type = "text";
                        roleInput.placeholder = "Rôle";
                        roleInput.value = participant.role || "";
                        const deleteBtn = document.createElement("button");
                        deleteBtn.type = "button";
                        deleteBtn.className = "btn";
                        deleteBtn.textContent = "×";
                        deleteBtn.style.width = "32px";
                        deleteBtn.addEventListener("click", () => {
                            if (page.participants.length <= 1) return;
                            page.participants.splice(idx, 1);
                            persistState();
                            renderGuidelines();
                        });
                        const save = () => {
                            page.participants[idx] = { name: nameInput.value.trim(), role: roleInput.value.trim() };
                            if (idx === 0) {
                                saveSelfParticipant(page.participants[idx]);
                            }
                            persistState();
                        };
                        nameInput.addEventListener("blur", save);
                        roleInput.addEventListener("blur", save);
                        row.append(nameInput, roleInput, deleteBtn);
                        list.appendChild(row);
                    });
                    guidelineMeta.append(header, list);
                }
                if (!guidelineDuration) {
                    guidelineDuration = document.createElement("select");
                    guidelineDuration.id = "guidelineDuration";
                    guidelineDuration.style.fontSize = "14px";
                    guidelineDuration.style.border = "1px solid var(--border-strong)";
                    guidelineDuration.style.borderRadius = "10px";
                    guidelineDuration.style.padding = "6px 8px";
                }
                guidelineDuration.innerHTML = "";
                for (let min = MIN_SUBJECT_MINUTES; min <= MAX_SUBJECT_MINUTES; min += 5) {
                    const opt = document.createElement("option");
                    opt.value = String(min);
                    opt.textContent = `${min}'`;
                    if (page.duration === min) opt.selected = true;
                    guidelineDuration.appendChild(opt);
                }
                if (!page.duration) {
                    guidelineDuration.value = String(DEFAULT_SUBJECT_DURATION);
                    page.duration = DEFAULT_SUBJECT_DURATION;
                }
                if (!guidelineDuration.dataset.bound) {
                    guidelineDuration.addEventListener("change", () => {
                        const val = Math.min(MAX_SUBJECT_MINUTES, Math.max(MIN_SUBJECT_MINUTES, Number(guidelineDuration.value) || DEFAULT_SUBJECT_DURATION));
                        const currentPage = getActivePage();
                        if (currentPage) {
                            currentPage.duration = val;
                            persistState();
                            renderGuidelines();
                        }
                    });
                    guidelineDuration.dataset.bound = "true";
                }

                if (subjectRanges) {
                    subjectRanges.innerHTML = "";
                    const activeIndex = subjects.findIndex(s => s.id === page.activeSubjectId);
                    const idx = activeIndex >= 0 ? activeIndex : 0;
                    const subject = subjects[idx];
                    const isLast = idx === subjects.length - 1;
                    if (subject) {
                        const prevSubject = isLast && idx > 0 ? subjects[idx - 1] : null;
                        const prevEnd = idx === 0
                            ? 0
                            : Math.max(0, typeof subjects[idx - 1].timeframe?.end === "number"
                                ? subjects[idx - 1].timeframe.end
                                : getSubjectStart(idx));
                        const start = prevEnd;
                        let safeEnd = typeof subject.timeframe?.end === "number" ? subject.timeframe.end : start + DEFAULT_SUBJECT_DURATION;
                        if (isLast) {
                            safeEnd = totalDuration;
                            if (safeEnd <= start) {
                                safeEnd = Math.max(start + 1, totalDuration || start + 1);
                            }
                        } else {
                            safeEnd = Math.min(totalDuration, Math.max(start + 1, safeEnd));
                        }
                        subject.timeframe = { start, end: safeEnd };
                        const row = document.createElement("div");
                        row.className = "subject-range-row";
                        const rangeContainer = document.createElement("div");
                        rangeContainer.style.display = "flex";
                        rangeContainer.style.alignItems = "center";
                        rangeContainer.style.gap = "6px";
                        const rangeInput = document.createElement("input");
                        rangeInput.type = "range";
                        if (isLast && prevSubject) {
                            const minBoundary = Math.min(totalDuration - 1, Math.max((prevSubject.timeframe?.start || 0) + 1, start + 1));
                            const maxBoundary = Math.max(minBoundary, totalDuration - 1);
                            rangeInput.min = String(minBoundary);
                            rangeInput.max = String(maxBoundary);
                            rangeInput.step = "1";
                            rangeInput.value = String(Math.min(maxBoundary, Math.max(minBoundary, prevSubject.timeframe?.end || start + 1)));
                        } else {
                            rangeInput.min = String(start + 1);
                            rangeInput.max = String(Math.max(start + 1, totalDuration));
                            rangeInput.step = "1";
                            rangeInput.value = String(safeEnd);
                        }
                        const meta = document.createElement("div");
                        meta.className = "subject-range-meta";
                        const durationMinutes = Math.max(1, Math.round((safeEnd - start) * 10) / 10);
                        rangeInput.addEventListener("input", () => {
                            if (isLast && prevSubject) {
                                const minBoundary = Number(rangeInput.min);
                                const maxBoundary = Number(rangeInput.max);
                                const boundary = Math.min(maxBoundary, Math.max(minBoundary, Number(rangeInput.value)));
                                prevSubject.timeframe = prevSubject.timeframe || {};
                                prevSubject.timeframe.end = boundary;
                                subject.timeframe.start = boundary;
                                subject.timeframe.end = totalDuration;
                                const dur = Math.max(1, Math.round((subject.timeframe.end - subject.timeframe.start) * 10) / 10);
                                meta.textContent = `${subject.timeframe.start}' → ${subject.timeframe.end}'`;
                                if (durationLabel) {
                                    durationLabel.textContent = isNaN(dur) ? "" : `${dur} mn`;
                                }
                            } else {
                                let nextEnd = Number(rangeInput.value);
                                nextEnd = Math.min(totalDuration, Math.max(start + 1, nextEnd));
                                subject.timeframe.end = nextEnd;
                                const dur = Math.max(1, Math.round((nextEnd - start) * 10) / 10);
                                meta.textContent = `${start}' → ${nextEnd}'`;
                                if (durationLabel) {
                                    durationLabel.textContent = isNaN(dur) ? "" : `${dur} mn`;
                                }
                                // Propagate start times to following subjects
                                for (let i = idx + 1; i < subjects.length; i++) {
                                    const previous = subjects[i - 1];
                                    const current = subjects[i];
                                    const previousEnd = typeof previous.timeframe?.end === "number"
                                        ? previous.timeframe.end
                                        : previous.timeframe?.start + DEFAULT_SUBJECT_DURATION || 0;
                                    const currentDuration = typeof current.timeframe?.end === "number" && typeof current.timeframe?.start === "number"
                                        ? Math.max(1, current.timeframe.end - current.timeframe.start)
                                        : DEFAULT_SUBJECT_DURATION;
                                    const nextStart = previousEnd;
                                    const nextEndBound = Math.min(totalDuration, Math.max(nextStart + 1, nextStart + currentDuration));
                                    current.timeframe = { start: nextStart, end: nextEndBound };
                                }
                            }
                            persistState();
                            updateRangeVisual(rangeInput, totalDuration);
                        });

                    }

                            directInput.addEventListener("change", () => {

                            indirect.appendChild(indirectInput);

                            actions.append(direct, indirect);
                            const startInlineEdit = () => {
                                if (title.isContentEditable) {
                                    return;
                                }
                                const previousText = title.textContent || "";
                                title.contentEditable = "true";
                                const range = document.createRange();
                                range.selectNodeContents(title);
                                const selection = window.getSelection();
                                selection?.removeAllRanges();
                                selection?.addRange(range);
                                const finishEditing = (commit) => {
                                    title.contentEditable = "false";
                                    title.removeEventListener("blur", handleBlur);
                                    title.removeEventListener("keydown", handleKeyDown);
                                    if (commit) {
                                        const trimmed = title.textContent?.trim();
                                        if (trimmed) {
                                            item.text = trimmed;
                                        } else {
                                            delete item.text;
                                        }
                                        title.textContent = getTitleText();
                                        persistState();
                                        renderGuidelines();
                                    } else {
                                        title.textContent = previousText;
                                    }
                                };
                                const handleBlur = () => finishEditing(true);
                                const handleKeyDown = (event) => {
                                    if (event.key === "Enter") {
                                        event.preventDefault();
                                        finishEditing(true);
                                        title.blur();
                                    } else if (event.key === "Escape") {
                                        event.preventDefault();
                                        finishEditing(false);
                                        title.blur();
                                    }
                                };
                                title.addEventListener("blur", handleBlur);
                                title.addEventListener("keydown", handleKeyDown);
                            };
                            title.addEventListener("click", (event) => {
                                event.stopPropagation();
                                startInlineEdit();
                            });
                            li.append(title, actions);
                            guidelineList.appendChild(li);
                        });

            function getAudioDb() {
                if (audioDbPromise) return audioDbPromise;
                audioDbPromise = new Promise((resolve, reject) => {
                    if (!("indexedDB" in window)) {
                        resolve(null);
                        return;
                    }
                    const request = indexedDB.open(AUDIO_DB.name, 1);
                    request.onupgradeneeded = () => {
                        const db = request.result;
                        if (!db.objectStoreNames.contains(AUDIO_DB.store)) {
                            db.createObjectStore(AUDIO_DB.store);
                        }
                    };
                    request.onerror = () => reject(request.error || new Error("IndexedDB audio indisponible"));
                    request.onsuccess = () => resolve(request.result);
                });
                return audioDbPromise;
            }

            async function saveAudioToDb(blob, key = AUDIO_DB.key) {
                try {
                    const db = await getAudioDb();
                    if (!db || !blob) return;
                    const tx = db.transaction(AUDIO_DB.store, "readwrite");
                    const store = tx.objectStore(AUDIO_DB.store);
                    store.put({ type: blob.type || "audio/webm", data: blob }, key);
                } catch (err) {
                    console.warn("Impossible de sauvegarder l'audio", err);
                }
            }

            async function clearAudioDb(key) {
                try {
                    const db = await getAudioDb();
                    if (!db) return;
                    const tx = db.transaction(AUDIO_DB.store, "readwrite");
                    const store = tx.objectStore(AUDIO_DB.store);
                    if (key) {
                        store.delete(key);
                    } else {
                        store.clear();
                    }
                } catch (err) {
                    console.warn("Impossible de vider l'audio", err);
                }
            }

            async function loadAudioFromDb(key = AUDIO_DB.key) {
                if (!key) return false;
                try {
                    const db = await getAudioDb();
                    if (!db) return false;
                    const tx = db.transaction(AUDIO_DB.store, "readonly");
                    const store = tx.objectStore(AUDIO_DB.store);
                    const req = store.get(key);
                    const result = await new Promise(resolve => {
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => resolve(null);
                    });
                    if (result && result.data) {
                        const blobData = result.data;
                        const blob = blobData instanceof Blob
                            ? blobData
                            : new Blob([blobData], { type: result.type || "audio/webm" });
                        setAudioBlob(blob, { skipSave: true });
                        pendingAudioMerge = Promise.resolve();
                        return true;
                    }
                } catch (err) {
                    console.warn("Impossible de charger l'audio", err);
                }
                return false;
            }

            async function hydrateMediaFromDb(targetKey = "") {
                const key = targetKey || getMediaStorageKey();
                const audioKeys = [];
                if (key) {
                    audioKeys.push(key);
                }
                if (!audioKeys.includes(AUDIO_DB.key)) {
                    audioKeys.push(AUDIO_DB.key);
                }
                for (const k of audioKeys) {
                    const loaded = await loadAudioFromDb(k);
                    if (loaded) {
                        pendingAudioMerge = Promise.resolve();
                        audioMergeInProgress = false;
                        break;
                    }
                }
                const videoKeys = [];
                if (key) {
                    videoKeys.push(key);
                }
                if (!videoKeys.includes(VIDEO_DB.key)) {
                    videoKeys.push(VIDEO_DB.key);
                }
                let videoLoaded = false;
                for (const k of videoKeys) {
                    const loaded = await loadVideoFromDb(k);
                    if (loaded) {
                        videoLoaded = true;
                        break;
                    }
                }
                updateScreenToggleVisual();
            }

            function queueAudioMerge(fn) {
                audioMergeInProgress = true;
                updateRecordingControlsState();
                const step = () => Promise.resolve().then(fn);
                pendingAudioMerge = pendingAudioMerge.then(step, step);
                pendingAudioMerge = pendingAudioMerge.finally(() => {
                    audioMergeInProgress = false;
                    updateRecordingControlsState();
                });
                return pendingAudioMerge;
            }

            async function mergeSegmentWithExistingAudio(segment) {
                if (!segment) return;
                if (!audioBlob) {
                    setAudioBlob(segment);
                    return;
                }
                const previousBlob = audioBlob;
                const fallbackType = segment.type || previousBlob.type || "audio/webm";
                const fallbackBlob = concatenateBlobs([previousBlob, segment], fallbackType);
                let mergedBlob = await mergeAudioSegmentsWithFfmpeg([previousBlob, segment]);
                if (!mergedBlob && canCaptureAudioPlaybackStream()) {
                    try {
                        const mimeType = fallbackType || "audio/webm";
                        mergedBlob = await captureSequentialAudioSegments([previousBlob, segment], mimeType, fallbackBlob);
                    } catch (err) {
                        console.warn("Capture fusion audio impossible", err);
                    }
                }
                const finalBlob = mergedBlob || fallbackBlob || segment;
                setAudioBlob(finalBlob);
            }

            async function finalizeAudioSegment(type = "audio/webm") {
                if (!audioChunks.length) {
                    return;
                }
                const segment = new Blob(audioChunks, { type });
                audioChunks = [];
                pendingAudioMerge = Promise.resolve();
                audioMergeInProgress = false;
                setAudioBlob(segment);
            }

            function setAudioBlob(blob, options = {}) {
                const { skipSave } = options;
                if (audioUrl) {
                    try { URL.revokeObjectURL(audioUrl); } catch (e) { /* noop */ }
                }
                audioBlob = blob || null;
                audioUrl = blob ? URL.createObjectURL(blob) : null;
                audioPlayer.src = audioUrl || "";
                audioPlayer.playbackRate = getAudioSpeed();
                audioPlayer.load();
                audioPlayer.currentTime = 0;
                if (audioProgress) {
                    audioProgress.disabled = !audioUrl;
                    audioProgress.value = 0;
                }
                if (audioPlayBtn) {
                    const isPlaying = !audioPlayer?.paused && !audioPlayer?.ended && Boolean(audioUrl);
                    audioPlayBtn.disabled = audioMergeInProgress;
                    if (audioRecordingActive) {
                        audioPlayBtn.textContent = "■ Arrêter";
                    } else if (!audioUrl) {
                        audioPlayBtn.textContent = "◉ Enregistrer";
                    } else {
                        audioPlayBtn.textContent = isPlaying ? "⏸ Pause" : "▶ Lire";
                    }
                }
                if (audioImportBtn) {
                    audioImportBtn.disabled = Boolean(audioUrl) || audioMergeInProgress || audioRecordingActive;
                }
                if (audioClearBtn) {
                    audioClearBtn.disabled = !audioUrl;
                }
                if (blob && !skipSave) {
                    const mediaKey = getMediaStorageKey();
                    saveAudioToDb(blob);
                    if (mediaKey && mediaKey !== AUDIO_DB.key) {
                        saveAudioToDb(blob, mediaKey);
                    }
                }
                if (!skipSave) {
                    const page = getActivePage();
                    if (page) {
                        if (blob) {
                            page.audioRecordingVersion = Number.isFinite(page.audioRecordingVersion) ? page.audioRecordingVersion + 1 : 1;

                updateAudioProgress();

                updateScreenToggleVisual();
