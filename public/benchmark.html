<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>JSON Import Benchmark</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            border-bottom: 2px solid #007acc;
            padding-bottom: 10px;
        }

        .test-controls {
            margin: 20px 0;
        }

        button {
            padding: 10px 20px;
            margin-right: 10px;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #005a9c;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .results {
            margin: 30px 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .metric {
            background: #f9f9f9;
            padding: 15px;
            border-left: 4px solid #007acc;
            border-radius: 4px;
        }

        .metric-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: #007acc;
        }

        .metric.success {
            border-left-color: #28a745;
        }

        .metric.success .metric-value {
            color: #28a745;
        }

        .metric.error {
            border-left-color: #dc3545;
        }

        .metric.error .metric-value {
            color: #dc3545;
        }

        .progress-container {
            margin: 20px 0;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #007acc, #005a9c);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }

        .log {
            background: #f9f9f9;
            border: 1px solid #e9ecef;
            padding: 15px;
            border-radius: 4px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.5;
        }

        .log-entry {
            margin: 5px 0;
            padding: 3px 0;
        }

        .log-entry.info {
            color: #0066cc;
        }

        .log-entry.success {
            color: #28a745;
        }

        .log-entry.error {
            color: #dc3545;
        }

        .log-entry.timing {
            color: #ff6600;
            font-weight: bold;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .comparison-table th {
            background: #007acc;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        .comparison-table td {
            padding: 12px;
            border-bottom: 1px solid #e9ecef;
        }

        .comparison-table tr:hover {
            background: #f5f5f5;
        }

        .comparison-table .improvement {
            color: #28a745;
            font-weight: bold;
        }

        .comparison-table .warning {
            color: #ff6600;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📊 JSON Import Benchmark</h1>

        <div class="test-controls">
            <button id="testButton">Test Single File</button>
            <button id="testAllButton">Test All Contracts</button>
            <button id="clearButton">Clear Results</button>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
        </div>

        <div class="log" id="log"></div>

        <div id="resultsContainer"></div>

        <div id="comparisonContainer"></div>
    </div>

    <script src="/js/keywordIndex.js"></script>
    <script src="/js/document-rag.js"></script>
    <script>
        const log = document.getElementById('log');
        const resultsContainer = document.getElementById('resultsContainer');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');

        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function setProgress(percent) {
            progressFill.style.width = percent + '%';
            progressFill.textContent = Math.round(percent) + '%';
        }

        async function runTest(filePath, fileName) {
            addLog(`Starting test for: ${fileName}`, 'info');

            const startTime = performance.now();
            const fileSize = 0; // Sera mesuré côté client

            try {
                // Récupérer le fichier
                const response = await fetch(filePath);
                const fileBlob = await response.blob();
                const file = new File([fileBlob], fileName, { type: 'application/json' });

                const fileSizeMB = (file.size / 1024 / 1024).toFixed(2);
                addLog(`File loaded: ${fileSizeMB}MB`, 'success');

                // Mesurer parse JSON
                const parseStart = performance.now();
                const raw = await file.text();
                const data = JSON.parse(raw);
                const parseTime = performance.now() - parseStart;
                addLog(`✓ Parse JSON: ${parseTime.toFixed(2)}ms`, 'timing');

                // Mesurer chunking
                const chunkStart = performance.now();
                const chunks = window.GoToolkitBuildJsonChunks?.(data, {
                    maxChunkChars: 6500,
                    maxStringChunkChars: 5000,
                    maxTotalChars: 1400,
                    maxStringChars: 600
                });
                const chunkTime = performance.now() - chunkStart;
                addLog(`✓ Chunking: ${chunkTime.toFixed(2)}ms (${chunks?.length || 0} chunks)`, 'timing');

                // Mesurer rendering
                const renderStart = performance.now();
                const textForEmbedding = chunks?.map(c => c?.textForEmbedding || '').join('\n') || '';
                const renderTime = performance.now() - renderStart;
                addLog(`✓ Render for embedding: ${renderTime.toFixed(2)}ms`, 'timing');

                // Mesurer embedding
                setProgress(0);
                progressContainer.style.display = 'block';

                const embedStart = performance.now();
                const manager = window.GoToolkitDocumentManager;

                if (!manager) {
                    addLog('Error: DocumentManager not available', 'error');
                    return null;
                }

                await manager.waitReady?.();

                const embedTexts = chunks?.map(c => c?.textForEmbedding || '') || [];

                // Nouveau: utiliser embedBatchAdaptive
                const embeddings = await manager.embedBatchAdaptive(embedTexts, (progress) => {
                    setProgress(progress * 100);
                });

                const embedTime = performance.now() - embedStart;
                addLog(`✓ Embedding (adaptive batch): ${embedTime.toFixed(2)}ms`, 'timing');

                setProgress(100);
                const totalTime = performance.now() - startTime;

                const result = {
                    fileName,
                    fileSize: file.size,
                    fileSizeMB: parseFloat(fileSizeMB),
                    chunkCount: chunks?.length || 0,
                    timings: {
                        parseJson: parseTime,
                        chunking: chunkTime,
                        renderJsonForEmbedding: renderTime,
                        embedBatch: embedTime,
                        total: totalTime
                    }
                };

                addLog(`✓ TOTAL: ${totalTime.toFixed(2)}ms (${(totalTime / 1000).toFixed(2)}s)`, 'success');

                displayResult(result);

                // Sauvegarder le résultat
                const results = JSON.parse(localStorage.getItem('benchmarkResults') || '[]');
                results.push({
                    ...result,
                    timestamp: new Date().toISOString()
                });
                localStorage.setItem('benchmarkResults', JSON.stringify(results));

                return result;

            } catch (err) {
                addLog(`Error: ${err.message}`, 'error');
                console.error(err);
                return null;
            }
        }

        function displayResult(result) {
            const html = `
                <div class="results">
                    <div class="metric success">
                        <div class="metric-label">Total Time</div>
                        <div class="metric-value">${(result.timings.total / 1000).toFixed(2)}s</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">File Size</div>
                        <div class="metric-value">${result.fileSizeMB}MB</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Chunk Count</div>
                        <div class="metric-value">${result.chunkCount}</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Parse JSON</div>
                        <div class="metric-value">${result.timings.parseJson.toFixed(0)}ms</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Chunking</div>
                        <div class="metric-value">${result.timings.chunking.toFixed(0)}ms</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Rendering</div>
                        <div class="metric-value">${result.timings.renderJsonForEmbedding.toFixed(0)}ms</div>
                    </div>
                    <div class="metric ${result.timings.embedBatch > 5000 ? 'warning' : 'success'}">
                        <div class="metric-label">Embedding (Adaptive)</div>
                        <div class="metric-value">${result.timings.embedBatch.toFixed(0)}ms</div>
                    </div>
                </div>
            `;
            resultsContainer.innerHTML = html;
        }

        document.getElementById('testButton').addEventListener('click', async () => {
            resultsContainer.innerHTML = '';
            log.innerHTML = '';
            await runTest('/test-data/contrat/CFM-MA-2021-00064_12-12-2025.json', 'CFM-MA-2021-00064_12-12-2025.json');
            progressContainer.style.display = 'none';
        });

        document.getElementById('testAllButton').addEventListener('click', async () => {
            resultsContainer.innerHTML = '';
            log.innerHTML = '';
            const files = [
                '/test-data/contrat/CFM-MA-2021-00064_12-12-2025.json',
                '/test-data/contrat/CFM-MA-2023-00048_12-12-2025.json',
                '/test-data/contrat/CFM-MA-2023-00184_12-12-2025.json',
                '/test-data/contrat/SAE-MA-2017-00180_12-12-2025.json'
            ];

            for (const file of files) {
                const fileName = file.split('/').pop();
                await runTest(file, fileName);
                await new Promise(r => setTimeout(r, 500)); // Pause entre tests
            }
            progressContainer.style.display = 'none';
        });

        document.getElementById('clearButton').addEventListener('click', () => {
            localStorage.removeItem('benchmarkResults');
            resultsContainer.innerHTML = '';
            log.innerHTML = '';
            addLog('Results cleared', 'info');
        });

        // Load results on startup
        addLog('Benchmark ready. Choose a test to run.', 'info');
    </script>
</body>

</html>
