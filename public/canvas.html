<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>Canvas | Go-Toolkit</title>
    <link rel="stylesheet" href="styles/style.css?v=2026.01.11.2">
    <style>
        :root {
            --app-bg: #f3f4f6;
            --app-border: #cdd4ed;
            --app-border-strong: #cdd4ed;
            --app-text: #101428;
            --slide-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        .scrip-panel {
            flex: 1 1 auto;
        }

        .template-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
        }

        #clearSectionsBtn {
            margin-left: auto;
        }

        .gt-template-modal__list {
            max-height: 320px;
            overflow-y: auto;
            display: grid;
            gap: 10px;
            padding: 4px;
        }

        .gt-template-card {
            background: #ffffff;
            border: 1px solid #ebe0d1;
            border-radius: 14px;
            padding: 12px 14px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .gt-template-card--selected {
            border-color: #2a7a57;
            box-shadow: 0 0 0 3px rgba(42, 122, 87, 0.25);
        }

        .gt-template-card h4 {
            margin: 0 0 6px;
            font-size: 16px;
            line-height: 1.3;
        }

        .gt-template-card p {
            margin: 0;
            font-size: 13px;
            color: #4b5563;
            white-space: pre-line;
        }

        .menu-trigger {
            position: relative;
            display: inline-flex;
            align-items: stretch;
            gap: 4px;
        }

        .context-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 0;
            min-width: 150px;
            max-width: 320px;
            display: none;
            z-index: 40;
        }

        .context-menu.open {
            display: block;
        }

        .menu-panel {
            display: flex;
            max-width: 300px;
            flex-direction: column;
            gap: 5px;
            padding: 0px;
        }

        .menu-header {
            font-size: 14px;
            font-weight: 700;
        }

        .context-menu label {
            margin: 0;
            font-size: 13px;
            padding: 12px;
        }

        .context-menu select {
            width: 100%;
            border: 1px solid #dcd0c1;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 13px;
            background: #fff;
        }

        .context-menu button {
            border-radius: 4px;
            text-align: left;
            width: 100%;
            font-size: 14px;
            cursor: pointer;
        }

        .menu-panel-btn {
            border-radius: 0;
            border: 1px solid #fff;
            background: transparent;
            text-align: left;
            padding: 8px 12px;
            width: 100%;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .menu-panel-btn:hover {
            background: rgba(42, 122, 87, 0.08);
            border-radius: 0px;
        }

        .menu-panel .menu-panel-btn {
            border: none;
        }

        .toast {
            position: fixed;
            bottom: 18px;
            right: 18px;
            background: rgba(15, 23, 42, 0.92);
            color: #fff;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 13px;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.3);
            pointer-events: none;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 90;
        }

        .toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .error-toast {
            position: fixed;
            top: 18px;
            right: 18px;
            background: #b00020;
            color: #fff;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
            pointer-events: none;
            opacity: 0;
            transform: translateY(-12px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 95;
        }

        .error-toast.visible {
            opacity: 1;
            transform: translateY(0);
        }


        .prompt-mode-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .prompt-mode-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            font-weight: 600;
        }

        .prompt-editor {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #d0c3ad;
            padding: 10px 12px;
            font-size: 13px;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            background: #fff;
        }

        .prompt-editor:focus-visible {
            outline: none;
            border-color: #2a7a57;
            box-shadow: 0 0 0 2px rgba(42, 122, 87, 0.3);
        }

        .prompt-editor-context {
            font-size: 13px;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 8px;
        }

        .prompt-editor-context.hidden {
            display: none;
        }

        .prompt-editor-context-row {
            display: flex;
            gap: 4px;
        }

        .prompt-editor-context-label {
            font-weight: 600;
        }

        .prompt-editor-context-row strong {
            font-weight: 600;
            color: #111;
        }

        .prompt-editor-preview {
            font-size: 14px;
            color: #111;
            background: #fefdf8;
            border: 1px solid #ded5c8;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            white-space: pre-wrap;
            min-height: 95px;
            cursor: text;
            outline: none;
        }

        .prompt-editor-preview.hidden {
            display: none;
        }

        .prompt-editor-placeholder {
            font-weight: 600;
            color: #111;
        }

        .prompt-editor-placeholder-empty {
            font-style: italic;
            color: var(--muted);
        }

        .prompt-editor-placeholder strong {
            font-weight: 600;
            color: #111;
        }


        .prompt-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
            flex-direction: row-reverse;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .modal-footer button {
            border-radius: 8px;
            padding: 6px 12px;
            border: 1px solid #dcd0c1;
            background: #fff;
            cursor: pointer;
            font-size: 13px;
        }

        .modal-footer button.primary {
            border: none;
            background: #2a7a57;
            color: #fff;
        }

        .ia-mode-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            padding-top: 12px;
        }

        .ia-mode-toggle button {
            border-radius: 999px;
            border: 1px solid #ebe0d1;
            background: #fff;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
        }

        .ia-mode-label {
            width: 100%;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        .ia-mode-toggle button.active {
            background: #2a7a57;
            color: #fff;
            border-color: #2a7a57;
        }

        #promptCustomizationArea.hidden {
            display: none;
        }


        :root {
            --bg: #f5f2eb;
            --card-bg: #ffffff;
            --border-soft: #dfd5c7;
            --text-main: #2f2922;
            --muted: #8b8173;
            --border-display: #d0c3ad;
            --radius-large: 16px;
            --radius: 10px;
            --shadow-soft: 0 10px 25px rgba(0, 0, 0, 0.05);
            --slide-aspect-ratio: 16 / 9;
            --slide-width: min(1400px, 100%);
            --slide-available-height: calc(100vh - 190px);
            --slide-aspect-value: calc(16 / 9);
        }

        html,
        body {
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--app-font, "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
            font-size: 15px;
            background: #f3f4f6;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: hidden;
        }

        .app {
            width: 100%;
            max-width: none;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 0px;
            align-items: stretch;
            min-height: 100vh;
            height: 100vh;
            padding: 12px;
            overflow: hidden;
        }

        .app-main {
            --context-panel-width: 350px;
            flex: 1;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 12px;
            min-height: 0;
            align-items: stretch;
            position: relative;
        }

        .app-main.gutenberg-open {
            /* make the right-hand card responsive: at most 350px, at least 200px */
            grid-template-columns: minmax(0, 1fr) minmax(200px, var(--context-panel-width));
        }

        .gutenberg-card {
            background: #fff;
            border: 1px solid #ebe0d1;
            border-radius: 8px;
            box-shadow: var(--shadow-soft);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: calc(100%-10px);
            min-height: 0;
            max-height: 100%;
            overflow: auto;
            transition: transform 0.25s ease, opacity 0.25s ease;
            z-index: 25;
            font-size: 13px;
            margin: 10px 0px 10px 0px;
            padding-top: 0px;
            width: 100%;
        }

        .gutenberg-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0px;
        }

        .gutenberg-card-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .gutenberg-card-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .gutenberg-card-actions-row {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 4px;
            flex-direction: row;
        }

        .gutenberg-card-actions-row-right {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .scenario-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1 1 auto;
            min-height: 0;
        }

        .scenario-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .scenario-header-row span {
            font-weight: 600;
            font-size: 13px;
            line-height: 1.2;
        }

        .scenario-input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1 1 auto;
            min-height: 0;
        }

        .scenario-template-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .scenario-template-row .btn {
            margin-left: auto;
        }

        /* Make the full generate button primary green */


        .right {
            margin-left: auto;
        }





        .gutenberg-card-body {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-height: 0;
            height: 100%;
            font-size: 13px
        }

        .gutenberg-card label {
            display: flex;
            flex-direction: column;
        }

        .gutenberg-card textarea {
            border-radius: 8px;
            border: 1px solid #d6dbf2;
            padding: 8px;
            font-size: 13px;
            font-family: var(--app-font, "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
            min-height: 120px;
            resize: none;
            overflow: auto;
            scrollbar-width: none;
            line-height: 1.4;
            /* Firefox: hide by default */
        }




        .gutenberg-card-body>label:last-child {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
        }

        .gutenberg-card-body>label:last-child textarea,
        #pageContextField {
            flex: 1 1 0;
            min-height: 0;
            overflow: auto;
            height: 100%;
        }

        /* Thin scrollbar only visible on focus */
        .gutenberg-card textarea::-webkit-scrollbar {
            width: 6px;
            height: 0px;
            /* hide horizontal by default */
        }

        .gutenberg-card textarea:focus::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }

        .gutenberg-card textarea::-webkit-scrollbar-thumb {
            background: rgba(15, 23, 42, 0.10);
            border-radius: 999px;
        }

        .gutenberg-card textarea:focus::-webkit-scrollbar-thumb {
            background: rgba(15, 23, 42, 0.22);
        }

        /* Firefox: show thin scrollbar only on focus */
        .gutenberg-card textarea {
            scrollbar-width: none;
        }

        .gutenberg-card textarea:focus {
            scrollbar-width: thin;
        }

        .speech-field-wrapper {
            position: relative;
        }

        .speech-field-wrapper textarea {
            padding-right: 40px;
            position: relative;
            z-index: 2;
        }

        .speech-button {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.85);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            color: #918b7f;
            border-radius: 999px;
            transition: box-shadow 0.2s ease, opacity 0.2s ease;
            opacity: 1;
            pointer-events: auto;
            z-index: 3;
        }

        /* Hide speech buttons inside slides by default to reduce visual clutter;
           reveal the button when the user hovers the containing text row. */
        .slide-body .speech-button {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.15s ease, visibility 0.15s ease;
        }

        .slide-body .section-text-row:hover .speech-button,
        .slide-body .section-text-row:focus-within .speech-button,
        .slide-body .textarea-wrapper:hover .speech-button,
        .slide-body .speech-field-wrapper:hover .speech-button {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .slide-bottom-section .speech-button {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.15s ease, visibility 0.15s ease;
        }

        .slide-bottom-section:hover .speech-button,
        .slide-bottom-section:focus-within .speech-button {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .speech-button--active,
        .speech-button:active {
            color: #B11226;
            animation: speech-blink 2s infinite linear;
            opacity: 1;
        }

        @keyframes speech-blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }


        .speech-suggestion {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            pointer-events: none;
            font: inherit;
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
            z-index: 4;
        }

        .section-text-row .speech-suggestion,
        .slide-bottom-section .speech-suggestion {
            font-family: var(--slide-font-family, var(--app-font, "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif));
            font-size: var(--slide-font-size, 16px);
        }

        .section-text-row .speech-suggestion {
            line-height: 1.3;
        }

        .slide-bottom-section .speech-suggestion {
            line-height: 1.5;
        }

        .speech-suggestion span {
            display: inline;
        }

        .speech-suggestion-current {
            color: transparent;
        }

        .speech-suggestion-partial {
            color: rgba(15, 23, 42, 0.45);
        }

        .speech-suggestion:not(.visible) {
            visibility: hidden;
        }

        @keyframes speech-border {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(177, 18, 38, 0.2);
            }

            50% {
                box-shadow: 0 0 0 6px rgba(177, 18, 38, 0.12);
            }
        }

        .speech-field-wrapper.speech-active textarea {
            border: 2px solid #B11226 !important;
            animation: speech-border 2s infinite ease-in-out;
        }

        .speech-field-wrapper.speech-active textarea:focus {
            border: 2px solid #B11226 !important;
        }

        textarea:focus {
            outline: none;
            border: 1px solid var(--app-primary);
            scrollbar-width: thin;
        }

        .prompt-input-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            height: 100%;
            flex-direction: column;
        }

        .prompt-input-wrapper textarea {
            flex: 1 1 auto;
            min-height: 0;
        }

        .template-tooltip {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 10px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 2000;
            max-width: 360px;
            font-size: 12px;
            color: #ffffff;
            line-height: 1.3;
            backdrop-filter: blur(2px);
            pointer-events: none;
            transform-origin: bottom left;
            transform: translateY(-8px);
            transition: opacity 0.12s ease, transform 0.12s ease;
        }

        .template-tooltip[aria-hidden="false"]:not(:empty) {
            display: block;
        }

        .template-label {
            font-size: 12px;
            color: var(--muted);
        }

        .gutenberg-status {
            font-size: 11px;
            color: var(--muted);
        }

        .gutenberg-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.28);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 24;
        }

        .gutenberg-backdrop.visible {
            opacity: 1;
            pointer-events: auto;
        }

        @media (min-width: 900px) {
            .gutenberg-card {
                /* responsive: fill the column but never exceed 350px */
                width: 100%;
                width: 350px;
                flex: 0 0 auto;
                display: none;
                transform: none;
                opacity: 1;
                position: relative;
            }

            .gutenberg-card-actions-row {
                display: flex;
                gap: 8px;
                justify-content: space-between;
                align-items: center;
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: flex-start;
            }

            .gutenberg-card.open {
                display: flex;
                width: 100%;
            }

            .gutenberg-backdrop {
                display: none;
            }
        }

        @media (max-width: 899px) {
            .app-main {
                grid-template-columns: minmax(0, 1fr);
            }

            .gutenberg-card {
                position: fixed;
                top: 12px;
                right: 12px;
                bottom: 12px;
                width: min(320px, 88vw);
                max-height: calc(100vh - 24px);
                transform: translateX(110%);
                opacity: 0;
                pointer-events: none;
                visibility: hidden;
            }

            .gutenberg-card.open {
                transform: translateX(0);
                opacity: 1;
                pointer-events: auto;
                visibility: visible;
            }

            /* ensure actions row stacks nicely on small screens */
            .gutenberg-card-actions-row {
                justify-content: flex-start;
                flex-wrap: wrap;
                gap: 8px;
            }
        }


        .app::after {
            content: "";
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 120px;
            height: 120px;
            background: url("img/logo.gif") no-repeat center/contain;
            opacity: 0.25;
            pointer-events: none;
            z-index: -1;
        }

        .tabs-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            flex-wrap: wrap;
        }

        .reset-prompts-btn {
            border-radius: 999px;
            border: 1px solid #ebe0d1;
            background: #fff;
            padding: 0 6px;
            min-height: 24px;
            font-size: 12px;
            line-height: 24px;
            cursor: pointer;
            box-shadow: none;
        }

        #tabs {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: no-wrap;
        }




        .slides-container {
            position: relative;
            flex: 1;
            min-height: 0;
            max-height: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            width: 100%;
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
        }

        .slides-container::-webkit-scrollbar {
            display: none;
            /* Safari and Chrome */
            width: 0px;
            height: 0px;
        }

        .slide-empty-state {
            position: absolute;
            inset: 40px 40px 20px;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 24px;
            border: 1px dashed rgba(15, 23, 42, 0.25);
            color: var(--text-main);
            padding: 24px;
            gap: 12px;
            z-index: 2;
        }

        .slide-empty-state.visible {
            display: flex;
        }

        .slide-empty-state p {
            margin: 0;
            font-size: 14px;
            color: var(--text-main);
        }

        .slide-empty-state button {
            border-radius: 14px;
            border: 1px solid rgba(15, 23, 42, 0.2);
            background: #fff;
            color: #2a7a57;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
        }

        .slide-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 12px 0px;
        }

        .slide {
            background: var(--slide-bg, #ffffff);
            border-radius: var(--radius);
            padding: 8px 8px 8px;
            box-shadow: var(--shadow-soft);
            display: flex;
            flex-direction: column;
            aspect-ratio: var(--slide-aspect-ratio, 16 / 9);
            width: min(var(--slide-width, min(1680px, 100%)),
                    var(--slide-height-width-limit,

        function appendSpeechText(field, transcript) {
            if (!field || !transcript) {
                return;
            }
            const normalized = transcript.trim();
            if (!normalized) {
                return;
            }
            const separator = field.value ? (/\s$/.test(field.value) ? "" : " ") : "";
            field.value = field.value + (field.value ? separator : "") + normalized;
            field.dispatchEvent(new Event("input", { bubbles: true }));
            clearSpeechSuggestion(field);
        }

        function escapeHtml(value) {
            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function getSpeechSuggestionElement(field) {
            if (!field) {
                return null;
            }
            return document.querySelector(`[data-speech-suggestion="${field.id}"]`);
        }

        function ensureSpeechSuggestionField(field) {
            if (!field) {
                return;
            }
            if (!field.id) {
                speechFieldIdCounter += 1;
                field.id = `speech-field-${speechFieldIdCounter}`;
            }
            const wrapper = field.closest(".speech-field-wrapper") || field.closest(".textarea-wrapper");
            if (!wrapper) {
                return;
            }
            if (!wrapper.classList.contains("speech-field-wrapper")) {
                wrapper.classList.add("speech-field-wrapper");
            }
            const selector = `[data-speech-suggestion="${field.id}"]`;
            let suggestionEl = wrapper.querySelector(selector);
            if (!suggestionEl) {
                suggestionEl = document.createElement("div");
                suggestionEl.className = "speech-suggestion";
                suggestionEl.setAttribute("aria-hidden", "true");
                suggestionEl.dataset.speechSuggestion = field.id;
                field.insertAdjacentElement("afterend", suggestionEl);
            } else {
                suggestionEl.dataset.speechSuggestion = field.id;
            }
        }

        function updateSpeechSuggestion(field, partial) {
            const suggestionEl = getSpeechSuggestionElement(field);
            if (!suggestionEl) {
                return;
            }
            if (!partial) {
                suggestionEl.classList.remove("visible");
                suggestionEl.innerHTML = "";
                return;
            }
            const safeCurrent = escapeHtml(field.value);
            const safePartial = escapeHtml(partial);
            suggestionEl.innerHTML = `<span class="speech-suggestion-current">${safeCurrent}</span><span class="speech-suggestion-partial">${safePartial}</span>`;
            suggestionEl.classList.add("visible");
            if (field === activeSpeechField) {
                lastSpeechInterim = partial || "";
            }
            // hide placeholder while interim speech suggestion is visible
            try {
                if (field && field.setAttribute) {
                    const existing = field.getAttribute('placeholder') || '';
                    if (existing) field.setAttribute('data-original-placeholder', existing);
                    field.setAttribute('placeholder', '');
                }
            } catch (e) { /* noop */ }
        }

        function clearSpeechSuggestion(field) {
            updateSpeechSuggestion(field, "");
            if (field === activeSpeechField) {
                lastSpeechInterim = "";
            }
            // restore placeholder if it was hidden for speech
            try {
                if (field && field.setAttribute) {
                    const saved = field.getAttribute('data-original-placeholder');
                    if (saved !== null) {
                        field.setAttribute('placeholder', saved || '');
                        field.removeAttribute('data-original-placeholder');
                    }
                }
            } catch (e) { /* noop */ }
        }

        function deactivateSpeechUiClasses() {
            if (activeSpeechButton) {
                activeSpeechButton.classList.remove("speech-button--active");

            if (activeSpeechWrapper) {
                activeSpeechWrapper.classList.remove("speech-active");

            const field = activeSpeechField;

            if (!SpeechRecognitionCtor) {
                showErrorToast("Reconnaissance vocale non disponible dans ce navigateur.");
                return;
            }
            if (!field) {
                return;
            }
            if (activeSpeechButton === button) {
                stopActiveSpeechSession();
                return;
            }
            stopActiveSpeechSession();
            const recognition = new SpeechRecognitionCtor();
            recognition.lang = "fr-FR";
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;
            recognition.continuous = true;
            const wrapper = button?.closest(".speech-field-wrapper");
            recognition.addEventListener("start", () => {
                button?.classList.add("speech-button--active");
                activeSpeechRecognition = recognition;
                activeSpeechButton = button;
                activeSpeechField = field;
                lastSpeechInterim = "";
                field.focus();
                clearSpeechSuggestion(field);
                if (wrapper) {
                    wrapper.classList.add("speech-active");
                    activeSpeechWrapper = wrapper;
                }
            });
            recognition.addEventListener("result", event => {
                let interimText = "";
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const result = event.results[i];
                    const transcript = (result[0]?.transcript || "").trim();
                    if (!transcript) continue;
                    if (result.isFinal) {
                        appendSpeechText(field, transcript);
                    } else {
                        interimText += (interimText ? " " : "") + transcript;
                    }
                }
                if (interimText) {
                    updateSpeechSuggestion(field, interimText);
                } else {
                    const lastResult = event.results[event.results.length - 1];
                    if (lastResult && !lastResult.isFinal) {
                        clearSpeechSuggestion(field);
                    }
                }
            });
            recognition.addEventListener("error", event => {
                console.warn("Speech recognition error", event);
                clearSpeechSuggestion(field);
                stopActiveSpeechSession();
            });
            recognition.addEventListener("end", () => {
                if (activeSpeechRecognition === recognition) {
                    stopActiveSpeechSession({ skipAbort: true });
                }
            });
            try {
                recognition.start();

        function formatRelativeTime(isoString) {
            if (!isoString) return "";
            const value = new Date(isoString).getTime();
            if (Number.isNaN(value)) return "";
            const deltaSeconds = Math.max(0, Math.floor((Date.now() - value) / 1000));
            if (deltaSeconds < 60) {
                return "Mis à jour à l'instant";
            }
            const deltaMinutes = Math.floor(deltaSeconds / 60);
            if (deltaMinutes < 60) {
                return `Mis à jour il y a ${deltaMinutes} minute${deltaMinutes > 1 ? "s" : ""}`;
            }
            const deltaHours = Math.floor(deltaMinutes / 60);
            if (deltaHours < 24) {
                return `Mis à jour il y a ${deltaHours} heure${deltaHours > 1 ? "s" : ""}`;
            }
            const deltaDays = Math.floor(deltaHours / 24);
            return `Mis à jour il y a ${deltaDays} jour${deltaDays > 1 ? "s" : ""}`;
        }

        function createShareToken() {
            if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
                return crypto.randomUUID();
            }
            const bytes = new Uint8Array(16);
            if (typeof crypto !== "undefined" && typeof crypto.getRandomValues === "function") {
                crypto.getRandomValues(bytes);
            } else {
                for (let i = 0; i < bytes.length; i++) {
                    bytes[i] = Math.floor(Math.random() * 256);
                }
            }
            return Array.from(bytes)
                .map(byte => byte.toString(16).padStart(2, "0"))
                .join("");
        }

                    updatedAt: now

                    activeDocumentId = id;

        async function tryLoadSharedStateFromUrl() {
            const token = getShareTokenFromUrl();
            if (!token) {
                return false;
            }
            const localDraft = readShareDraft(token);
            let remoteResult = null;
            try {
                remoteResult = await fetchSharePayload(token);
            } catch (err) {
                console.error("Erreur de chargement distant du lien partagé :", err);
            }

            const remotePayload = remoteResult?.payload;
            const remoteUpdatedAt = remoteResult?.meta?.updatedAt;
            const localPayload = localDraft?.payload;
            const localUpdatedAt = localDraft?.updatedAt;

            const remoteDate = remoteUpdatedAt ? new Date(remoteUpdatedAt).getTime() : 0;
            const localDate = localUpdatedAt ? new Date(localUpdatedAt).getTime() : 0;
            const payloadsMatch = remotePayload && localPayload
                ? JSON.stringify(remotePayload) === JSON.stringify(localPayload)
                : false;
            const timestampsEqual = remoteUpdatedAt && localUpdatedAt && remoteDate === localDate;

            let chosenPayload = null;
            let chosenUpdatedAt = null;

            if (remotePayload && localPayload && (payloadsMatch || timestampsEqual)) {
                chosenPayload = localPayload;
                chosenUpdatedAt = localUpdatedAt || remoteUpdatedAt;
            } else if (localPayload && localDate > remoteDate) {
                chosenPayload = localPayload;
                chosenUpdatedAt = localUpdatedAt;
            } else if (remotePayload && remoteDate > localDate && localPayload) {
                const confirmed = window.confirm(
                    `Mettre à jour avec les modifications du ${formatFullDate(remoteUpdatedAt)} ?`
                );
                if (confirmed) {
                    chosenPayload = remotePayload;
                    chosenUpdatedAt = remoteUpdatedAt;
                } else {
                    chosenPayload = localPayload;
                    chosenUpdatedAt = localUpdatedAt || remoteUpdatedAt || new Date().toISOString();
                }
            } else if (remotePayload && Array.isArray(remotePayload.slides)) {
                chosenPayload = remotePayload;
                chosenUpdatedAt = remoteUpdatedAt || new Date().toISOString();
            } else if (localPayload) {
                chosenPayload = localPayload;
                chosenUpdatedAt = localUpdatedAt || new Date().toISOString();
            }

            if (!chosenPayload || !Array.isArray(chosenPayload.slides)) {
                setShareStatus("Lien de partage introuvable.", "error");
                return false;
            }

            initializeTemplateSlides(chosenPayload.slides);
            applySettingsFromPayload(chosenPayload.settings || {});
            currentShareToken = token;
            shareLoadedFromRemote = true;
            shareLastUpdatedAt = chosenUpdatedAt || new Date().toISOString();
            setShareStatus(formatRelativeTime(shareLastUpdatedAt));
            await persistShareHistoryRecord(token, shareLastUpdatedAt);
            writeShareDraft(token, chosenPayload, shareLastUpdatedAt);
            return true;
        }

            const apiKey = (readSharedApiKey() || "").trim();
            const prevController = sectionCriteriaControllers.get(textarea);

            const controller = new AbortController();

            if (!apiKey) {
                const lower = text.toLowerCase();
                const normalized = {};
                criteria.forEach(item => {
                    const keyLc = item.toLowerCase();
                    normalized[keyLc] = lower.includes(keyLc);
                });
                const updated = renderSuggestionWithStatus(parsed, normalized);
                textarea.dataset.suggestionPlaceholder = updated;
                // Do not set `placeholder` attribute; keep suggestion text in data-attr.
                updateTextareaTooltip(textarea);
                sectionCriteriaControllers.delete(textarea);
                return;
            }

            const endpoint = "https://api.openai.com/v1/chat/completions";
            const body = {
                model: "gpt-4o-mini",
                messages: [
                    {
                        role: "system",
                        content:
                            "Tu vérifies si un texte respecte des critères donnés. " +
                            "Réponds uniquement avec un JSON {\"matches\":{\"critère\":true/false}}. " +
                            "Un critère est rempli si l'idée ou un synonyme est présent."
                    },
                    {
                        role: "user",
                        content:
                            `Texte : """${text}"""` +
                            `\nCritères (${criteria.length}) : ${criteria.join(", ")}` +
                            `\nRéponds STRICTEMENT au format {"matches":{"Critère":true/false}} avec les mêmes libellés.`
                    }
                ],
                response_format: { type: "json_object" },
                temperature: 0
            };

            try {
                const res = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        Authorization: `Bearer ${apiKey}`
                    },
                    body: JSON.stringify(body),
                    signal: controller.signal
                });
                const rawText = await res.text();
                if (sectionCriteriaControllers.get(textarea) !== controller) return;
                if (!res.ok) throw new Error(rawText || "Analyse critères indisponible");
                let content = rawText;
                try {
                    const parsedOuter = JSON.parse(rawText);
                    content = parsedOuter?.choices?.[0]?.message?.content || rawText;
                } catch (e) { /* noop */ }
                let parsedJson = null;
                try { parsedJson = JSON.parse(content || "{}"); } catch (e) { }
                const matches = parsedJson?.matches || parsedJson?.result || {};
                const normalized = {};
                criteria.forEach(item => {
                    const keyLc = item.toLowerCase();
                    const candidates = [
                        matches[item],
                        matches[keyLc],
                        matches[item.replace(/\s+/g, "_")],
                        matches[item.replace(/\s+/g, "_").toLowerCase()],
                        matches[item.replace(/\s+/g, "").toLowerCase()]
                    ];
                    const val = candidates.find(v => typeof v !== "undefined");
                    normalized[keyLc] = val === true || val === "true" || val === 1;
                });
                const updated = renderSuggestionWithStatus(parsed, normalized);
                textarea.dataset.suggestionPlaceholder = updated;
                // Do not set `placeholder` attribute; tooltip updated via data attrs.
                updateTextareaTooltip(textarea);
            } catch (err) {
                if (err?.name === "AbortError") return;
                console.warn("Analyse critères section impossible", err);
            } finally {
                if (sectionCriteriaControllers.get(textarea) === controller) {
                    sectionCriteriaControllers.delete(textarea);
                }
            }
        }

        function monitorTextareaOverflow(textarea) {
            updateTextareaOverflowState(textarea);
            updateTextareaTooltip(textarea);
            textarea.addEventListener("input", () => {
                updateTextareaOverflowState(textarea);
                updateTextareaTooltip(textarea);
                if (textarea.dataset.section) {
                    handleSectionCriteriaTrigger(textarea);
                }
            });
            textarea.addEventListener("keydown", event => {
                if (event.key === "Enter" && !event.shiftKey) {
                    event.preventDefault();
                    const start = textarea.selectionStart;
                    const end = textarea.selectionEnd;
                    const insert = "\n• ";
                    textarea.setRangeText(insert, start, end, "end");
                    const newPos = start + insert.length;
                    textarea.setSelectionRange(newPos, newPos);
                    updateTextareaOverflowState(textarea);
                }
            });
            textarea.addEventListener("blur", () => {
                normalizeBullets(textarea);
                if (textarea.dataset.section) {
                    handleSectionCriteriaTrigger(textarea, { force: true });
                }
            });
            if (textarea.dataset.section) {
                sectionCriteriaSentenceCount.set(textarea, countCompletedSentences(textarea.value || ""));
            }
        }

        function updateGeneratePlaceholdersButton(remaining = 0) {
            const onCooldown = remaining > 0;
            const disableButtons = onCooldown && !isGeneratingSuggestions;
            if (generateFullSlideBtn) {
                generateFullSlideBtn.disabled = disableButtons;
            }
        }

        function startGeneratePlaceholdersCooldown(duration = PLACEHOLDER_COOLDOWN_DURATION) {
            if (!generateFullSlideBtn) {
                return;
            }
            if (suggestionCooldownTimer) {
                clearInterval(suggestionCooldownTimer);
            }
            let remaining = Math.max(0, duration);
            updateGeneratePlaceholdersButton(remaining);
            if (remaining > 0) {
                canvasGenerateCountdown?.start(remaining);
            }
            if (remaining === 0) {
                return;
            }
            suggestionCooldownTimer = setInterval(() => {
                remaining -= 1;
                if (remaining <= 0) {
                    clearInterval(suggestionCooldownTimer);
                    suggestionCooldownTimer = null;
                    updateGeneratePlaceholdersButton(0);
                    canvasGenerateCountdown?.stop();
                } else {
                    updateGeneratePlaceholdersButton(remaining);
                }
            }, 1000);
        }

        function stopGeneratePlaceholdersCooldown() {
            if (suggestionCooldownTimer) {
                clearInterval(suggestionCooldownTimer);
                suggestionCooldownTimer = null;
            }
            canvasGenerateCountdown?.stop();
            updateGeneratePlaceholdersButton(0);
        }

        async function generateFullSlideContent() {
            if (activeIaAbortController) {
                try { activeIaAbortController.abort(); } catch (e) { }
                activeIaAbortController = null;
                isGeneratingSuggestions = false;
                stopGeneratePlaceholdersCooldown();
                showCopyToast("Requête IA annulée.");
                return;
            }
            stopActiveSpeechSession({ flushInterim: true });
            if (!generateFullSlideBtn || suggestionCooldownTimer) {
                return;
            }
            const slide = getActiveSlideElement();
            if (!slide) {
                return;
            }
            const templateId = slide.dataset.templateId || templates[0].id;
            const sectionTasks = [];
            Array.from(slide.querySelectorAll(".section")).forEach(sectionEl => {
                const sectionKey = sectionEl.dataset.section;
                const textarea = sectionEl.querySelector("textarea");
                if (!sectionKey || !textarea) {
                    return;
                }
                const column = sectionEl.closest(".column");
                const promptContext = buildSectionPromptContext(slide, column, sectionKey, textarea, templateId);
                const promptText = buildFieldPrompt(sectionKey, templateId, promptContext);
                sectionTasks.push({ textarea, messages: buildAssistantMessages(promptText) });
            });

            const bottomTextarea = slide.querySelector(".bottom-section-text");
            if (!sectionTasks.length && !bottomTextarea) {
                showCopyToast("Aucune zone à générer.");
                return;
            }

            const generateForTextarea = async (textarea, messages) => {
                const aiText = await callOpenAI(messages, activeIaAbortController);
                if (!aiText) {
                    return false;
                }
                const trimmed = aiText.trim();
                if (!trimmed) {
                    return false;
                }
                textarea.value = trimmed;
                updateTextareaOverflowState(textarea);
                return true;
            };

            const controller = new AbortController();
            activeIaAbortController = controller;
            isGeneratingSuggestions = true;
            startGeneratePlaceholdersCooldown(PLACEHOLDER_COOLDOWN_DURATION);

            try {
                const sectionResults = await Promise.allSettled(
                    sectionTasks.map(({ textarea, messages }) => generateForTextarea(textarea, messages))
                );
                const sectionsHaveResponse = sectionResults.length === 0
                    ? true
                    : sectionResults.every(result => result.status === "fulfilled" && result.value);
                const sectionSucceeded = sectionResults.some(result => result.status === "fulfilled" && result.value);

                let bottomSuccess = false;
                if (bottomTextarea && sectionsHaveResponse) {
                    const bottomPromptContext = buildBottomPromptContext(slide);
                    const bottomPrompt = buildFieldPrompt("bottom-section", templateId, bottomPromptContext);
                    bottomSuccess = await generateForTextarea(bottomTextarea, buildAssistantMessages(bottomPrompt));
                }

                const hasSuccess = sectionSucceeded || bottomSuccess;
                if (hasSuccess) {
                    schedulePersist();
                    updateSlideEmptyState();
                    showCopyToast("Contenu IA généré pour cette page.");
                } else {
                    showCopyToast("Impossible de générer le contenu.");
                }
            } finally {
                isGeneratingSuggestions = false;
                activeIaAbortController = null;
                stopGeneratePlaceholdersCooldown();
            }
        }

        function buildAdvicePrompt({ globalContext, sectionLabel, columnSection, fieldValue }) {
            const contextSnippet = globalContext ? `"""${globalContext}"""` : "aucun contexte global";
            const sectionInfo = sectionLabel ? `"${sectionLabel}"` : "cette section";
            const columnInfo = columnSection ? `"${columnSection}"` : "cette colonne";
            const trimmedValue = fieldValue ? fieldValue.trim() : "";
            const valueDescriptor = trimmedValue ? `"${trimmedValue}"` : "vide";
            const emptyRule =
                "Si le champ est vide, propose exactement deux • de moins de 15 mots pour prioriser cette saisie (le deuxième étant une liste d'exemples concrets) ; réponds uniquement par ces deux lignes sans autre texte ni émoji.";
            const filledRule =
                "Si le champ est rempli, suggère deux points positifs (précédés de +) et des critiques constructives (précédés de -) de moins de 15 mots chacune pour améliorer cette saisie ; réponds uniquement par ces deux lignes sans autre texte ni émoji.";
            const applicationHint = `Le champ actuel est ${valueDescriptor}. Applique uniquement la règle correspondante.`;
            return (
                `Sur la base du contexte global ${contextSnippet}, pour la section ${sectionInfo} dans ${columnInfo}, ${applicationHint}\n` +
                `${emptyRule}\n${filledRule}`
            );
        }

        async function requestSectionAdvice({ slide, sectionKey, sectionLabel, columnKey, columnSection, textarea, fieldValue }, controller) {
            try {
                const contextValue =
                    (pageContextField?.value || getSlidePageContext(slide) || "").trim();
                const promptText = buildAdvicePrompt({
                    globalContext: contextValue,
                    sectionLabel,
                    columnSection,
                    fieldValue
                });
                const messages = buildAssistantMessages(promptText);
                const aiText = await callOpenAI(messages, controller);
                if (!aiText) {

                const trimmed = aiText.trim();
                if (!trimmed) {
                    return false;
                }
                textarea.dataset.suggestionPlaceholder = trimmed;
                updateTextareaTooltip(textarea);
                updateSectionCanvasExample(slide, columnKey, sectionKey, trimmed);

        function buildSectionTask(sectionEl) {
            if (!sectionEl) {
                return null;
            }
            const slide = sectionEl.closest(".slide");
            if (!slide) return null;
            const sectionKey = sectionEl.dataset.section;
            const textarea = sectionEl.querySelector("textarea");
            if (!sectionKey || !textarea) {
                return null;
            }
            const column = sectionEl.closest(".column");
            const columnStage = column?.dataset.stage || "";
            const columnTitle = column?.querySelector(".column-title")?.textContent.trim() || "";
            const columnSection = columnTitle || columnStage || "cette colonne";
            const columnKey = columnStage || columnTitle || `column-${sectionKey}`;
            const templateId = slide?.dataset.templateId || templates[0].id;
            const sectionLabel =
                column?.querySelector(`.section-label[data-section="${sectionKey}"]`)?.textContent.trim() ||
                getDefaultSectionLabel(templateId, sectionKey);
            return {
                slide,
                sectionKey,
                sectionLabel,
                columnKey,
                columnSection,
                fieldValue: textarea?.value.trim() || "",
                textarea
            };
        }

        async function generateSectionAdvice() {
            if (activeIaAbortController) {
                try { activeIaAbortController.abort(); } catch (e) { }
                activeIaAbortController = null;
                isGeneratingAdvice = false;
                setButtonBusyState(adviceBtn, false);
                showCopyToast("Requête IA annulée.");
                return;
            }
            if (!adviceBtn) return;
            const slide = getActiveSlideElement();

            const templateId = slide.dataset.templateId || templates[0].id;
            const tasks = Array.from(slide.querySelectorAll(".section"))
                .map(section => buildSectionTask(section))
                .filter(Boolean);

                showCopyToast("Aucune section à conseiller.");
                return;
            }
            setButtonBusyState(adviceBtn, true);
            isGeneratingAdvice = true;
            const controller = new AbortController();
            activeIaAbortController = controller;
            try {
                const results = await Promise.allSettled(tasks.map(task => requestSectionAdvice(task, controller)));
                const hasSuccess = results.some(result => result.status === "fulfilled" && result.value);
                if (hasSuccess) {
                    schedulePersist();
                    showCopyToast("Conseils IA mis à jour.");
                } else {
                    showCopyToast("Impossible de générer les conseils IA.");
                }
            } finally {
                isGeneratingAdvice = false;
                activeIaAbortController = null;
                setButtonBusyState(adviceBtn, false);
            }
        }

        async function handleSectionAdviceClick(button) {
            const sectionEl = button.closest(".section");

            if (!task) return;
            button.disabled = true;
            setButtonBusyState(button, true);

                    schedulePersist();
                    showCopyToast("Conseil IA mis à jour.");

            const slide = getActiveSlideElement();

        function normalizeFontSize(value) {
            const parsed = Number(value);
            if (Number.isNaN(parsed)) {
                return currentFontSize;
            }
            return Math.max(8, Math.min(72, parsed));
        }

        function syncFontControls() {
            if (fontSelect) {
                fontSelect.value = currentTextStyleIndex;
            }
            if (fontSizeInput) {
                fontSizeInput.value = currentFontSize;
            }
        }

        function handleFontSizeChange(value) {
            const normalized = normalizeFontSize(value);
            if (normalized === currentFontSize && Number(value) === normalized) {
                return;
            }
            currentFontSize = normalized;
            if (fontSizeInput) {
                fontSizeInput.value = normalized;
            }
            const activeSlide = getActiveSlideElement();
            if (activeSlide) {
                applyTextStyleToSlide(activeSlide, currentTextStyleIndex, currentFontSize);
            }
        }

                option.style.fontFamily = style.font;
                option.style.fontSize = `${style.size}px`;
                fontSelect.appendChild(option);
            });

                const btn = document.createElement("button");

                btn.dataset.index = index;
                btn.textContent = ratio.name;

                });
                ratioButtons.push(btn);
                ratioGrid.appendChild(btn);
            });

                currentTextStyleIndex = parseInt(fontSelect.value, 10);
                const activeSlide = getActiveSlideElement();
                if (activeSlide) {
                    applyTextStyleToSlide(activeSlide, currentTextStyleIndex, currentFontSize);

                opt.style.fontSize = `${opt.value}px`;

        function updateRatioButtons() {

        function parseHexColor(value) {
            const hex = value.replace(/^#/, "");
            if (hex.length !== 6) return null;
            return {
                r: parseInt(hex.slice(0, 2), 16),
                g: parseInt(hex.slice(2, 4), 16),
                b: parseInt(hex.slice(4, 6), 16)
            };
        }

        function getBrightnessFromColor(value) {
            const parsed = parseHexColor(value);
            if (!parsed) return 1;
            return (parsed.r * 299 + parsed.g * 587 + parsed.b * 114) / 1000 / 255;
        }

        function getTextColorForBackground(value) {
            if (!value || value === "transparent") {
                return "#2f2922";
            }
            if (value.startsWith("linear-gradient")) {
                const match = value.match(/#([0-9a-fA-F]{6})/);
                if (match) {
                    value = `#${match[1]}`;
                }
            }
            const brightness = getBrightnessFromColor(value);
            return brightness < 0.6 ? "#ffffff" : "#2f2922";
        }

        function setSlideTextColor(slide, color) {
            const textColor = getTextColorForBackground(color);
            slide.style.setProperty("--slide-text-color", textColor);
        }

        function applyBackgroundToSlide(slide, color) {
            const normalized = color || userDefaultBackground || "#ffffff";
            slide.dataset.bgColor = normalized;
            slide.style.setProperty("--slide-bg", normalized);
            setSlideTextColor(slide, normalized);
            schedulePersist();
        }

        function applyTextStyleToSlide(slide, styleIndex, size = currentFontSize) {
            const style = textStyles[styleIndex] || textStyles[0];
            const fontSize = typeof size === "number" ? size : currentFontSize;
            slide.dataset.textStyleIndex = styleIndex;
            slide.dataset.fontSize = fontSize;
            slide.style.setProperty("--slide-font-family", style.font);
            slide.style.setProperty("--slide-font-size", `${fontSize}px`);
            const labelSize = Math.max(fontSize - 2, 12);
            slide.style.setProperty("--slide-label-size", `${labelSize}px`);
            schedulePersist();
        }

        function applyRatio(index) {
            const ratio = ratioOptions[index] || ratioOptions[0];
            currentRatioIndex = index;
            document.documentElement.style.setProperty("--slide-aspect-ratio", ratio.css);
            document.documentElement.style.setProperty("--slide-width", ratio.width || "min(1180px, 100%)");
            if (ratio.ignoreHeightLimit) {
                document.documentElement.style.setProperty("--slide-height-width-limit", "10000px");
            } else {
                document.documentElement.style.removeProperty("--slide-height-width-limit");

                        const suggestionHint =
                            (label && (label.dataset.suggestions || label.title)) ||
                            (textarea && textarea.dataset.suggestionPlaceholder) ||
                            "";
                        columnData.sections[sectionKey] = {
                            label: label ? label.textContent.trim() : fallbackLabel,

                            placeholder: textarea

                const bottomSectionEl = slide.querySelector(".slide-bottom-section");
                const bottomTextarea = bottomSectionEl?.querySelector(".bottom-section-text");
                const bottomSectionData = bottomSectionEl
                    ? { text: bottomTextarea?.value || "", deleted: false }

                const titleEl = slide.querySelector(".slide-title-input");
                const fontSizeValue = parseInt(slide.dataset.fontSize, 10);
                return {
                    title: titleEl ? titleEl.value : getDefaultTitle(templateId),
                    templateId,

                    textStyleIndex: parseStyleIndex(slide.dataset.textStyleIndex),

                    pageContext: slide.dataset.pageContext || "",
                    history: getSlideHistory(slide),
