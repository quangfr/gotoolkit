<head>
    <script>
        (function () {
            const storedTheme = localStorage.getItem('go-toolkit-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = storedTheme || (prefersDark ? 'dark' : 'cream');
            const resolvedTheme = theme === 'auto' ? (prefersDark ? 'dark' : 'cream') : theme;
            document.documentElement.setAttribute('data-theme', resolvedTheme);
        })();
    </script>

    <meta charset="UTF-8">
    <script>
            // Global Polyfill for missing browser APIs (prevents crashes in Excalidraw/Mermaid)
            (function () {
                var g = typeof globalThis !== 'undefined' ? globalThis : window;
                function ensure(name) {
                    try {
                        if (typeof g[name] === 'undefined' || !g[name]) {
                            var F = function () { };
                            F.prototype = {};
                            g[name] = F;
                        }
                        if (g[name] && !g[name].prototype) g[name].prototype = {};
                    } catch (e) { }
                }
                ensure('Element');
                ensure('Path2D');
                ensure('SVGPathSeg');
                // Array.at polyfill if missing
                if (typeof Array.prototype.at !== 'function') {
                    Array.prototype.at = function (n) {
                        n = Math.trunc(n) || 0;
                        if (n < 0) n += this.length;
                        if (n < 0 || n >= this.length) return undefined;
                        return this[n];
                    };
                }
            })();
    </script>

            function hideCellTooltip() {

            function positionCellTooltip(cell) {
                if (!cell || !tooltipOwnerCell) return;
                const rect = cell.getBoundingClientRect();
                gridCellTooltip.classList.add("visible");
                const tooltipRect = gridCellTooltip.getBoundingClientRect();
                const horizontalMargin = 8;
                let left = Math.max(
                    horizontalMargin,
                    Math.min(rect.left, window.innerWidth - tooltipRect.width - horizontalMargin)
                );
                let top = rect.bottom + 6;
                if (top + tooltipRect.height > window.innerHeight - 8) {
                    top = rect.top - tooltipRect.height - 6;
                }
                if (top < 8) {
                    top = 8;
                }
                gridCellTooltip.style.left = `${left}px`;
                gridCellTooltip.style.top = `${top}px`;
            }

            function getCellContentElement(cell) {

            function handleGridMouseMove(event) {
                const cell = event.target.closest(".ag-cell");
                if (!cell || !gridElement.contains(cell)) {
                    hideCellTooltip();
                    return;
                }
                if (cell === tooltipOwnerCell) return;
                const content = getCellContentElement(cell);
                if (!content) {
                    hideCellTooltip();
                    return;
                }
                if (content.scrollWidth <= content.clientWidth) {
                    hideCellTooltip();
                    return;
                }
                const text = (content.textContent || "").trim();
                if (!text) {
                    hideCellTooltip();
                    return;
                }
                tooltipOwnerCell = cell;
                gridCellTooltip.textContent = text;
                gridCellTooltip.classList.remove("visible");
                gridCellTooltip.style.left = "-9999px";
                gridCellTooltip.style.top = "-9999px";
                positionCellTooltip(cell);
            }

            function createPage(index) {
                const tableId = createTableId(index);
                return {
                    id: `page-${Date.now()}-${index}-${Math.floor(Math.random() * 10000)}`,

            function normalizePage(page, index, fallbackTemplateId = "", templateState = null) {
                if (!page || typeof page !== "object") {
                    return createPage(index + 1);
                }
                const tableId =
                    typeof page.tableId === "string" && page.tableId.trim()
                        ? page.tableId.trim()
                        : createTableId(index + 1);
                const templateId =
                    typeof page.templateId === "string" && page.templateId.trim()
                        ? page.templateId.trim()
                        : (typeof fallbackTemplateId === "string" ? fallbackTemplateId.trim() : "");
                const templateConfig = getTemplateConfigById(templateId || DEFAULT_TEMPLATE_ID);
                return {
                    id: page.id || `page-${Date.now()}-${index}`,
                    tableId,
                    title: page.title || `Page ${index + 1}`,
                    primaryKey:
                        typeof page.primaryKey === "string" && page.primaryKey.trim()
                            ? page.primaryKey.trim()
                            : DEFAULT_PRIMARY_KEY,
                    relations: Array.isArray(page.relations) ? page.relations : [],
                    templateId,
                    promptTemplate:
                        page.promptTemplate ||
                        templateState?.promptTemplate ||
                        templateConfig?.defaultPromptTemplate ||
                        DEFAULT_PROMPT_TEMPLATE,
                    systemPrompt:
                        page.systemPrompt ||
                        templateState?.systemPrompt ||
                        templateConfig?.defaultSystemPrompt ||
                        DEFAULT_SYSTEM_PROMPT,
                    scenario: page.scenario || templateState?.scenario || "",
                    datasetScript: page.datasetScript || page.script || templateState?.datasetScript || "",
                    lastAiDatasetScript:
                        page.lastAiDatasetScript || page.lastAiScript || templateState?.lastAiDatasetScript || "",
                    lastManualDatasetScript:
                        typeof page.lastManualDatasetScript === "string"
                            ? page.lastManualDatasetScript
                            : (templateState?.lastManualDatasetScript ?? null),
                    data: page.data && typeof page.data === "object"
                        ? {
                            columnDefs: Array.isArray(page.data.columnDefs) ? page.data.columnDefs : [],
                            rowData: Array.isArray(page.data.rowData) ? page.data.rowData : []
                        }
                        : { columnDefs: [], rowData: [] }
                };
            }

            function normalizeRelation(rel) {
                if (!rel || typeof rel !== "object") return null;
                const type = typeof rel.type === "string" ? rel.type.trim() : "";
                const fromTable = typeof rel.fromTable === "string" ? rel.fromTable.trim() : "";
                const fromColumn = typeof rel.fromColumn === "string" ? rel.fromColumn.trim() : "";
                const toTable = typeof rel.toTable === "string" ? rel.toTable.trim() : "";
                const toColumn = typeof rel.toColumn === "string" ? rel.toColumn.trim() : "";
                const label = typeof rel.label === "string" ? rel.label.trim() : "";
                if (!fromTable || !fromColumn || !toTable || !toColumn) return null;
                return { type, fromTable, fromColumn, toTable, toColumn, label };
            }

            function normalizeDatasetSchema(dataset) {
                const tables = Array.isArray(dataset?.schema?.tables) ? dataset.schema.tables : [];
                return {
                    tables: tables
                        .map(table => {
                            if (!table || typeof table !== "object") return null;
                            const id = typeof table.id === "string" ? table.id.trim() : "";
                            if (!id) return null;
                            const title = typeof table.title === "string" && table.title.trim() ? table.title.trim() : id;
                            const primaryKey =
                                typeof table.primaryKey === "string" && table.primaryKey.trim()
                                    ? table.primaryKey.trim()
                                    : DEFAULT_PRIMARY_KEY;
                            const columns = Array.isArray(table.columns) ? table.columns : [];
                            const relations = (Array.isArray(table.relations) ? table.relations : [])
                                .map(normalizeRelation)
                                .filter(Boolean);
                            return { id, title, primaryKey, columns, relations };
                        })
                        .filter(Boolean)
                };
            }

            function buildDatasetFromState(options = {}) {
                const activeOnly = Boolean(options.activeOnly);
                const schemaTablesFromState = Array.isArray(state?.schema?.tables) ? state.schema.tables : [];
                const fullPages = Array.isArray(state.pages) ? state.pages : [];
                const activePage = getActivePage();
                const pages = activeOnly
                    ? (activePage ? [activePage] : [])
                    : fullPages.slice();
                if (!pages.length) {
                    pages.push(createPage(1));
                }
                const desiredIds = new Set(pages.map(page => page?.tableId || ""));
                let schemaTables = [];
                if (schemaTablesFromState.length) {
                    schemaTables = schemaTablesFromState
                        .filter(table => table && typeof table === "object" && desiredIds.has(table.id))
                        .map(table => ({
                            id: table.id,
                            title: table.title,
                            primaryKey: table.primaryKey || DEFAULT_PRIMARY_KEY,
                            columns: Array.isArray(table.columns) ? table.columns : [],
                            relations: Array.isArray(table.relations) ? table.relations : []
                        }))
                        .filter(Boolean);
                }
                if (!schemaTables.length) {
                    schemaTables = pages.map(page => ({
                        id: page?.tableId || "",
                        title: page?.title || "",
                        primaryKey: page?.primaryKey || DEFAULT_PRIMARY_KEY,
                        columns: [],
                        relations: Array.isArray(page?.relations) ? page.relations : []
                    })).filter(table => table.id);
                }
                const data = {};
                pages.forEach(page => {
                    const id = page?.tableId;
                    if (!id) return;
                    data[id] = {
                        columnDefs: Array.isArray(page.data?.columnDefs) ? page.data.columnDefs : [],
                        rowData: Array.isArray(page.data?.rowData) ? page.data.rowData : []
                    };
                });
                return { schema: { tables: schemaTables }, data };
            }

            function buildDatasetFromPage(page) {
                if (!page) return { schema: { tables: [] }, data: {} };
                const schemaTablesFromState = Array.isArray(state?.schema?.tables) ? state.schema.tables : [];
                const tableId = page?.tableId || "";
                let schemaTables = [];
                if (schemaTablesFromState.length && tableId) {
                    schemaTables = schemaTablesFromState

                            relations: Array.isArray(table.relations) ? table.relations : []
                        }))
                        .filter(Boolean);
                }
                if (!schemaTables.length && tableId) {
                    schemaTables = [{
                        id: tableId,
                        title: page?.title || "",
                        primaryKey: page?.primaryKey || DEFAULT_PRIMARY_KEY,
                        columns: [],
                        relations: Array.isArray(page?.relations) ? page.relations : []

                }
                return { schema: { tables: schemaTables }, data };
            }

            function normalizeTreePath(rawPath, fallback = []) {
                if (Array.isArray(rawPath)) {
                    return rawPath.map(item => (item == null ? "" : String(item))).filter(Boolean);
                }
                if (typeof rawPath === "string" && rawPath.trim()) {
                    return rawPath
                        .split(/[>\/|]+/)
                        .map(part => part.trim())
                        .filter(Boolean);
                }
                return Array.isArray(fallback) ? [...fallback] : [];
            }

            function normalizeTreeRowInput(row, parentPath = []) {
                if (!row || typeof row !== "object") return null;
                const rawPath = row.path ?? row.__path;
                const fallbackName = row.name || row.id || "item";
                const isMapping = isDataMappingTemplateActive();

                const normalizedTargetField =
                    typeof row.targetField === "string" ? row.targetField.trim() : "";
                const normalizedName = typeof row.name === "string" ? row.name.trim() : "";

                // In structure mode, the label is the "name" field.
                // In mapping mode, the label is the "targetField" (fallback to name/id).
                const labelValue = isMapping
                    ? (normalizedTargetField || normalizedName || fallbackName)
                    : (normalizedName || fallbackName);
                const fallbackPath = rawPath ? [] : [...parentPath, labelValue];
                const path = normalizeTreePath(rawPath, fallbackPath);
                const level = Math.max(0, path.length - 1);
                const targetField = typeof row.targetField === "string" ? row.targetField.trim() : "";
                const descriptionValue = typeof row.description === "string" ? row.description.trim() : "";
                const statusValue = typeof row.status === "string" ? row.status.trim() : "";
                const rulesValue = typeof row.rules === "string" ? row.rules : "";
                const effectiveStatus =
                    (isMapping && statusValue) ? statusValue : isMapping ? DEFAULT_MAPPING_STATUS : statusValue;
                const effectiveTargetField = isMapping
                    ? (targetField || labelValue)
                    : labelValue;
                return {
                    ...row,
                    id: row.id || path.join("::") || fallbackName,
                    name: labelValue,
                    targetField: effectiveTargetField,
                    sourceField: typeof row.sourceField === "string"
                        ? row.sourceField.trim()
                        : "",
                    type: row.type || "",
                    description: descriptionValue,
                    format: row.format || "",
                    definition: row.definition || "",
                    sample: row.sample || "",
                    source: row.source || "",
                    relation: row.relation || "1..1",
                    status: effectiveStatus || (isMapping ? DEFAULT_MAPPING_STATUS : ""),
                    rules: rulesValue,
                    path,
                    __path: path,
                    level
                };
            }

            function flattenTreeNodes(nodes = [], parentPath = []) {
                const rows = [];
                nodes.forEach(node => {
                    if (!node) return;
                    const normalized = normalizeTreeRowInput(node, parentPath);
                    if (normalized) {
                        rows.push(normalized);
                    }
                    if (Array.isArray(node.children) && node.children.length) {
                        const nextParent = normalized?.__path?.length ? normalized.__path : parentPath;
                        rows.push(...flattenTreeNodes(node.children, nextParent));
                    }
                });
                return rows;
            }

            function normalizeTreeRows(rows = []) {
                return rows
                    .map(row => normalizeTreeRowInput(row))
                    .filter(Boolean);
            }

            function pathKey(path = []) {
                return Array.isArray(path) ? path.join(" / ") : "";
            }

            function sortRowsByPath(rows = []) {
                return [...rows].sort((a, b) => {
                    const pa = Array.isArray(a.__path) ? a.__path : [];
                    const pb = Array.isArray(b.__path) ? b.__path : [];
                    const len = Math.max(pa.length, pb.length);
                    for (let i = 0; i < len; i++) {
                        const av = pa[i];
                        const bv = pb[i];
                        if (av == null && bv == null) continue;
                        if (av == null) return -1;
                        if (bv == null) return 1;
                        if (av === bv) continue;
                        return av < bv ? -1 : 1;
                    }
                    return pa.length - pb.length;
                });
            }

            function decorateTreeRows(rows = [], options = {}) {
                const normalizedRows = normalizeTreeRows(rows);
                const baseRows = options?.sortPaths ? sortRowsByPath(normalizedRows) : normalizedRows;
                const childrenByParent = new Map();

                baseRows.forEach(row => {
                    const parentKey = pathKey(row.__path.slice(0, -1));
                    const list = childrenByParent.get(parentKey) || [];
                    list.push(row);
                    childrenByParent.set(parentKey, list);
                });

                const isLastMap = new Map();
                childrenByParent.forEach(list => {
                    list.forEach((row, idx) => {
                        const key = pathKey(row.__path);
                        isLastMap.set(key, idx === list.length - 1);
                    });
                });

                baseRows.forEach(row => {
                    const segments = Array.isArray(row.__path) && row.__path.length
                        ? row.__path
                        : [row.name || "item"];
                    const isRoot = segments.length <= 1;
                    if (isRoot) {
                        row.__prefix = "";
                    } else {
                        const parts = [];
                        segments.forEach((_, idx) => {
                            const key = pathKey(segments.slice(0, idx + 1));
                            const isLast = isLastMap.get(key) ?? true;
                            if (idx === segments.length - 1) {
                                parts.push(isLast ? "└─ " : "├─ ");
                            } else {
                                parts.push(isLast ? "   " : "│  ");
                            }
                        });
                        row.__prefix = parts.join("");
                    }
                    row.level = Math.max(0, segments.length - 1);
                    row.path = segments;
                    row.__path = segments;
                });

                return baseRows;
            }

            function buildTreeDatasetFromRows(rows, title = "Structure de données", templateId = getPageTemplateId()) {
                const resolvedTemplateId =
                    templateId || state?.activeTemplateId || DEFAULT_TEMPLATE_ID;
                const columnDefs = buildTreeColumnDefs();
                const rowData = decorateTreeRows(rows, { sortPaths: true });
                const isMapping = resolvedTemplateId === "data-mapping";
                const tableId = isMapping ? "mapping" : "structure";
                const columns = isMapping
                    ? [
                        { field: "targetField" },
                        { field: "sourceField" },
                        { field: "type" },
                        { field: "format" },
                        { field: "status" },
                        { field: "rules" }
                    ]
                    : [
                        { field: "name" },
                        { field: "type" },
                        { field: "format" },
                        { field: "definition" },
                        { field: "sample" },
                        { field: "source" },
                        { field: "relation" }
                    ];
                return {
                    schema: {
                        tables: [
                            {
                                id: tableId,
                                title,
                                primaryKey: "id",
                                columns,
                                relations: []
                            }
                        ]
                    },
                    data: {
                        [tableId]: {
                            columnDefs,
                            rowData
                        }
                    }
                };
            }

            function buildTreeDatasetFromNodes(nodes) {
                return buildTreeDatasetFromRows(flattenTreeNodes(nodes));
            }

            function normalizeTreePayload(payload) {
                if (!payload || typeof payload !== "object") return null;
                const title = (typeof payload?.title === "string" && payload.title.trim()) || "Structure de données";
                if (Array.isArray(payload.rows)) {
                    return buildTreeDatasetFromRows(payload.rows, title);
                }
                if (Array.isArray(payload.tree)) {
                    return buildTreeDatasetFromNodes(payload.tree);
                }
                if (Array.isArray(payload.nodes)) {
                    return buildTreeDatasetFromNodes(payload.nodes);
                }
                if (Array.isArray(payload?.data?.structure?.rowData)) {
                    return buildTreeDatasetFromRows(payload.data.structure.rowData, title);
                }
                return null;
            }

            function setTreeRowData(rows = []) {
                const prepared = decorateTreeRows(rows);
                if (gridApi) {
                    if (typeof gridApi.setGridOption === "function") {
                        gridApi.setGridOption("rowData", prepared);
                    } else if (typeof gridApi.setRowData === "function") {
                        gridApi.setRowData(prepared);
                    }
                }
                const page = getActivePage();
                if (page?.data) {
                    page.data.rowData = prepared;
                }
                return prepared;
            }

            function deleteTreeRow(node) {
                if (!node?.data) return;
                const selfPath = Array.isArray(node.data.__path) ? node.data.__path : [];
                const rows = collectAllRows().filter(row => {
                    const path = Array.isArray(row.__path) ? row.__path : normalizeTreePath(row.path || []);
                    return !isPathPrefix(selfPath, path);
                });
                setTreeRowData(rows);
                syncScriptFromGrid();
            }

            function prepareTreeRowsForExport(rows = [], templateId = getPageTemplateId()) {
                const cloned = Array.isArray(rows) ? rows.map(row => ({ ...row })) : [];
                const isMapping = templateId === "data-mapping";
                return decorateTreeRows(cloned).map(row => {
                    if (isMapping) {
                        return {
                            id: row.id || pathKey(row.__path),
                            sourceField: row.sourceField || row.name || "",
                            targetField: row.targetField || "",
                            path: Array.isArray(row.__path) ? row.__path : [],
                            type: row.type || "",
                            description: row.description || "",
                            status: row.status || DEFAULT_MAPPING_STATUS,
                            rules: row.rules || "",
                            format: row.format || ""
                        };
                    }
                    return {
                        id: row.id || pathKey(row.__path),
                        name: row.name || "",
                        path: Array.isArray(row.__path) ? row.__path : [],
                        type: row.type || "",
                        format: row.format || "",
                        definition: row.definition || "",
                        sample: row.sample || "",
                        source: row.source || "",
                        relation: row.relation || "1..1"
                    };
                });
            }

            function hasDatasetContent(dataset) {
                if (!dataset || typeof dataset !== "object") return false;
                const data = dataset.data;
                if (!data || typeof data !== "object") return false;
                return Object.values(data).some(pageData => {
                    const cols = Array.isArray(pageData?.columnDefs) ? pageData.columnDefs : [];
                    const rows = Array.isArray(pageData?.rowData) ? pageData.rowData : [];
                    return cols.length > 0 || rows.length > 0;
                });
            }

            function cycleRelation(value) {
                const order = ["1..1", "0..1", "1..n", "0..n"];
                const idx = order.indexOf(value);
                if (idx === -1 || idx === order.length - 1) return order[0];
                return order[idx + 1];
            }

            function collectAllRows() {
                const rows = [];
                try {
                    gridApi?.forEachNode(node => {
                        if (node && node.data) {
                            rows.push({ ...node.data });
                        }
                    });
                } catch (err) { /* ignore */ }
                return rows;
            }

            function makeUniquePathSegment(rows = [], parentPath = [], desiredSegment = "item", selfId = "") {
                const base = (desiredSegment || "item").trim() || "item";
                const siblings = new Set(
                    rows
                        .filter(r => {
                            if (selfId && r?.id === selfId) return false;
                            const p = Array.isArray(r?.__path) ? r.__path : normalizeTreePath(r?.path || []);
                            if (p.length !== parentPath.length + 1) return false;
                            return isPathPrefix(parentPath, p);
                        })
                        .map(r => {
                            const p = Array.isArray(r?.__path) ? r.__path : normalizeTreePath(r?.path || []);
                            return p[p.length - 1] || "";
                        })
                        .filter(Boolean)
                );
                if (!siblings.has(base)) return base;
                let counter = 2;
                while (counter < 1000) {
                    const candidate = `${base}_${counter}`;
                    if (!siblings.has(candidate)) return candidate;
                    counter += 1;
                }
                return `${base}_${Date.now().toString().slice(-4)}`;
            }

            function addChildRow(parentNode) {
                if (!parentNode) return;
                // Ensure any in-progress edit (e.g. Identifiant) is committed before snapshotting rows.
                try {
                    gridApi?.stopEditing();
                } catch (err) { /* ignore */ }
                const parentPath = Array.isArray(parentNode?.data?.__path) ? parentNode.data.__path : [];
                const rows = collectAllRows();
                const isMapping = isDataMappingTemplateActive();
                const targetLabel = "Nouveau";
                const newSegment = makeUniquePathSegment(rows, parentPath, targetLabel);
                const newPath = [...parentPath, newSegment];
                const newRow = {
                    id: `new_${Date.now()}`,
                    __path: newPath,
                    path: newPath,
                    level: parentPath.length,
                    name: targetLabel,
                    sourceField: "",
                    targetField: targetLabel,
                    description: "",
                    type: "",
                    format: "",
                    definition: "",
                    sample: "",
                    source: "",
                    relation: "1..1",
                    status: isMapping ? DEFAULT_MAPPING_STATUS : "",
                    rules: "",
                };
                try {
                    const insertAt = (() => {
                        const idx = rows.findIndex(row => isPathPrefix(parentPath, row.__path || row.path || []));
                        if (idx === -1) return rows.length;
                        let cursor = idx + 1;
                        while (
                            cursor < rows.length &&
                            isPathPrefix(parentPath, rows[cursor].__path || rows[cursor].path || [])
                        ) {
                            cursor += 1;
                        }
                        return cursor;
                    })();
                    const nextRows = [...rows];
                    nextRows.splice(insertAt, 0, newRow);
                    const prepared = setTreeRowData(nextRows);
                    requestAnimationFrame(() => {
                        try {
                            const node = gridApi?.getRowNode?.(newRow.id);
                            if (node) {
                                gridApi.ensureNodeVisible(node, "middle");
                                gridApi.startEditingCell({
                                    rowIndex: prepared.findIndex(r => r.id === newRow.id),
                                    colKey: "name"
                                });
                            }
                        } catch (err) { /* ignore */ }
                    });
                    syncScriptFromGrid();
                } catch (err) {
                    console.warn("Impossible d'ajouter un enfant", err);
                }
            }

            function isPathPrefix(prefix, path) {
                if (!Array.isArray(prefix) || !Array.isArray(path)) return false;
                if (prefix.length > path.length) return false;
                return prefix.every((item, idx) => item === path[idx]);
            }

            function updateSubtreePaths(rows, oldPrefix, newPrefix) {
                return rows.map(row => {
                    const path = Array.isArray(row.__path) ? row.__path : normalizeTreePath(row.path || []);
                    if (!isPathPrefix(oldPrefix, path)) return row;
                    const suffix = path.slice(oldPrefix.length);
                    const nextPath = [...newPrefix, ...suffix];
                    return { ...row, __path: nextPath, path: nextPath };
                });
            }

            function splitSubtree(rows = [], rootPath = []) {
                const subtree = [];
                const remaining = [];
                rows.forEach(row => {
                    const path = Array.isArray(row.__path) ? row.__path : normalizeTreePath(row.path || []);
                    if (isPathPrefix(rootPath, path)) {
                        subtree.push(row);
                    } else {
                        remaining.push(row);
                    }
                });
                return { subtree, remaining };
            }

            function pathEquals(a = [], b = []) {
                if (!Array.isArray(a) || !Array.isArray(b)) return false;
                if (a.length !== b.length) return false;
                return a.every((val, idx) => val === b[idx]);
            }

            function findSubtreeStartIndex(rows = [], targetPath = []) {
                const key = pathKey(targetPath);
                return rows.findIndex(r => pathKey(r.__path || normalizeTreePath(r.path || [])) === key);
            }

            function findSubtreeEndIndex(rows = [], targetPath = []) {
                const idx = findSubtreeStartIndex(rows, targetPath);
                if (idx === -1) return rows.length;
                let end = idx;
                for (let i = idx + 1; i < rows.length; i++) {
                    const path = Array.isArray(rows[i].__path) ? rows[i].__path : normalizeTreePath(rows[i].path || []);
                    if (isPathPrefix(targetPath, path)) {
                        end = i;
                    } else {
                        break;
                    }
                }
                return end + 1;
            }

            function moveTreeSubtree(draggedPath, overPath, dropMode) {
                if (!Array.isArray(draggedPath) || !draggedPath.length || !Array.isArray(overPath)) return;
                if (isPathPrefix(draggedPath, overPath)) return;
                const rows = collectAllRows();
                const { subtree, remaining } = splitSubtree(rows, draggedPath);
                const overStartIdx = findSubtreeStartIndex(remaining, overPath);
                const overEndIdx = findSubtreeEndIndex(remaining, overPath);

                let newParentPath = overPath;
                let insertIndex = remaining.length;
                const newBase = draggedPath[draggedPath.length - 1] || "item";

                if (dropMode === "above") {
                    newParentPath = overPath.slice(0, -1);
                    insertIndex = overStartIdx === -1 ? remaining.length : overStartIdx;
                } else if (dropMode === "below") {
                    newParentPath = overPath.slice(0, -1);
                    insertIndex = overEndIdx === -1 ? remaining.length : overEndIdx;
                } else {
                    newParentPath = overPath;
                    insertIndex = findSubtreeEndIndex(remaining, overPath);
                }

                const newPath = [...newParentPath, newBase];
                const updatedSubtree = updateSubtreePaths(subtree, draggedPath, newPath);
                const nextRows = [...remaining];
                nextRows.splice(insertIndex, 0, ...updatedSubtree);
                setTreeRowData(nextRows);
                syncScriptFromGrid();
            }

            function handleTreeRowDragEnd(event) {
                // Drag-and-drop now handled by custom renderer; noop here.
            }

            function relationCellRenderer(params) {
                const relation = params.value || params.data?.relation || "1..1";
                const btn = document.createElement("button");
                btn.type = "button";
                const cls = (relation === "1..n" || relation === "1..1")
                    ? "yellow"
                    : (relation === "0..1" || relation === "0..n")
                        ? "gray"
                        : "";
                btn.className = `relation-badge ${cls}`;
                btn.textContent = relation;
                btn.title = "Basculer la cardinalité";
                btn.addEventListener("click", event => {
                    event.stopPropagation();
                    const next = cycleRelation(params.data?.relation);
                    params.node.setDataValue("relation", next);
                    btn.textContent = next;
                    const nextCls = (next === "1..n" || next === "1..1")
                        ? "yellow"
                        : (next === "0..1" || next === "0..n")
                            ? "gray"
                            : "";
                    btn.className = `relation-badge ${nextCls}`;
                    syncScriptFromGrid();
                });
                return btn;
            }

            const treeDragState = { draggingPath: null };

            function structureCellRenderer(params) {
                const level = Math.max(0, (params.data?.level ?? 0));
                const wrapper = document.createElement("div");
                wrapper.className = "treeCell";
                wrapper.setAttribute("draggable", "true");

                const indent = document.createElement("span");
                indent.className = "indent";
                indent.style.setProperty("--depth", level);
                indent.classList.add(`depth-${level}`);

                const label = document.createElement("span");
                label.className = "label";
                const valueText = params.value || "";
                label.textContent = valueText;

                function clearDropState() {
                    wrapper.removeAttribute("data-drop");
                }

                const beginDrag = event => {
                    treeDragState.draggingPath = Array.isArray(params.data?.__path)
                        ? params.data.__path
                        : normalizeTreePath(params.data?.path || []);
                    event.dataTransfer.effectAllowed = "move";
                };
                wrapper.addEventListener("dragstart", beginDrag);

                const endDrag = () => {
                    treeDragState.draggingPath = null;
                    clearDropState();
                };
                wrapper.addEventListener("dragend", endDrag);

                wrapper.addEventListener("dragover", event => {
                    if (!treeDragState.draggingPath) return;
                    event.preventDefault();
                    const rect = wrapper.getBoundingClientRect();
                    const relY = (event.clientY - rect.top) / rect.height;
                    if (relY < 0.25) {
                        wrapper.setAttribute("data-drop", "above");
                    } else if (relY > 0.75) {
                        wrapper.setAttribute("data-drop", "below");
                    } else {
                        wrapper.setAttribute("data-drop", "child");
                    }
                });

                wrapper.addEventListener("dragleave", () => clearDropState());

                wrapper.addEventListener("drop", event => {
                    if (!treeDragState.draggingPath) return;
                    event.preventDefault();
                    const dropMode = wrapper.getAttribute("data-drop") || "child";
                    const targetPath = Array.isArray(params.data?.__path)
                        ? params.data.__path
                        : normalizeTreePath(params.data?.path || []);
                    moveTreeSubtree(treeDragState.draggingPath, targetPath, dropMode);
                    treeDragState.draggingPath = null;
                    clearDropState();
                });

                wrapper.append(indent, label);
                return wrapper;
            }

            function treeActionRenderer(params) {
                const wrapper = document.createElement("div");
                wrapper.className = "treeCell";

                const addBtn = document.createElement("button");
                addBtn.type = "button";
                addBtn.className = "addBtn";
                addBtn.textContent = "+";
                addBtn.title = "Ajouter un enfant";
                addBtn.addEventListener("click", event => {
                    event.stopPropagation();
                    addChildRow(params.node);
                });

                const deleteBtn = document.createElement("button");
                deleteBtn.type = "button";
                deleteBtn.className = "addBtn";
                deleteBtn.textContent = "×";
                deleteBtn.title = "Supprimer la ligne";
                deleteBtn.addEventListener("click", event => {
                    event.stopPropagation();
                    deleteTreeRow(params.node);
                });

                wrapper.append(addBtn, deleteBtn);
                return wrapper;
            }

            function syncDatasetScriptFromState(options = {}) {
                const tplConfig = getActiveTemplateConfig();
                const isMockTemplate = tplConfig?.id === "data-mock";
                const isTree = isTreeTemplateActive();
                let next = "";
                let dataset = null;
                const activePage = getActivePage();

                if (isMockTemplate) {
                    next = (activePage?.datasetScript || "").trim();
                } else if (isTree) {
                    const rows = prepareTreeRowsForExport(
                        activePage?.data?.rowData || [],
                        getPageTemplateId(activePage) || state.activeTemplateId || DEFAULT_TEMPLATE_ID
                    );
                    next = rows.length ? JSON.stringify({ rows }, null, 2) : "";
                } else {
                    dataset = buildDatasetFromState({ activeOnly: true });
                    const hasContent = hasDatasetContent(dataset);
                    next = hasContent ? JSON.stringify(dataset, null, 2) : "";
                }

                if (activePage) {
                    activePage.datasetScript = next;
                }
                if (isMockTemplate && activePage) {
                    activePage.datasetScript = next;
                }
                if (gridScript) {
                    gridScript.value = next;
                }
                if (options.persist !== false) {
                    persistState();
                }
                return dataset;
            }

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) {
                        return {
                            pages: [],
                            activeIndex: 0,
                            reasoningEffort: "low",
                            displayPreferences: { ...DISPLAY_PREFERENCE_DEFAULTS },
                            activeTemplateId: DEFAULT_TEMPLATE_ID,
                            templatePromptOverrides: {},
                            treeSourceOptions: TREE_SOURCE_OPTIONS.slice(),
                            treeTypeOptions: TREE_TYPE_OPTIONS.slice(),
                            schema: { tables: [] },
                            scenarioGeneratedTables: {}
                        };
                    }
                    const parsed = JSON.parse(raw);
                    const activeTemplateId =
                        (parsed && typeof parsed.activeTemplateId === "string" && parsed.activeTemplateId.trim()) ||
                        DEFAULT_TEMPLATE_ID;
                    const fallbackTemplateId =
                        (parsed && typeof parsed.activeTemplateId === "string" && parsed.activeTemplateId.trim()) ||
                        DEFAULT_TEMPLATE_ID;
                    const templateStateMap =
                        parsed && typeof parsed.templateStates === "object" ? parsed.templateStates : {};
                    const pages = Array.isArray(parsed.pages)
                        ? parsed.pages.map((page, index) => {
                            const templateId =
                                typeof page?.templateId === "string" && page.templateId.trim()
                                    ? page.templateId.trim()
                                    : fallbackTemplateId;
                            const templateState = templateStateMap[templateId];
                            return normalizePage(page, index, fallbackTemplateId, templateState);
                        })
                        : [createPage(1)];
                    const activeIndex = Math.max(0, Math.min((parsed.activeIndex || 0), pages.length - 1));
                    const schemaTables = Array.isArray(parsed?.schema?.tables)
                        ? parsed.schema.tables
                            .map(table => {
                                if (!table || typeof table !== "object") return null;
                                const id = typeof table.id === "string" ? table.id.trim() : "";
                                if (!id) return null;
                                const title = typeof table.title === "string" && table.title.trim() ? table.title.trim() : id;
                                const primaryKey =
                                    typeof table.primaryKey === "string" && table.primaryKey.trim()
                                        ? table.primaryKey.trim()
                                        : DEFAULT_PRIMARY_KEY;
                                const columns = Array.isArray(table.columns) ? table.columns : [];
                                const relations = (Array.isArray(table.relations) ? table.relations : [])
                                    .map(normalizeRelation)
                                    .filter(Boolean);
                                return { id, title, primaryKey, columns, relations };
                            })
                            .filter(Boolean)
                        : [];
                    return {
                        pages,
                        activeIndex,
                        reasoningEffort: parsed.reasoningEffort || "low",
                        displayPreferences: Object.assign({}, DISPLAY_PREFERENCE_DEFAULTS, parsed.displayPreferences || {}),
                        activeTemplateId,
                        templatePromptOverrides:
                            parsed && typeof parsed.templatePromptOverrides === "object"
                                ? parsed.templatePromptOverrides
                                : {},
                        treeSourceOptions:
                            parsed && Array.isArray(parsed.treeSourceOptions)
                                ? parsed.treeSourceOptions
                                : TREE_SOURCE_OPTIONS.slice(),
                        treeTypeOptions:
                            parsed && Array.isArray(parsed.treeTypeOptions)
                                ? parsed.treeTypeOptions
                                : TREE_TYPE_OPTIONS.slice(),
                        statusOptions:
                            parsed && Array.isArray(parsed.statusOptions)
                                ? parsed.statusOptions
                                : STATUS_OPTIONS_DEFAULT.slice(),
                        schema: { tables: schemaTables },
                        scenarioGeneratedTables:
                            parsed && typeof parsed.scenarioGeneratedTables === "object"
                                ? parsed.scenarioGeneratedTables
                                : {}
                    };
                } catch (err) {
                    console.warn("Impossible de charger l'état Grid", err);
                    return {
                        pages: [],
                        activeIndex: 0,
                        reasoningEffort: "low",
                        displayPreferences: { ...DISPLAY_PREFERENCE_DEFAULTS },
                        activeTemplateId: DEFAULT_TEMPLATE_ID,
                        templatePromptOverrides: {},
                        treeSourceOptions: TREE_SOURCE_OPTIONS.slice(),
                        treeTypeOptions: TREE_TYPE_OPTIONS.slice(),
                        statusOptions: STATUS_OPTIONS_DEFAULT.slice(),
                        schema: { tables: [] },
                        scenarioGeneratedTables: {}
                    };
                }
            }

            function getTemplateConfigById(id) {
                if (!id) return GRID_TEMPLATES[0];
                return GRID_TEMPLATES.find(tpl => tpl.id === id) || GRID_TEMPLATES[0];
            }

            function getPageTemplateConfig() {
                return getTemplateConfigById(getPageTemplateId() || DEFAULT_TEMPLATE_ID);
            }

            function getTemplateIcon(templateId) {
                const tpl = getTemplateConfigById(templateId);
                if (tpl.id === "data-mapping") return "🧩";
                if (tpl.parser === "tree") return "🧬";
                return "🧪";
            }

            function getActiveTemplateConfig() {
                return getTemplateConfigById(state.activeTemplateId || DEFAULT_TEMPLATE_ID);
            }

            function getPagePromptDefaults(page = getActivePage()) {
                const templateId = getPageTemplateId(page) || state.activeTemplateId || DEFAULT_TEMPLATE_ID;
                const tplConfig = getTemplateConfigById(templateId);
                const override = state.templatePromptOverrides?.[templateId];
                return {
                    promptTemplate:
                        override?.promptTemplate || tplConfig?.defaultPromptTemplate || DEFAULT_PROMPT_TEMPLATE,
                    systemPrompt:
                        override?.systemPrompt || tplConfig?.defaultSystemPrompt || DEFAULT_SYSTEM_PROMPT
                };
            }

            function ensurePagePromptState(page = getActivePage()) {
                if (!page) return;
                const templateId = getPageTemplateId(page) || state.activeTemplateId || DEFAULT_TEMPLATE_ID;
                const override = state.templatePromptOverrides?.[templateId];
                const defaults = getPagePromptDefaults(page);
                if (override?.promptTemplate) {
                    page.promptTemplate = override.promptTemplate;
                } else if (!page.promptTemplate) {
                    page.promptTemplate = defaults.promptTemplate;
                }
                if (override?.systemPrompt) {
                    page.systemPrompt = override.systemPrompt;
                } else if (!page.systemPrompt) {
                    page.systemPrompt = defaults.systemPrompt;
                }
                if (typeof page.scenario !== "string") {
                    page.scenario = "";
                }
                if (typeof page.datasetScript !== "string") {
                    page.datasetScript = "";
                }
                if (typeof page.lastAiDatasetScript !== "string") {
                    page.lastAiDatasetScript = "";
                }
            }

            function getTreeSourceOptions() {
                if (Array.isArray(state?.treeSourceOptions) && state.treeSourceOptions.length) {
                    return state.treeSourceOptions;
                }
                return TREE_SOURCE_OPTIONS.slice();
            }

            function getTreeTypeOptions() {
                if (Array.isArray(state?.treeTypeOptions) && state.treeTypeOptions.length) {
                    return state.treeTypeOptions;
                }
                return TREE_TYPE_OPTIONS.slice();
            }

            function getStatusOptions() {
                if (Array.isArray(state?.statusOptions) && state.statusOptions.length) {
                    return state.statusOptions;
                }
                return STATUS_OPTIONS_DEFAULT.slice();
            }

            function expandTreeSystemPrompt(promptText) {
                if (typeof promptText !== "string") return promptText;
                const types = getTreeTypeOptions().join(" | ");
                const sources = getTreeSourceOptions().join(" | ");
                return promptText
                    .replace(/\{\{\s*tree_type_options\s*\}\}/g, types)
                    .replace(/\{\{\s*tree_source_options\s*\}\}/g, sources);
            }

            function normalizeOptionList(raw) {
                const list = Array.isArray(raw) ? raw : [];
                const cleaned = list
                    .map(item => (item == null ? "" : String(item)).trim())
                    .filter(Boolean);
                const unique = [];
                const seen = new Set();
                cleaned.forEach(value => {
                    const key = value.toLowerCase();
                    if (seen.has(key)) return;
                    seen.add(key);
                    unique.push(value);
                });
                return unique;
            }

            function openTreeSourceOptionsModal() {
                if (!treeSourceModal || !treeSourceListInput) return;
                const options = getTreeSourceOptions();
                treeSourceListInput.value = options.join("\n");
                treeSourceModal.classList.add("open");
            }

            function closeTreeSourceOptionsModal() {
                if (!treeSourceModal) return;
                treeSourceModal.classList.remove("open");
            }

            function openStatusOptionsModal() {
                if (!treeStatusModal || !treeStatusListInput) return;
                const options = getStatusOptions();
                treeStatusListInput.value = options.join("\n");
                treeStatusModal.classList.add("open");
            }

            function closeStatusOptionsModal() {
                if (!treeStatusModal) return;
                treeStatusModal.classList.remove("open");
            }

            function saveStatusOptions() {
                if (!treeStatusListInput) return;
                const raw = treeStatusListInput.value || "";
                const lines = raw.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
                const options = normalizeOptionList(lines.length ? lines : STATUS_OPTIONS_DEFAULT);
                if (!options.length) return;
                if (!state) state = {};
                state.statusOptions = options;
                persistState();
                if (gridApi && isDataMappingTemplateActive()) {
                    setGridColumnDefs(buildTreeColumnDefs());
                    gridApi.refreshHeader();
                }
                closeStatusOptionsModal();
            }

            function resetStatusOptions() {
                if (!state) state = {};
                state.statusOptions = STATUS_OPTIONS_DEFAULT.slice();
                persistState();
                if (treeStatusListInput) {
                    treeStatusListInput.value = state.statusOptions.join("\n");
                }
                if (gridApi && isDataMappingTemplateActive()) {
                    setGridColumnDefs(buildTreeColumnDefs());
                    gridApi.refreshHeader();
                }
            }

            function setGridColumnDefs(columnDefs) {
                if (!gridApi) return;
                if (typeof gridApi.setGridOption === "function") {
                    gridApi.setGridOption("columnDefs", columnDefs);
                    return;
                }
                if (typeof gridApi.setColumnDefs === "function") {
                    gridApi.setColumnDefs(columnDefs);
                }
            }

            function saveTreeSourceOptions() {
                if (!treeSourceListInput) return;
                const raw = treeSourceListInput.value || "";
                const lines = raw.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
                const options = normalizeOptionList(lines.length ? lines : TREE_SOURCE_OPTIONS);
                state.treeSourceOptions = options;
                persistState();
                if (gridApi && isTreeTemplateActive()) {
                    setGridColumnDefs(buildTreeColumnDefs());
                    gridApi.refreshHeader();
                }
                closeTreeSourceOptionsModal();
            }
            function resetTreeSourceOptions() {
                state.treeSourceOptions = TREE_SOURCE_OPTIONS.slice();
                persistState();
                if (treeSourceListInput) {
                    treeSourceListInput.value = state.treeSourceOptions.join("\n");
                }
                if (gridApi && isTreeTemplateActive()) {
                    setGridColumnDefs(buildTreeColumnDefs());
                    gridApi.refreshHeader();
                }
            }
            function openTreeTypeOptionsModal() {
                if (!treeTypeModal || !treeTypeListInput) return;
                const options = getTreeTypeOptions();
                treeTypeListInput.value = options.join("\n");
                treeTypeModal.classList.add("open");
            }

            function closeTreeTypeOptionsModal() {
                if (!treeTypeModal) return;
                treeTypeModal.classList.remove("open");
            }

            function saveTreeTypeOptions() {
                if (!treeTypeListInput) return;
                const raw = treeTypeListInput.value || "";
                const lines = raw.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
                const options = normalizeOptionList(lines.length ? lines : TREE_TYPE_OPTIONS);
                state.treeTypeOptions = options;
                persistState();
                if (gridApi && isTreeTemplateActive()) {
                    setGridColumnDefs(buildTreeColumnDefs());
                    gridApi.refreshHeader();
                }
                closeTreeTypeOptionsModal();
            }
            function resetTreeTypeOptions() {
                state.treeTypeOptions = TREE_TYPE_OPTIONS.slice();
                persistState();
                if (treeTypeListInput) {
                    treeTypeListInput.value = state.treeTypeOptions.join("\n");
                }
                if (gridApi && isTreeTemplateActive()) {
                    setGridColumnDefs(buildTreeColumnDefs());
                    gridApi.refreshHeader();
                }
            }

            function getPageTemplateId(page = getActivePage()) {
                if (!page || typeof page.templateId !== "string") return "";
                return page.templateId.trim();
            }

            function pageHasTemplate(page = getActivePage()) {
                return Boolean(getPageTemplateId(page));
            }

            function isTreeTemplateActive() {
                return getPageTemplateConfig()?.parser === "tree";
            }

            function isDataMappingTemplateActive(page = getActivePage()) {
                return getPageTemplateConfig(page)?.id === "data-mapping";
            }

            function renderTemplateMeta() {
                const tplId = getPageTemplateId() || state.activeTemplateId || DEFAULT_TEMPLATE_ID;
                const tpl = getTemplateConfigById(tplId);
                const icon = getTemplateIcon(tpl.id);
                if (templateMeta) {
                    templateMeta.textContent = `Modèle : ${icon} ${tpl.label}`;
                }
                if (aiTemplateLabel) {
                    aiTemplateLabel.textContent = `${icon} ${tpl.label}`;
                }
                if (promptModal?.classList.contains("open")) {
                    applyActivePageStateToUI();
                }
            }

            function renderTemplateCards(selectedId = (getPageTemplateId() || state.activeTemplateId || DEFAULT_TEMPLATE_ID)) {
                if (!templateCardList) return;
                templateCardList.innerHTML = "";
                GRID_TEMPLATES.forEach(tpl => {
                    const card = document.createElement("div");
                    card.className = "gt-template-card";
                    if (tpl.id === selectedId) {
                        card.classList.add("gt-template-card--selected");
                    }
                    card.tabIndex = 0;
                    card.dataset.id = tpl.id;
                    const icon = getTemplateIcon(tpl.id);
                    card.innerHTML = `<strong>${icon} ${tpl.label}</strong><p>${tpl.description}</p>`;
                    card.addEventListener("click", () => {
                        renderTemplateCards(tpl.id);
                        templateCardList.dataset.selectedId = tpl.id;
                    });
                    card.addEventListener("keypress", event => {
                        if (event.key === "Enter" || event.key === " ") {
                            event.preventDefault();
                            renderTemplateCards(tpl.id);
                            templateCardList.dataset.selectedId = tpl.id;
                        }
                    });
                    templateCardList.appendChild(card);
                });
                templateCardList.dataset.selectedId = selectedId;
            }

            function updateTemplateApplyBtnState() {
                if (!templateApplyBtn) return;
                const hasPage = Boolean(getActivePage());
                const isCreateMode = templateModalContext?.mode === "create";
                const locked = !isCreateMode && (!hasPage || pageHasTemplate());
                templateApplyBtn.disabled = locked;
                if (isCreateMode) {
                    templateApplyBtn.title = "Créer une nouvelle page avec ce modèle";
                } else if (locked) {
                    templateApplyBtn.title = hasPage
                        ? "Le modèle est déjà fixé pour cette page"
                        : "Aucune page active";
                } else {
                    templateApplyBtn.title = "Appliquer ce modèle à la page active";
                }
            }

            function setActiveTemplate(templateId, options = {}) {
                const {
                    skipApplyScript = true,
                    assignToPage = false,
                    skipPersist = false
                } = options;
                const tpl = getTemplateConfigById(templateId);
                const previousId = state.activeTemplateId || DEFAULT_TEMPLATE_ID;
                state.activeTemplateId = tpl.id;
                state.activeParser = tpl.parser || "flat";
                if (templateCardList) {
                    templateCardList.dataset.selectedId = tpl.id;
                }
                const page = getActivePage();
                const previousPageTemplateId = getPageTemplateId(page);
                const shouldBindToPage = assignToPage && page && !getPageTemplateId(page);
                if (page && (shouldBindToPage || getPageTemplateId(page) === tpl.id)) {
                    if (shouldBindToPage) {
                        page.templateId = tpl.id;
                    }
                    ensurePagePromptState(page);
                    const currentPageTemplateId = getPageTemplateId(page);
                    if (currentPageTemplateId && currentPageTemplateId !== previousPageTemplateId) {
                        const defaults = getPagePromptDefaults(page);
                        page.promptTemplate = defaults.promptTemplate;
                        page.systemPrompt = defaults.systemPrompt;
                    }
                }
                applyActivePageStateToUI();
                renderTemplateMeta();
                if (!skipApplyScript) {
                    try {
                        applyScriptToGrid({ silentOnError: true, silentOnSuccess: true });
                    } catch (err) {
                        console.warn("Impossible d'appliquer le script du modèle", err);
                    }
                }
                if (!skipPersist) {
                    persistState();
                }
                if (options.onChange && typeof options.onChange === "function" && tpl.id !== previousId) {
                    options.onChange(tpl);
                }
                updateTemplateApplyBtnState();
            }

            function openTemplateModalUi(options = {}) {
                if (!templateModal) return;
                const mode = options.mode || "assign";
                templateModalContext = { mode };
                const selectedId = getPageTemplateId() || state.activeTemplateId || DEFAULT_TEMPLATE_ID;
                renderTemplateCards(selectedId);
                updateTemplateApplyBtnState();
                templateModal.classList.add("open");
            }

            function closeTemplateModalUi() {
                if (!templateModal) return;
                templateModal.classList.remove("open");
                templateModalContext = null;
            }

            function syncActivePageFromUI() {
                const page = getActivePage();
                if (!page) return null;
                const defaults = getPagePromptDefaults(page);
                if (promptTemplateField) {
                    page.promptTemplate = promptTemplateField.value || page.promptTemplate || defaults.promptTemplate;
                }
                if (systemPromptField) {
                    page.systemPrompt = systemPromptField.value || page.systemPrompt || defaults.systemPrompt;
                }
                if (promptInput) {
                    page.scenario = promptInput.value || "";
                }
                if (gridScript) {
                    page.datasetScript = gridScript.value || "";
                }
                ensurePagePromptState(page);
                return page;
            }

            function applyActivePageStateToUI() {
                const page = getActivePage();
                const defaults = getPagePromptDefaults(page);
                if (promptTemplateField) {
                    promptTemplateField.value = defaults.promptTemplate;
                }
                if (systemPromptField) {
                    systemPromptField.value = defaults.systemPrompt;
                }
                if (promptInput) {
                    promptInput.value = page?.scenario || "";
                }
                updateGridClearButtonState();
                if (gridScript) {
                    gridScript.value = page?.datasetScript || "";
                }
                renderTemplateMeta();
            }

            state = loadState();
            state.scenarioGeneratedTables =
                state.scenarioGeneratedTables && typeof state.scenarioGeneratedTables === "object"
                    ? state.scenarioGeneratedTables
                    : {};
            state.templatePromptOverrides =
                state.templatePromptOverrides && typeof state.templatePromptOverrides === "object"
                    ? state.templatePromptOverrides
                    : {};
            state.treeSourceOptions =
                Array.isArray(state.treeSourceOptions)
                    ? normalizeOptionList(state.treeSourceOptions)
                    : TREE_SOURCE_OPTIONS.slice();
            state.treeTypeOptions =
                Array.isArray(state.treeTypeOptions)
                    ? normalizeOptionList(state.treeTypeOptions)
                    : TREE_TYPE_OPTIONS.slice();
            const activePageTemplateId = (state.pages?.[state.activeIndex] || {}).templateId;
            state.activeTemplateId = activePageTemplateId || state.activeTemplateId || DEFAULT_TEMPLATE_ID;
            state.activeParser = getPageTemplateConfig().parser || "flat";
            if (!state.schema || !Array.isArray(state.schema.tables) || state.schema.tables.length === 0) {
                state.schema = {
                    tables: state.pages.map(page => ({
                        id: page.tableId,
                        title: page.title,
                        primaryKey: page.primaryKey || DEFAULT_PRIMARY_KEY,
                        columns: [],
                        relations: Array.isArray(page.relations) ? page.relations : []
                    }))
                };
            }
            if (state.pages.length) {
                ensurePagePromptState(getActivePage());
                const activePage = getActivePage();
                if (activePage && !activePage.datasetScript.trim()) {
                    const dataset = buildDatasetFromState({ activeOnly: true });
                    activePage.datasetScript = hasDatasetContent(dataset) ? JSON.stringify(dataset, null, 2) : "";
                }
            }
            renderFontSizeOptions();
            applyGridDisplayPreferences({ persist: false });
            buildColumnPinMenu();
            renderTemplateCards();
            renderTemplateMeta();
            updateTemplateApplyBtnState();
            if (!state.pages.length) {
                setTimeout(() => {
                    openTemplateModalUi({ mode: "create" });
                    try {
                        localStorage.setItem(TEMPLATE_MODAL_SEEN_KEY, "1");
                    } catch (err) { /* ignore */ }
                }, 50);
            } else if (!hasSeenTemplateModal) {
                setTimeout(() => {
                    openTemplateModalUi({ mode: "assign" });
                    try {
                        localStorage.setItem(TEMPLATE_MODAL_SEEN_KEY, "1");
                    } catch (err) { /* ignore */ }
                }, 50);
            }

            function persistState() {
                try {
                    syncActivePageFromUI();
                    const payload = {
                        pages: state.pages.map((page, index) => normalizePage(page, index)),
                        activeIndex: Math.max(0, Math.min(state.activeIndex, state.pages.length - 1)),
                        reasoningEffort: state.reasoningEffort || "low",
                        displayPreferences: state.displayPreferences || { ...DISPLAY_PREFERENCE_DEFAULTS },
                        activeTemplateId: state.activeTemplateId || DEFAULT_TEMPLATE_ID,
                        templatePromptOverrides: state.templatePromptOverrides || {},
                        treeSourceOptions: Array.isArray(state.treeSourceOptions)
                            ? normalizeOptionList(state.treeSourceOptions)
                            : TREE_SOURCE_OPTIONS.slice(),
                        treeTypeOptions: Array.isArray(state.treeTypeOptions)
                            ? normalizeOptionList(state.treeTypeOptions)
                            : TREE_TYPE_OPTIONS.slice(),
                        statusOptions: Array.isArray(state.statusOptions)
                            ? normalizeOptionList(state.statusOptions)
                            : STATUS_OPTIONS_DEFAULT.slice(),
                        schema: state.schema || { tables: [] },
                        scenarioGeneratedTables: state.scenarioGeneratedTables || {}
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
                } catch (err) {
                    console.warn("Impossible de sauvegarder l'état Grid", err);
                }
            }

            function showStatus(message, isError) {
                const text = message ? message.toString().trim() : "";
                if (statusLabel) {
                    statusLabel.textContent = text;
                    statusLabel.style.color = isError ? "#b42318" : "#566188";
                }
                if (!text) {
                    statusToast?.classList.remove("visible");
                    return;
                }
                if (!statusToast) return;
                statusToast.textContent = text;
                statusToast.classList.add("visible");
                if (isError) {
                    statusToast.style.background = "#7f1d1d";
                } else {
                    statusToast.style.background = "rgba(16, 20, 40, 0.92)";
                }
                setTimeout(() => statusToast.classList.remove("visible"), 3200);
            }

            function getActivePage() {
                return state.pages[state.activeIndex];
            }

            function getActivePageScriptOr(fallback = "") {
                const page = getActivePage();
                if (page && typeof page.datasetScript === "string" && page.datasetScript.trim()) {
                    return page.datasetScript;
                }
                return fallback;
            }

            function renderTabs() {
                if (!pageTabs) return;
                pageTabs.innerHTML = "";
                state.pages.forEach((page, index) => {
                    const btn = document.createElement("button");
                    btn.className = `tab${index === state.activeIndex ? " active" : ""}`;
                    btn.type = "button";
                    const label = `Page ${index + 1}`;
                    btn.textContent = label;
                    btn.title = label;
                    btn.addEventListener("click", () => setActivePage(index));
                    pageTabs.appendChild(btn);
                });
            }

            function buildCsvFileName() {
                const page = getActivePage();
                const title = (gridTitleInput?.value || page?.title || "Grid").trim() || "Grid";
                const normalizedTitle = title
                    .replace(/\s+/g, "-")
                    .replace(/[^A-Za-z0-9-_]/g, "")
                    .replace(/-+/g, "-")
                    .replace(/^-|-$/g, "");
                const safeTitle = normalizedTitle || "Grid";
                const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
                return `${safeTitle}-${timestamp}.csv`;
            }

            function buildJsonFileName() {
                const page = getActivePage();
                const title = (gridTitleInput?.value || page?.title || "Grid").trim() || "Grid";
                const normalizedTitle = title
                    .replace(/\s+/g, "-")
                    .replace(/[^A-Za-z0-9-_]/g, "")
                    .replace(/-+/g, "-")
                    .replace(/^-|-$/g, "");
                const safeTitle = normalizedTitle || "Grid";
                const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
                return `${safeTitle}-${timestamp}.json`;
            }

            function getAllRelationsFromSchema() {
                const tables = Array.isArray(state?.schema?.tables) ? state.schema.tables : [];
                return tables
                    .flatMap(table => (Array.isArray(table?.relations) ? table.relations : []))
                    .map(normalizeRelation)
                    .filter(Boolean);
            }

            function getForeignKeyRelationForField(field, page = getActivePage()) {
                if (!field) return null;
                const tableId = page?.tableId || "";
                if (!tableId) return null;
                const relations = getAllRelationsFromSchema();
                for (const rel of relations) {
                    if (rel && rel.fromTable === tableId && rel.fromColumn === field) {
                        return rel;
                    }
                }
                return null;
            }

            const FOREIGN_KEY_DISPLAY_FIELD_PREFERENCES = [
                "name",
                "nom",
                "title",
                "titre",
                "label",
                "displayname",
                "fullname",
                "prenom",
                "firstname"
            ];

            function findFrequentStringField(rows, skipFields = new Set()) {
                if (!rows || !rows.length) return null;
                const freq = new Map();
                rows.forEach(row => {
                    if (!row || typeof row !== "object") return;
                    Object.keys(row).forEach(key => {
                        if (!key || skipFields.has(key) || key.startsWith("__")) return;
                        const value = row[key];
                        if (typeof value !== "string") return;
                        const normalized = value.trim();
                        if (!normalized) return;
                        freq.set(key, (freq.get(key) || 0) + 1);
                    });
                });
                if (!freq.size) return null;
                let bestKey = null;
                let bestCount = -1;
                for (const [key, count] of freq.entries()) {
                    if (count > bestCount) {
                        bestCount = count;
                        bestKey = key;
                    }
                }
                return bestKey;
            }

            function getForeignKeyDisplayField(tableId, keyColumn, label) {
                if (!tableId) return null;
                state._fkDisplayField = state._fkDisplayField && typeof state._fkDisplayField === "object"
                    ? state._fkDisplayField
                    : {};
                const cacheKey = `${tableId}:${keyColumn || ""}:${label || ""}`;
                if (state._fkDisplayField[cacheKey]) {
                    return state._fkDisplayField[cacheKey];
                }
                const pageIndex = findPageIndexByTableId(tableId);
                const page = pageIndex === -1 ? null : state.pages[pageIndex];
                const columnDefs = Array.isArray(page?.data?.columnDefs) ? page.data.columnDefs : [];
                const rows = Array.isArray(page?.data?.rowData) ? page.data.rowData : [];
                const skipFields = new Set([keyColumn, DEFAULT_PRIMARY_KEY]);
                const candidates = columnDefs
                    .filter(def => def && typeof def === "object")
                    .map(def => ({
                        field: typeof def.field === "string" ? def.field.trim() : "",
                        header: typeof def.headerName === "string" ? def.headerName.trim() : ""
                    }))
                    .filter(def => def.field && !def.field.startsWith("__relCount__") && !skipFields.has(def.field));
                const matchTargets = [];
                if (label) matchTargets.push(normalizeForCompare(label));
                FOREIGN_KEY_DISPLAY_FIELD_PREFERENCES.forEach(pref => {
                    matchTargets.push(normalizeForCompare(pref));
                });
                for (const target of matchTargets) {
                    if (!target) continue;
                    const candidate = candidates.find(def => {
                        const headerNorm = normalizeForCompare(def.header);
                        const fieldNorm = normalizeForCompare(def.field);
                        return (
                            fieldNorm === target ||
                            headerNorm === target ||
                            headerNorm.includes(target) ||
                            fieldNorm.includes(target)
                        );
                    });
                    if (candidate) {
                        state._fkDisplayField[cacheKey] = candidate.field;
                        return candidate.field;
                    }
                }
                if (candidates.length) {
                    state._fkDisplayField[cacheKey] = candidates[0].field;
                    return candidates[0].field;
                }
                const fallback = findFrequentStringField(rows, skipFields);
                state._fkDisplayField[cacheKey] = fallback || null;
                return fallback || null;
            }

            function findFirstStringValue(row, skipFields = new Set()) {
                if (!row || typeof row !== "object") return null;
