    <script>
        // Global Polyfill for missing browser APIs (prevents crashes in Excalidraw/Mermaid)
        (function () {
            var g = typeof globalThis !== 'undefined' ? globalThis : window;
            function ensure(name) {
                try {
                    if (typeof g[name] === 'undefined' || !g[name]) {
                        var F = function () { };
                        F.prototype = {};
                        g[name] = F;
                    }
                    if (g[name] && !g[name].prototype) g[name].prototype = {};
                } catch (e) { }
            }
            ensure('Element');
            ensure('Path2D');
            ensure('SVGPathSeg');
            // Array.at polyfill if missing
            if (typeof Array.prototype.at !== 'function') {
                Array.prototype.at = function (n) {
                    n = Math.trunc(n) || 0;
                    if (n < 0) n += this.length;
                    if (n < 0 || n >= this.length) return undefined;
                    return this[n];
                };
            }
        })();
    </script>

    <style>
        :root {
            --app-bg: #f3f4f6;
            --app-border: #cdd4ed;
            --app-border-strong: #cdd4ed;
            --app-text: #101428;
            --memo-card-bg: #ffffff;
        }

        html,
        body {
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--app-font, "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
            background: #f3f4f6;
            color: var(--app-text);
        }

        .memo-shell {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        #page {
            flex: 1 1 auto;
            min-width: 0;
        }

        .document-explorer {
            width: var(--doc-sidebar-width, 180px);
            flex: 0 0 var(--doc-sidebar-width, 180px);
            background: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px;
            color: var(--app-text);
            overflow: hidden;
        }

        .document-explorer.document-explorer--collapsed {
            width: 0;
            flex: 0 0 0;
            padding: 0;
            border-right: none;
            opacity: 0;
            pointer-events: none;
        }

        .document-explorer__header {
            display: flex;
            align-items: center;
            gap: 4px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--app-border, #dfe3f5);
        }

        .document-explorer__tab-btn {
            border: none;
            background: transparent;
            color: var(--app-text);
            padding: 4px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .document-explorer__tab-btn:hover {
            background-color: #f1f5f9;
            color: var(--app-text);
        }

        .document-explorer__tab-btn.active {
            color: var(--app-primary, #2a7a57);
            background-color: #eff6ff;
        }

        .document-explorer__body {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-top: 4px;
        }

        .document-explorer__tab-panel {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .document-explorer__tab-panel.active {
            display: flex;
        }

        .document-explorer__toc {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow-y: auto;
            padding: 2px;
        }

        .toc-item {
            font-size: 12px;
            padding: 2px 4px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-radius: 4px;
            color: #0f172a;
            transition: all 0.1s ease;
            line-height: 1.2;
        }

        .toc-item:hover {
            background-color: #f1f5f9;
            color: var(--app-text);
        }

        .toc-item--active {
            color: var(--app-primary, #2a7a57);
            font-weight: 600;
            background-color: #eff6ff;
        }

        .toc-item--h1 {
            font-weight: 600;
            padding-left: 6px;
        }

        .toc-item--h2 {
            padding-left: 10px;
            font-size: 13px;
        }

        .toc-item--h3 {
            padding-left: 18px;
            font-size: 13px;
            color: #94a3b8;
        }

        .toc-item--h4 {
            padding-left: 26px;
            font-size: 13px;
            color: #94a3b8;
            font-style: italic;
        }

        .document-explorer__list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            padding: 2px 2px 4px;
        }

        .document-explorer__item {
            border: 1px solid var(--app-border, #dfe3f5);
            background: #fff;
            color: var(--app-text);
            border-radius: 6px;
            padding: 4px 5px;
            font-size: 11px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .document-explorer__item--open {
            border: 2px solid var(--border-strong, var(--app-border-strong, #cdd4ed));
        }

        .document-explorer__item--active {
            border: 2px solid var(--primary, var(--app-primary, #2a7a57));
        }

        .document-explorer__item>span:first-child {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .document-explorer__item-actions {
            margin-left: auto;
            display: inline-flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .document-explorer__item:hover .document-explorer__item-actions,
        .document-explorer__item:focus-within .document-explorer__item-actions {
            opacity: 1;
        }

        .document-explorer__item-action {
            border: none;
            background: transparent;
            padding: 0 2px;
            font-size: 13px;
            line-height: 1;
            color: #111827;
            cursor: pointer;
        }

        .document-explorer__item-action:hover,
        .document-explorer__item-action:focus-visible {
            color: #0f172a;
            outline: none;
        }

        .document-explorer__item-action.document-explorer__delete {
            font-size: 12px;
        }

        .document-explorer .chat-knowledge-modal__add {
            width: auto;
            display: inline-flex;
            align-self: flex-end;
            padding: 2px 4px;
        }

        .document-explorer__actions {
            display: flex;
            gap: 4px;
        }

        .document-explorer__item:hover,
        .document-explorer__item:focus-visible {
            border-color: var(--app-primary);
            outline: none;
        }

        .document-explorer__empty {
            font-size: 12px;
            color: #6b7280;
            padding: 8px 10px;
        }

        .document-explorer-resizer {
            width: 6px;
            cursor: col-resize;
            background: transparent;
            position: relative;
            touch-action: none;
        }


        .document-explorer-resizer.is-hidden {
            display: none;
        }

        .app {
            width: 100%;
            max-width: none;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
            min-height: 100vh;
            height: 100vh;
            padding: 6px;
            overflow: hidden;
        }

        /* Lucide icons styling */
        [data-lucide] {
            width: 16px;
            height: 16px;
            vertical-align: middle;
            margin-right: 0px;
            stroke-width: 2px;
        }

        .menu-panel-btn [data-lucide] {
            margin-right: 10px;
        }

        .btn-secondary [data-lucide] {
            color: inherit;
        }

        .tabs-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .app-header {
            gap: 0;
        }

        .global-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            margin-left: auto;
        }

        #tabs {
            display: flex;
            flex: 1;
            min-width: 0;
            flex-direction: column;
            align-items: flex-start;
        }

        #document-tabs {
            flex: 1;
            min-width: 0;
            padding-right: 100px;
            width: 100%;
        }

        #memo-tabs {
            display: none;
        }

        .document-tab {
            background: transparent;
            border: 1px solid var(--app-border-strong);
            color: var(--app-primary-strong);
            padding: 4px 10px;
            border-radius: 8px;
            transition: background 0.2s ease, color 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: move;
        }

        .document-tab.active {
            background: var(--app-primary);
            border-color: var(--app-primary);
            color: #ffffff;
        }

        .document-tab:not(.active) span {
            max-width: 10ch;
            overflow: hidden;
            text-overflow: "…";
            white-space: nowrap;
        }

        .document-tab.is-dragging {
            opacity: 0.6;
            cursor: move;
        }

        .document-tab.document-tab--create {
            background: #ffffff;
            cursor: pointer;
        }

        .document-tab.document-tab--create:hover,
        .document-tab.document-tab--create:focus-visible {
            border-color: var(--app-primary);
            outline: none;
        }

        .document-tab__close {
            border: none;
            background: transparent;
            color: inherit;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
        }

        .document-tab__close:hover,
        .document-tab__close:focus-visible {
            color: var(--app-primary-strong);
            outline: none;
        }

        .app-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .memo-card {
            background: var(--memo-card-bg);
            border: 1px solid #ebe0d1;
            border-radius: 8px;
            box-shadow: var(--app-shadow);
            padding: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0;
            min-height: 0;
            overflow: visible;
        }

        .memo-empty-state {
            flex: 1;
            display: none;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 16px;
            text-align: center;
        }

        .editor-wrap {
            padding: 0px 10px 10px 10px;
            flex: 1;
            overflow-y: auto;
            background: #fff;
            scrollbar-width: thin;
        }

        .editor {
            border-radius: 8px;
            padding: 16px 16px 22px;
            min-height: 320px;
            outline: none;
            background: #fff;
        }

        .editor:focus-within {
            border-color: #cbd5e1;
            box-shadow: 0 0 0 4px rgba(203, 213, 225, .35);
        }

        /* Tiptap content */
        .ProseMirror {
            outline: none;
            font-size: 16px;
            line-height: 1.6;
        }

        .ProseMirror p {
            margin: 0 0 10px;
        }

        .ProseMirror h1 {
            font-size: 28px;
            line-height: 1.2;
            margin: 10px 0 12px;
        }

        .ProseMirror h2 {
            font-size: 22px;
            line-height: 1.25;
            margin: 10px 0 10px;
        }

        .ProseMirror ul {
            margin: 8px 0 10px 22px;
        }

        .ProseMirror ol {
            margin: 8px 0 10px 22px;
        }

        .ProseMirror li {
            margin: 0px 0;
        }

        .ProseMirror blockquote {
            margin: 10px 0;
            padding: 10px 12px;
            border-left: 3px solid #e5e7eb;
            color: #111827;
            background: #fafafa;
            border-radius: 8px;
        }

        .ProseMirror code {
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: .95em;
        }

        /* Bubble menu */
        .menu {
            display: flex;
            gap: 6px;
            padding: 8px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, .05);
            z-index: 10000;
        }

        .menu button {
            border: none;
            background: #fff;
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .menu button:hover {
            background: #eef2f7;
        }

        .menu button[data-active="true"] {
            border-color: #cbd5e1;
            background: #f8fafc;
            font-weight: 650;
        }

        /* Slash menu */
        .slash {
            position: fixed;
            z-index: 9999;
            width: 240px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 14px 30px rgba(15, 23, 42, .14);
            padding: 6px;
            display: none;
        }

        .slash .item {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .slash .item:hover {
            background: #eef2f7;
        }

        .slash .ico {
            width: 24px;
            height: 24px;
            display: grid;
            place-items: center;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 12px;
            color: #64748b;
            background: #fff;
            flex: 0 0 auto;
        }

        .slash .meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .slash .meta small {
            color: #64748b;
            font-size: 11px;
        }

        .modal textarea {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #d0c3ad;
            padding: 10px;
            font-family: "Menlo", "SFMono-Regular", "Consolas", "Liberation Mono", "Courier New", monospace;
            font-size: 13px;
            resize: vertical;
        }

        #memoPromptPresetSelect {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .memo-prompt-preset-btn {
            padding: 4px 8px;
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .memo-prompt-preset-btn.active {
            background-color: var(--accent-bg, rgba(0, 0, 0, 0.05));
            border-color: var(--accent-color, #000);
            font-weight: bold;
        }

        /* AI Request Counter Toaster */
        #aiRequestCounterToaster {
            position: fixed;
            bottom: 18px;
            right: 18px;
            background: rgba(15, 23, 42, 0.92);
            color: #fff;
            padding: 8px 16px;
            border-radius: 999px;
            box-shadow: 0 8px 26px rgba(0, 0, 0, 0.25);
            font-size: 12px;
            font-weight: 600;
            line-height: 1.4;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 240;
            font-family: "Menlo", "SFMono-Regular", "Consolas", "Liberation Mono", "Courier New", monospace;
            letter-spacing: 0.5px;
        }

        #aiRequestCounterToaster.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* Spinner animation for counter */
        @keyframes spinnerRotate {
            0% {
                content: "⠋";
            }

            10% {
                content: "⠙";
            }

            20% {
                content: "⠹";
            }

            30% {
                content: "⠸";
            }

            40% {
                content: "⠼";
            }

            50% {
                content: "⠴";
            }

            60% {
                content: "⠦";
            }

            70% {
                content: "⠧";
            }

            80% {
                content: "⠇";
            }

            90% {
                content: "⠏";
            }

            100% {
                content: "⠋";
            }
        }

        @media (max-width: 900px) {
            .app-header {
                gap: 6px;
            }

            .memo-card {
                padding: 4px;
            }
        }

        .lucide-spin {
            animation: lucide-spin 1s linear infinite;
        }

        @keyframes lucide-spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>

    <script type="module">
        (function () {
            const STORAGE_KEY = "goToolkit.memo.state";
            const OPEN_DOCS_STORAGE_KEY = "goToolkit.memo.openDocuments";
            const CONTEXT_EMBEDDINGS_MIGRATION_KEY = "goToolkit.memo.contextEmbeddings.migrated";
            const PROMPT_PRESET_STORAGE_KEY = "goToolkit.memo.promptPreset";
            const SHARE_QUERY_PARAM = "share";
            const FIRESTORE_COLLECTION = "memos";

            function saveLastPromptPreset(presetId) {
                try {
                    localStorage.setItem(PROMPT_PRESET_STORAGE_KEY, presetId);
                } catch (err) {
                    console.warn("Failed to save prompt preset", err);
                }
            }

            function getLastSavedPromptPreset() {
                try {
                    const saved = localStorage.getItem(PROMPT_PRESET_STORAGE_KEY);
                    const allowedPresets = ["edit", "suggest", "advice"];
                    if (saved && allowedPresets.includes(saved)) {
                        return saved;
                    }
                } catch (err) {
                    console.warn("Failed to load prompt preset", err);
                }
                return "advice";
            }

            function getMemoTemplates() {
                const templates = window.GoPrompts?.memoTemplates;
                if (Array.isArray(templates) && templates.length) return templates;
                return [
                    {
                        id: "default",
                        label: "🕊️ Guide rapide",
                        description: "Aperçu des fonctionnalités avancées de GoToolkit",
                        markdown: "# Guide rapide — GoToolkit\n\nBienvenue dans l'éditeur Mémo.\n"
                    }
                ];
            }

            const templates = getMemoTemplates();

            const tabsEl = document.getElementById("memo-tabs");
            const documentTabsEl = document.getElementById("document-tabs");
            const fileMenuBtn = document.getElementById("fileMenuBtn");
            const fileMenu = document.getElementById("fileMenu");
            const fileMenuTrigger = document.getElementById("fileMenuTrigger");
            const memoOpenImportBtn = document.getElementById("memoOpenImportBtn");
            const saveDocumentBtn = document.getElementById("saveDocumentBtn");
            const renameDocumentBtn = document.getElementById("renameDocumentBtn");
            const deleteDocumentBtn = document.getElementById("deleteDocumentBtn");
            const importJsonInput = document.getElementById("importJsonInput");
            const infoButton = document.getElementById("infoButton");
            const memoInfoPopup = document.getElementById("memoInfoPopup");
            const memoUpdateBtn = document.getElementById("memoUpdateBtn");
            const shareBtn = document.getElementById("shareBtn");
            const shareMenu = document.getElementById("shareMenu");
            const shareLinkField = document.getElementById("shareLinkField");
            const shareCreateBtn = document.getElementById("shareCreateBtn");
            const shareUpdateBtn = document.getElementById("shareUpdateBtn");
            const shareMenuStatus = document.getElementById("shareMenuStatus");
            const memoCardEl = document.querySelector(".memo-card");
            const memoEmptyStateEl = document.getElementById("memoEmptyState");
            const templateModal = document.getElementById("gtTemplateModal");
            const templateModalTrigger = document.getElementById("gtTemplateModalTrigger");
            const templateModalClose = document.getElementById("gtTemplateModalClose");
            const templateModalList = document.getElementById("gtTemplateModalList");
            const templateModalApply = document.getElementById("gtTemplateModalApply");
            const promptModal = document.getElementById("gtPromptModal");
            const promptModalTrigger = document.getElementById("gtPromptModalTrigger");
            const promptModalClose = document.getElementById("gtPromptModalClose");
            const promptPresetSelect = document.getElementById("memoPromptPresetSelect");
            const promptEditor = document.getElementById("memoPromptEditor");
            const resetPromptBtn = document.getElementById("resetPromptBtn");
            const applyPromptBtn = document.getElementById("applyPromptBtn");
            const memoEditorReady = window.GoToolkitMemoEditorReady || Promise.resolve(null);
            let memoEditorApi = null;
            let activeDocumentId = null;
            let openDocuments = [];

            const copyToast = document.getElementById("copyToast");
            const shareWorker = window.goToolkitShareWorker;
            const shareHistory = window.goToolkitShareHistory;
            const documentApi = window.goToolkitDocumentApi;

            let currentShareToken = null;
            let shareStatusMessage = "";
            let shareStatusType = "";
            let isDocumentSaving = false;
            let autoSaveTimer = null;
            let memoExplorer = null;

            function updateEmptyState() {
                const hasOpenDoc = openDocuments.length > 0 && Boolean(activeDocumentId);
                if (templateModalTrigger) {
                    templateModalTrigger.style.display = hasOpenDoc ? "" : "none";
                }
                if (fileMenuTrigger) {
                    fileMenuTrigger.style.display = hasOpenDoc ? "" : "none";
                }
                if (memoCardEl) {
                    memoCardEl.style.display = hasOpenDoc ? "" : "none";
                }
                if (memoEmptyStateEl) {
                    memoEmptyStateEl.style.display = hasOpenDoc ? "none" : "flex";
                }
                if (!hasOpenDoc) {
                    memoExplorer?.open?.();
                }
            }

            function createId() {
                if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
                    return crypto.randomUUID();
                }
                return "memo-" + Math.random().toString(16).slice(2);
            }

            function createDefaultState(useTemplate = false) {
                const id = createId();
                const lastPromptPreset = getLastSavedPromptPreset();
                const defaultMarkdown = (useTemplate && templates[0]) ? templates[0].markdown : "";
                const defaultHtml = (useTemplate && templates[0]) ? renderMemoTemplateMarkdown(defaultMarkdown) : "";
                const defaultTitle = (useTemplate && templates[0]) ? (templates[0].label.replace(/^[^\s]+\s+/, "") || "Doc 1") : "Doc 1";

                return {
                    tabs: [
                        {
                            id,
                            title: defaultTitle,
                            content: defaultHtml,
                            contextEmbeddings: []
                        }
                    ],
                    activeTabId: id,
                    templateId: (useTemplate && templates[0]) ? templates[0].id : null,
                    templateLabel: (useTemplate && templates[0]) ? templates[0].label : null,
                    promptPresetId: lastPromptPreset
                };
            }

            function normalizeState(raw) {
                if (!raw || typeof raw !== "object") return null;
                const tabs = Array.isArray(raw.tabs) ? raw.tabs.filter(Boolean) : [];
                if (!tabs.length) return null;
                const normalizedTabs = tabs.map((tab, index) => {
                    const id = typeof tab.id === "string" && tab.id ? tab.id : createId();
                    const title = typeof tab.title === "string" && tab.title.trim()
                        ? tab.title.trim()
                        : "Doc " + (index + 1);
                    const content = typeof tab.content === "string" ? tab.content : "";
                    const contextEmbeddings = Array.isArray(tab.contextEmbeddings)
                        ? tab.contextEmbeddings.filter(Boolean)
                        : [];
                    return { id, title, content, contextEmbeddings };
                });
                const activeId = normalizedTabs.some(tab => tab.id === raw.activeTabId)
                    ? raw.activeTabId
                    : normalizedTabs[0].id;
                const templateId = typeof raw.templateId === "string" ? raw.templateId : null;
                const templateLabel = typeof raw.templateLabel === "string" ? raw.templateLabel : null;
                const allowedPresets = ["edit", "suggest", "advice"];
                const promptPresetId = (typeof raw.promptPresetId === "string" && allowedPresets.includes(raw.promptPresetId))
                    ? raw.promptPresetId
                    : "edit";
                return { tabs: normalizedTabs, activeTabId: activeId, templateId, templateLabel, promptPresetId };
            }

            function getDocumentTitleFromState(docState) {
                if (!docState || !Array.isArray(docState.tabs)) return "Mémo";
                const tab = docState.tabs[0];
                return (tab && tab.title) || "Mémo";
            }

            function upsertOpenDocument(doc) {
                if (!doc || !doc.id) return;
                const existingIndex = openDocuments.findIndex(item => item.id === doc.id);
                if (existingIndex >= 0) {
                    openDocuments[existingIndex] = {
                        ...openDocuments[existingIndex],
                        ...doc
                    };
                    return;
                }
                openDocuments.push(doc);
            }

            function renderDocumentTabs() {
                if (!documentTabsEl) return;
                documentTabsEl.innerHTML = "";
                openDocuments.forEach(doc => {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "tab document-tab" + (doc.id === activeDocumentId ? " active" : "");
                    btn.dataset.documentId = doc.id;
                    btn.draggable = true;

                    const label = document.createElement("span");
                    label.textContent = doc.title || "Mémo";
                    btn.appendChild(label);

                    const close = document.createElement("span");
                    close.className = "document-tab__close";
                    close.innerHTML = '<i data-lucide="x"></i>';
                    close.setAttribute("role", "button");
                    close.setAttribute("aria-label", "Fermer le document");
                    close.tabIndex = 0;
                    const handleTabClose = async (event) => {
                        event.stopPropagation();
                        await saveDocument({ showToast: false });
                        closeDocumentTab(doc.id);
                    };
                    close.addEventListener("click", handleTabClose);
                    close.addEventListener("keydown", event => {
                        if (event.key !== "Enter" && event.key !== " ") return;
                        event.preventDefault();
                        handleTabClose(event);
                    });
                    btn.appendChild(close);

                    btn.addEventListener("click", () => {
                        setActiveDocument(doc.id);
                    });
                    btn.addEventListener("dblclick", () => {
                        renameDocument(doc.id, doc.title || "");
                    });
                    documentTabsEl.appendChild(btn);
                });
                const createBtn = document.createElement("button");
                createBtn.type = "button";
                createBtn.className = "tab document-tab document-tab--create";
                createBtn.innerHTML = '<i data-lucide="plus"></i>';
                createBtn.title = "Nouveau document";
                createBtn.setAttribute("aria-label", "Créer un document");
                createBtn.draggable = false;
                createBtn.addEventListener("click", () => {
                    createAutoDocument();
                });
                documentTabsEl.appendChild(createBtn);
                persistOpenDocumentState();
                updateEmptyState();
                memoExplorer?.refreshIndicators?.();
                if (window.lucide) window.lucide.createIcons();
            }

            function ensureActiveDocument() {
                if (activeDocumentId) return;
                const payload = buildSharePayload();
                const fallbackId = activeDocumentId || createId();
                activeDocumentId = fallbackId;
                upsertOpenDocument({
                    id: fallbackId,
                    title: getDocumentTitleFromState(state),
                    payload
                });
                renderDocumentTabs();
            }

            function syncActiveDocumentPayload() {
                if (!activeDocumentId) return;
                const payload = buildSharePayload();
                upsertOpenDocument({
                    id: activeDocumentId,
                    title: getDocumentTitleFromState(state),
                    payload,
                    updatedAt: new Date().toISOString()
                });
                renderDocumentTabs();
            }

            function setActiveDocument(docId) {
                if (!docId || docId === activeDocumentId) return;
                const target = openDocuments.find(item => item.id === docId);
                if (!target) return;
                syncActiveDocumentPayload();
                const loaded = normalizeState(target.payload);
                if (!loaded) return;
                state = loaded;
                activeDocumentId = target.id;
                renderTabs();
                setActiveTab(state.activeTabId);
                syncAssistPresetFromState();
                renderDocumentTabs();
            }

            function closeDocumentTab(docId) {
                const index = openDocuments.findIndex(item => item.id === docId);
                if (index < 0) return;
                const wasActive = openDocuments[index].id === activeDocumentId;
                openDocuments.splice(index, 1);
                if (wasActive) {
                    const next = openDocuments[0];
                    if (next) {
                        activeDocumentId = null;
                        setActiveDocument(next.id);
                    } else {
                        state = createDefaultState();
                        activeDocumentId = null;
                        renderTabs();
                        setActiveTab(state.activeTabId);
                        renderDocumentTabs();
                    }
                } else {
                    renderDocumentTabs();
                }
            }

            function loadState() {
                if (typeof localStorage === "undefined") return null;
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return null;
                    return normalizeState(JSON.parse(raw));
                } catch (err) {
                    console.warn("Memo load state failed", err);
                    return null;
                }
            }

            function loadOpenDocumentState() {
                if (typeof localStorage === "undefined") return null;
                try {
                    const raw = localStorage.getItem(OPEN_DOCS_STORAGE_KEY);
                    if (!raw) return null;
                    const parsed = JSON.parse(raw);
                    if (!parsed || typeof parsed !== "object") return null;
                    const openDocumentIds = Array.isArray(parsed.openDocumentIds)
                        ? parsed.openDocumentIds.filter(Boolean)
                        : [];
                    const activeId = typeof parsed.activeDocumentId === "string" ? parsed.activeDocumentId : null;
                    return {
                        openDocumentIds,
                        activeDocumentId: activeId
                    };
                } catch (err) {
                    console.warn("Memo load open documents failed", err);
                    return null;
                }
            }

            function persistOpenDocumentState() {
                if (typeof localStorage === "undefined") return;
                try {
                    const payload = {
                        openDocumentIds: openDocuments.map(doc => doc.id),
                        activeDocumentId: activeDocumentId
                    };
                    localStorage.setItem(OPEN_DOCS_STORAGE_KEY, JSON.stringify(payload));
                } catch (err) {
                    console.warn("Memo save open documents failed", err);
                }
            }

            function isDevEnvironment() {
                const host = (window.location.hostname || "").toLowerCase();
                return host === "localhost" || host === "127.0.0.1" || host.endsWith(".local");
            }

            function resetDevState() {
                if (!isDevEnvironment()) return;
                try {
                    localStorage.removeItem(STORAGE_KEY);
                    localStorage.removeItem(CONTEXT_EMBEDDINGS_MIGRATION_KEY);
                } catch (err) {
                    console.warn("Failed to reset memo localStorage", err);
                }
            }

            function persistState() {
                if (typeof localStorage === "undefined") return;
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                } catch (err) {
                    console.warn("Memo save state failed", err);
                }
                syncActiveDocumentPayload();
                persistOpenDocumentState();
                // Sync global state reference for assist.js
                window.__memoState = state;
                // Notify assist.js to update tab indicator
                if (window.GoToolkitAssistInstance?.updateTabIndicator) {
                    window.GoToolkitAssistInstance.updateTabIndicator();
                }
            }

            function debounce(fn, wait) {
                let timer = null;
                return function (...args) {
                    if (timer) {
                        clearTimeout(timer);
                    }
                    timer = setTimeout(() => {
                        fn.apply(this, args);
                    }, wait);
                };
            }

            async function hydrateMemoContextEmbeddings() {
                const manager = window.GoToolkitDocumentManager;
                if (!manager || typeof manager.getMemoEmbeddings !== "function") return;
                try {
                    await manager.waitReady?.();
                    let changed = false;
                    for (const tab of state.tabs) {
                        if (!tab || !tab.id) continue;
                        const entries = await manager.getMemoEmbeddings(tab.id);
                        if (Array.isArray(entries) && entries.length) {
                            tab.contextEmbeddings = entries;
                            changed = true;
                        }
                    }
                    if (changed) {
                        persistState();
                    }
                } catch (err) {
                    console.warn("Failed to hydrate memo context embeddings", err);
                }
            }

            async function migrateLegacyContextEmbeddings() {
                if (typeof localStorage === "undefined") return;
                if (localStorage.getItem(CONTEXT_EMBEDDINGS_MIGRATION_KEY)) return;
                const manager = window.GoToolkitDocumentManager;
                if (!manager || typeof manager.getDocuments !== "function") return;
                try {
                    await manager.waitReady?.();
                    const docs = await manager.getDocuments("chat:memo");
                    const legacyDocs = (docs || []).filter(doc => doc && !doc.memoId && (doc.sourceType || "context") === "context");
                    if (!legacyDocs.length) {
                        localStorage.setItem(CONTEXT_EMBEDDINGS_MIGRATION_KEY, "1");
                        return;
                    }
                    const targetMemoId = state.activeTabId;
                    for (const doc of legacyDocs) {
                        doc.memoId = targetMemoId;
                        doc.tabId = targetMemoId;
                        await manager.putDocument(doc);
                        await manager.upsertMemoEmbedding({
                            id: `${targetMemoId}:${doc.id}`,
                            memoId: targetMemoId,
                            tabId: targetMemoId,
                            docId: doc.id,
                            fileHash: doc.fileHash || "",
                            fileName: doc.name || doc.sourceFileName || "Document",
                            size: doc.size || 0,
                            importedAt: doc.uploadedAt || Date.now(),
                            chunkCount: doc.chunkCount || 0
                        });
                    }
                    localStorage.setItem(CONTEXT_EMBEDDINGS_MIGRATION_KEY, "1");
                    await hydrateMemoContextEmbeddings();
                } catch (err) {
                    console.warn("Legacy memo embedding migration failed", err);
                }
            }

            async function syncContextEmbeddings(memoId) {
                const manager = window.GoToolkitDocumentManager;
                if (!manager || typeof manager.getMemoEmbeddings !== "function") return;
                const targetId = memoId || state.activeTabId;
                if (!targetId) return;
                try {
                    await manager.waitReady?.();
                    const entries = await manager.getMemoEmbeddings(targetId);
                    const tab = state.tabs.find(tab => tab.id === targetId);
                    if (!tab) return;
                    tab.contextEmbeddings = Array.isArray(entries) ? entries : [];
                    persistState();
                } catch (err) {
                    console.warn("Failed to sync memo context embeddings", err);
                }
            }

            window.GoToolkitMemoSyncContextEmbeddings = syncContextEmbeddings;

            function getMemoById(memoId) {
                if (!memoId) return null;
                return state.tabs.find(tab => tab.id === memoId) || null;
            }

            function getVoiceRecordingId(memoId) {
                const memo = getMemoById(memoId);
                return memo?.voiceRecordingId || null;
            }

            function setVoiceRecordingId(memoId, recordingId) {
                const memo = getMemoById(memoId);
                if (!memo) return false;
                memo.voiceRecordingId = recordingId || null;
                persistState();
                return true;
            }

            window.GoToolkitMemoVoice = {
                getActiveMemo: () => getActiveTab(),
                getMemoById,
                getVoiceRecordingId,
                setVoiceRecordingId
            };

            function setStatus(message, isError) {
                if (!copyToast) return;
                copyToast.textContent = message;
                copyToast.classList.toggle("visible", Boolean(message));
                if (message) {
                    clearTimeout(copyToast._timer);
                    copyToast._timer = setTimeout(() => {
                        copyToast.classList.remove("visible");
                    }, 2400);
                }
            }

            window.GoToolkitMemoToast = setStatus;

            function setDbStatus(message) {
                const toast = document.getElementById("dbStatusToast");
                if (!toast) return;
                if (!message) {
                    toast.style.display = "none";
                    toast.textContent = "";
                    return;
                }
                toast.textContent = message;
                toast.style.display = "block";
                toast.classList.add("visible");
            }

            function closeMenus(except) {
                if (fileMenu && fileMenu !== except) fileMenu.classList.remove("open");
                if (shareMenu && shareMenu !== except) shareMenu.classList.remove("open");
            }

            function renderTabs() {
                if (!tabsEl) return;
                tabsEl.innerHTML = "";
                state.tabs.forEach(tab => {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "tab" + (tab.id === state.activeTabId ? " active" : "");
                    btn.textContent = tab.title;
                    btn.addEventListener("click", () => {
                        setActiveTab(tab.id);
                    });
                    tabsEl.appendChild(btn);
                });
            }

            function getActiveTab() {
                return state.tabs.find(tab => tab.id === state.activeTabId) || state.tabs[0];
            }

            function setActiveTab(tabId) {
                const target = state.tabs.find(tab => tab.id === tabId);
                if (!target) return;
                state.activeTabId = target.id;
                if (memoEditorApi) {
                    memoEditorApi.setValue(target.content || "");
                }
                renderTabs();
                persistState();
                if (window.GoToolkitVoice?.setCurrentMemo) {
                    window.GoToolkitVoice.setCurrentMemo(target.title || "", target.id);
                }
                window.GoToolkitAssistInstance?.refreshMemoContextAttachments?.();
                window.GoToolkitMemoSyncContextEmbeddings?.(target.id);
            }

            function updateActiveTabContent(value) {
                const tab = getActiveTab();
                if (!tab) return;
                tab.content = typeof value === "string" ? value : "";
                persistState();
            }

            function appendToActiveTab(nextContent) {
                if (!memoEditorApi || typeof memoEditorApi.getValue !== "function") return;
                const current = memoEditorApi.getValue() || "";
                const combined = current ? `${current}\n\n${nextContent}` : nextContent;
                memoEditorApi.setValue(combined);
                updateActiveTabContent(combined);
            }

            window.GoToolkitMemoAppendText = appendToActiveTab;

            function addTab() {
                const id = createId();
                const title = "Page " + (state.tabs.length + 1);
                state.tabs.push({ id, title, content: "", contextEmbeddings: [] });
                setActiveTab(id);
                // Open assist modal by default
                window.GoToolkitAssistInstance?.open?.();
            }

            async function deleteTab() {
                if (state.tabs.length <= 1) {
                    const tab = getActiveTab();
                    if (tab) {
                        tab.content = "";
                        memoEditorApi?.setValue("");
                        persistState();
                    }
                    return;
                }
                const index = state.tabs.findIndex(tab => tab.id === state.activeTabId);
                if (index < 0) return;
                const removed = state.tabs[index];
                if (removed?.id && window.GoToolkitDocumentManager?.deleteMemoEmbeddings) {
                    try {
                        await window.GoToolkitDocumentManager.deleteMemoEmbeddings(removed.id);
                    } catch (err) {
                        console.warn("Failed to delete memo embeddings", err);
                    }
                }
                state.tabs.splice(index, 1);
                const next = state.tabs[Math.max(0, index - 1)];
                state.activeTabId = next.id;
                setActiveTab(next.id);
            }

            function buildSharePayload() {
                return {
                    tabs: state.tabs,
                    activeTabId: state.activeTabId,
                    templateId: state.templateId || null,
                    templateLabel: state.templateLabel || null,
                    promptPresetId: state.promptPresetId || "edit"
                };
            }

            function buildSharePreview() {
                const tab = getActiveTab();
                const title = tab?.title || "Doc";
                const description = (tab?.content || "").trim().slice(0, 140);
                return {
                    title: title,
                    description: description || "Document"
                };
            }

            function getShareTokenFromUrl() {
                try {
                    const params = new URLSearchParams(window.location.search);
                    const value = params.get(SHARE_QUERY_PARAM);
                    return value ? value.trim() : null;
                } catch (err) {
                    return null;
                }
            }

            function updateUrlWithShareToken(token) {
                const url = new URL(window.location.href);
                if (token) {
                    url.searchParams.set(SHARE_QUERY_PARAM, token);
                } else {
                    url.searchParams.delete(SHARE_QUERY_PARAM);
                }
                history.replaceState(null, "", url.toString());
            }

            function createShareToken() {
                if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
                    return crypto.randomUUID();
                }
                const bytes = new Uint8Array(16);
                if (typeof crypto !== "undefined" && typeof crypto.getRandomValues === "function") {
                    crypto.getRandomValues(bytes);
                } else {
                    for (let i = 0; i < bytes.length; i++) {
                        bytes[i] = Math.floor(Math.random() * 256);
                    }
                }
                return Array.from(bytes)
                    .map(byte => byte.toString(16).padStart(2, "0"))
                    .join("");
            }

            async function saveShare(token) {
                if (!shareWorker || !shareWorker.isReady) {
                    throw new Error("Service de partage indisponible");
                }
                const payload = buildSharePayload();
                const meta = await shareWorker.saveSharePayload(FIRESTORE_COLLECTION, token, payload);
                currentShareToken = token;
                updateUrlWithShareToken(token);
                if (shareHistory && typeof shareHistory.upsertRecord === "function") {
                    const preview = buildSharePreview();
                    await shareHistory.upsertRecord("memo", {
                        token,
                        title: preview.title,
                        description: preview.description,
                        updatedAt: meta?.updatedAt
                    });
                }
                return meta;
            }

            function buildShareUrl(token) {
                if (!token) return "";
                const url = new URL(window.location.href);
                url.searchParams.set(SHARE_QUERY_PARAM, token);
                return url.toString();
            }

            function updateShareMenuStatus(message, type) {
                shareStatusMessage = message || "";
                shareStatusType = type || "";
                if (!shareMenuStatus) return;
                shareMenuStatus.textContent = shareStatusMessage;
                shareMenuStatus.classList.toggle("error", shareStatusType === "error");
            }

            function syncShareLink() {
                if (!shareLinkField) return;
                if (currentShareToken) {
                    shareLinkField.value = buildShareUrl(currentShareToken);
                } else {
                    shareLinkField.value = "";
                }
            }

            async function handleShareCreate() {
                try {
                    updateShareMenuStatus("Création du lien...", "");
                    const token = currentShareToken || createShareToken();
                    await saveShare(token);
                    syncShareLink();
                    updateShareMenuStatus("Lien prêt.", "");
                    setStatus("Lien de partage mis à jour");
                } catch (err) {
                    console.error("Share create failed", err);
                    updateShareMenuStatus("Impossible de créer le lien.", "error");
                }
            }

            async function handleShareUpdate() {
                if (!currentShareToken) {
                    return handleShareCreate();
                }
                try {
                    updateShareMenuStatus("Actualisation...", "");
                    await saveShare(currentShareToken);
                    syncShareLink();
                    updateShareMenuStatus("Lien actualisé.", "");
                    setStatus("Lien actualisé");
                } catch (err) {
                    console.error("Share update failed", err);
                    updateShareMenuStatus("Impossible d'actualiser.", "error");
                }
            }

            async function loadShareFromUrl() {
                const token = getShareTokenFromUrl();
                if (!token || !shareWorker || !shareWorker.isReady) return false;
                try {
                    const result = await shareWorker.fetchSharePayload(FIRESTORE_COLLECTION, token);
                    if (!result || !result.payload) return false;
                    const loaded = normalizeState(result.payload);
                    if (loaded) {
                        state = loaded;
                        currentShareToken = token;
                        renderTabs();
                        setActiveTab(state.activeTabId);
                        activeDocumentId = token;
                        upsertOpenDocument({
                            id: token,
                            title: getDocumentTitleFromState(state),
                            payload: buildSharePayload(),
                            updatedAt: new Date().toISOString()
                        });
                        renderDocumentTabs();
                        syncAssistPresetFromState();
                        syncShareLink();
                        updateShareMenuStatus("Lien chargé.", "");
                        return true;
                    }
                } catch (err) {
                    console.error("Share load failed", err);
                }
                return false;
            }

            async function openDocumentFromRecord(record) {
                if (!record || !record.payload) return;
                const loaded = normalizeState(
                    record.payload.tabs
                        ? record.payload
                        : { tabs: [{ id: createId(), title: "Doc 1", content: record.payload }] }
                );
                if (!loaded) return;
                syncActiveDocumentPayload();
                state = loaded;
                activeDocumentId = record.id;
                renderTabs();
                setActiveTab(state.activeTabId);
                syncAssistPresetFromState();
                upsertOpenDocument({
                    id: record.id,
                    title: record.title || getDocumentTitleFromState(state),
                    payload: buildSharePayload(),
                    updatedAt: record.updatedAt || new Date().toISOString()

            async function applyDocumentRename(docId, nextName) {
                if (!docId || !nextName) return;
                const doc = openDocuments.find(item => item.id === docId);
                if (doc && doc.payload && Array.isArray(doc.payload.tabs) && doc.payload.tabs[0]) {
                    doc.payload.tabs[0].title = nextName;
                }
                if (docId === activeDocumentId && state.tabs[0]) {
                    state.tabs[0].title = nextName;
                    persistState();
                }
                if (documentApi) {
                    const payload = docId === activeDocumentId ? buildSharePayload() : doc?.payload;
                    await documentApi.upsertRecord({
                        id: docId,
                        app: "memo",
                        payload,
                        title: nextName,
                        description: doc?.description || "",
                        updatedAt: new Date().toISOString()
                    });
                }
                upsertOpenDocument({
                    id: docId,
                    title: nextName,
                    payload: doc?.payload || buildSharePayload(),
                    updatedAt: new Date().toISOString()

                renderDocumentTabs();
                getExplorer()?.refresh?.();

            async function renameDocument(docId, currentTitle) {
                const explorer = getExplorer();
                const desired = await explorer?.openRenameModal?.(currentTitle || "");
                if (!desired) return;
                const finalName = explorer?.uniqueName?.(desired) || desired;
                await applyDocumentRename(docId, finalName);

                await renameDocument(activeDocumentId, getDocumentTitleFromState(state));

            async function deleteDocument(docId) {
                if (!docId) return;
                if (documentApi) {
                    const allDocs = await documentApi.getAllRecords();
                    const memoDocs = (allDocs || []).filter(item => item && item.app === "memo");
                    if (memoDocs.length <= 1) {
                        setStatus("Impossible de supprimer le dernier document", true);
                        return;
                    }
                } else if (openDocuments.length <= 1) {
                    setStatus("Impossible de supprimer le dernier document", true);
                    return;
                }
                const target = openDocuments.find(item => item.id === docId);
                const name = target?.title || "ce document";
                const confirmed = window.confirm(`Supprimer "${name}" ?`);
                if (!confirmed) return;
                const manager = window.GoToolkitDocumentManager;
                const tabsToDelete = Array.isArray(target?.payload?.tabs) ? target.payload.tabs : [];
                if (manager?.deleteMemoEmbeddings) {
                    for (const tab of tabsToDelete) {
                        if (!tab?.id) continue;
                        try {
                            await manager.deleteMemoEmbeddings(tab.id);
                        } catch (err) {
                            console.warn("Failed to delete memo embeddings for document", err);
                        }
                    }
                }
                if (documentApi) {
                    await documentApi.removeRecord(docId);
                }
                closeDocumentTab(docId);
                getExplorer()?.refresh?.();
            }

            async function deleteActiveDocument() {
                if (!activeDocumentId) return;
                await deleteDocument(activeDocumentId);

            let isCreatingNewDocument = false;

            async function createNewDocument(name) {
                if (isCreatingNewDocument) return;
                isCreatingNewDocument = true;
                try {
                    syncActiveDocumentPayload();
                    const nextState = createDefaultState();
                    if (nextState.tabs[0]) {
                        nextState.tabs[0].title = name;
                    }
                    state = nextState;
                    activeDocumentId = (documentApi?.generateId && documentApi.generateId()) || createId();
                    renderTabs();
                    setActiveTab(state.activeTabId);
                    syncAssistPresetFromState();
                    await saveDocument({ showToast: true, created: true });
                    getExplorer()?.refresh?.();
                    window.GoToolkitAssistInstance?.open?.();
                } finally {
                    isCreatingNewDocument = false;
                }
            }

            async function getAutoDocumentName() {
                const explorer = getExplorer();
                const records = await window.goToolkitDocumentApi?.getAllRecords?.();
                const names = new Set();
                (records || []).forEach(item => {
                    if (!item || item.app !== "memo") return;
                    if (typeof item.title === "string" && item.title.trim()) {
                        names.add(item.title.trim());
                        return;
                    }
                    const firstTab = item.payload?.tabs?.[0];
                    const tabTitle = typeof firstTab?.title === "string" ? firstTab.title.trim() : "";
                    if (tabTitle) {
                        names.add(tabTitle);
                    }
                });
                openDocuments.forEach(doc => {
                    const title = typeof doc?.title === "string" ? doc.title.trim() : "";
                    if (title) {
                        names.add(title);
                    }
                });
                let maxIndex = 0;
                names.forEach(name => {
                    const match = name.match(/^Doc\s+(\d+)$/i);
                    if (match) {
                        const num = Number(match[1]);
                        if (Number.isFinite(num)) {
                            maxIndex = Math.max(maxIndex, num);
                        }
                    }
                });
                let candidateIndex = maxIndex + 1;
                let candidateName = `Doc ${candidateIndex}`;
                while (names.has(candidateName)) {
                    candidateIndex += 1;
                    candidateName = `Doc ${candidateIndex}`;
                }
                return explorer?.uniqueName?.(candidateName) || candidateName;
            }

            async function saveDocument(options) {
                if (!documentApi || isDocumentSaving || !activeDocumentId) return null;
                isDocumentSaving = true;
                try {
                    const payload = buildSharePayload();
                    const preview = buildSharePreview();
                    // IMPORTANT: Preserve existing activeDocumentId if it exists
                    const startedWithId = activeDocumentId;
                    const id = startedWithId || (documentApi.generateId && documentApi.generateId()) || createId();
                    const now = new Date().toISOString();
                    const record = await documentApi.upsertRecord({
                        id,
                        app: "memo",
                        payload,
                        title: preview.title,
                        description: preview.description,
                        updatedAt: now
                    });
                    if (record) {
                        // Avoid overriding a newer active document selected mid-save.
                        if (!activeDocumentId || activeDocumentId === startedWithId) {

                        upsertOpenDocument({
                            id,
                            title: preview.title || getDocumentTitleFromState(state),

                        });

                        if (options && options.showToast) {

                            setStatus(message);

                } catch (err) {

                    return null;
                } finally {
                    isDocumentSaving = false;
                }
            }

            function closeInfoPopup() {

            function escapeHtml(value) {
                return String(value || "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            function formatInlineMarkdown(text) {
                let out = escapeHtml(text);
                // After escapeHtml, special chars like > are &gt;
                // We should NOT call escapeHtml again inside the replacements
                out = out.replace(/`([^`]+)`/g, (_, code) => `<code>${code}</code>`);
                out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
                out = out.replace(/__([^_]+)__/g, "<strong>$1</strong>");
                out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
                out = out.replace(/_([^_]+)_/g, "<em>$1</em>");
                out = out.replace(/~~([^~]+)~~/g, "<s>$1</s>");
                out = out.replace(/~([^~]+)~/g, "<s>$1</s>"); // Handle single ~ as well
                out = out.replace(/==([^=]+)==/g, "<mark>$1</mark>");
                out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) => {
                    const safeLabel = label; // already escaped via escapeHtml(text)
                    const safeUrl = String(url || "").trim()
                        .replace(/&amp;/g, "&") // unescape common entities in URL if they were double escaped
                        .replace(/&/g, "&amp;")
                        .replace(/"/g, "&quot;");
                    if (!/^https?:\/\//i.test(safeUrl)) return safeLabel;
                    return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${safeLabel}</a>`;
                });
                return out;
            }

            function renderMemoTemplateMarkdown(markdown) {
                const raw = String(markdown || "");
                if (!raw.trim()) return "";

                const lines = raw.replace(/\r\n/g, "\n").split("\n");
                const html = [];

                let inCodeBlock = false;
                let codeBlockDelim = "";
                let codeLanguage = "";
                let codeLines = [];

                let listItems = [];
                let taskItems = [];
                let quoteLines = [];

                function flushList() {
                    if (!listItems.length) return;
                    html.push(`<ul>${listItems.map(item => `<li>${formatInlineMarkdown(item)}</li>`).join("")}</ul>`);
                    listItems = [];
                }

                function flushTasks() {
                    if (!taskItems.length) return;
                    html.push(
                        `<ul data-type="taskList">${taskItems.map(item =>
                            `<li data-type="taskItem" data-checked="${item.checked ? "true" : "false"}">${formatInlineMarkdown(item.text)}</li>`
                        ).join("")}</ul>`
                    );
                    taskItems = [];
                }

                function flushQuote() {
                    if (!quoteLines.length) return;

                    let type = "default";
                    let title = null;
                    let contentLines = [...quoteLines];

                    // Check for [!TYPE title] on the first line
                    if (contentLines.length > 0) {
                        const firstLine = contentLines[0].trim();
                        const alertMatch = firstLine.match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)(?:\s+(.*))?\]$/i);
                        if (alertMatch) {
                            type = alertMatch[1].toUpperCase();
                            if (alertMatch[2]) title = alertMatch[2].trim();
                            contentLines.shift(); // Remove the header line
                        }
                    }

                    const attrs = [];
                    if (type !== "default") attrs.push(`data-type="${type}"`);
                    if (title) attrs.push(`data-title="${escapeHtml(title)}"`);

                    const attrStr = attrs.length ? " " + attrs.join(" ") : "";
                    const content = contentLines.map(line => `<p>${formatInlineMarkdown(line)}</p>`).join("");
                    html.push(`<blockquote${attrStr}>${content}</blockquote>`);
                    quoteLines = [];
                }

                function tryParseTable(startIndex) {
                    const headerLine = lines[startIndex];
                    const sepLine = lines[startIndex + 1];
                    if (!headerLine || !sepLine) return null;
                    if (!/\|/.test(headerLine)) return null;
                    if (!/^\s*\|?\s*:?[-]{2,}.*\|.*$/.test(sepLine.trim())) return null;

                    const readRow = (line) => {
                        const trimmed = String(line || "").trim();
                        if (!trimmed) return null;
                        if (!/\|/.test(trimmed)) return null;
                        const parts = trimmed
                            .replace(/^\|/, "")
                            .replace(/\|$/, "")
                            .split("|")
                            .map(cell => cell.trim());
                        return parts;
                    };

                    const header = readRow(headerLine);
                    if (!header || !header.length) return null;

                    const rows = [];
                    let i = startIndex + 2;
                    for (; i < lines.length; i++) {
                        const row = readRow(lines[i]);
                        if (!row) break;
                        rows.push(row);
                    }

                    const thead = `<tr>${header.map(cell => `<th>${formatInlineMarkdown(cell)}</th>`).join("")}</tr>`;
                    const tbody = rows.map(r => `<tr>${r.map(cell => `<td>${formatInlineMarkdown(cell)}</td>`).join("")}</tr>`).join("");
                    const tableHtml = `<table><tbody>${thead}${tbody}</tbody></table>`;
                    return { html: tableHtml, nextIndex: i - 1 };
                }

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    const trimmed = String(line || "").trim();

                    if (!inCodeBlock && /^```+/.test(trimmed)) {
                        flushList();
                        flushTasks();
                        flushQuote();
                        inCodeBlock = true;
                        codeBlockDelim = trimmed.match(/^```+/)[0];
                        codeLanguage = trimmed.slice(codeBlockDelim.length).trim().toLowerCase();
                        continue;
                    }

                    if (inCodeBlock) {
                        if (trimmed === codeBlockDelim) {
                            if (codeLanguage === "mermaid") {
                                const code = codeLines.join("\n");
                                html.push(`<mermaid-diagram code="${escapeHtml(code)}"></mermaid-diagram>`);
                            } else {
                                html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
                            }
                            codeLines = [];
                            codeLanguage = "";
                            codeBlockDelim = "";
                            inCodeBlock = false;
                        } else {
                            codeLines.push(line);
                        }
                        continue;
                    }

                    const maybeTable = tryParseTable(i);
                    if (maybeTable) {
                        flushList();
                        flushTasks();
                        flushQuote();
                        html.push(maybeTable.html);
                        i = maybeTable.nextIndex;
                        continue;
                    }

                    if (!trimmed) {
                        flushList();
                        flushTasks();
                        flushQuote();
                        continue;
                    }

                    const quoteMatch = trimmed.match(/^>\s?(.*)$/);
                    if (quoteMatch) {
                        flushList();
                        flushTasks();
                        quoteLines.push(quoteMatch[1] || "");
                        continue;
                    }

                    const headingMatch = trimmed.match(/^(#{1,3})\s+(.*)$/);
                    if (headingMatch) {
                        flushList();
                        flushTasks();
                        flushQuote();
                        const level = headingMatch[1].length;
                        const tag = level === 1 ? "h1" : level === 2 ? "h2" : "h3";
                        html.push(`<${tag}>${formatInlineMarkdown(headingMatch[2])}</${tag}>`);
                        continue;
                    }

                    const taskMatch = trimmed.match(/^[-*+]\s+\[( |x|X)\]\s+(.*)$/);
                    if (taskMatch) {
                        flushList();
                        flushQuote();
                        taskItems.push({ checked: /x/i.test(taskMatch[1]), text: taskMatch[2] || "" });
                        continue;
                    }

                    const listMatch = trimmed.match(/^[-*+]\s+(.*)$/);
                    if (listMatch) {
                        flushTasks();
                        flushQuote();
                        listItems.push(listMatch[1] || "");
                        continue;
                    }

                    flushList();
                    flushTasks();
                    flushQuote();
                    html.push(`<p>${formatInlineMarkdown(trimmed)}</p>`);
                }

                flushList();
                flushTasks();
                flushQuote();

                if (inCodeBlock && codeLines.length) {
                    html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
                }

                return html.join("");
            }

            let templateInsertMode = "append";

            function applyTemplateContent(template) {
                if (!template) return;
                const markdown = template.markdown || "";
                const html = renderMemoTemplateMarkdown(markdown);
                const current = getActiveTab()?.content || "";
                const next = templateInsertMode === "append" && current.trim()
                    ? `${current}${html}`
                    : html;
                memoEditorApi?.setValue(next);
                updateActiveTabContent(next);
                state.templateId = template.id || null;
                state.templateLabel = template.label || null;
                persistState();
            }

            function renderTemplateList() {
                if (!templateModalList) return;
                templateModalList.innerHTML = "";
                templates.forEach((template, index) => {
                    const btn = document.createElement("button");

            function openTemplateModal(mode) {

                templateModal?.classList.remove("open");

            function openPromptModal() {
                function getAllowedPresetIds() {
                    const storePresets = window.GoToolkitChatPrompt?.PRESETS || {};
                    const base = ["edit", "suggest", "advice", "import", "draw", "extract"];
                    const allowed = base.filter(id => Object.prototype.hasOwnProperty.call(storePresets, id));
                    return allowed.length ? allowed : ["edit", "suggest", "advice"];
                }

                function readPromptForPreset(presetId) {
                    const store = window.GoToolkitChatPrompt || {};
                    const presets = store.PRESETS || {};
                    const keyMap = {
                        "advice": "goToolkit.chat.prompt",
                        "suggest": "goToolkit.chat.prompt.suggest",
                        "edit": "goToolkit.chat.prompt.edit",
                        "import": "goToolkit.chat.prompt.import",
                        "draw": "goToolkit.chat.prompt.draw",
                        "extract": "goToolkit.chat.prompt.extract"
                    };
                    const key = keyMap[presetId] || "goToolkit.chat.prompt.edit";
                    try {
                        return (localStorage.getItem(key) || presets[presetId]?.prompt || presets[presetId]?.defaultPrompt || "").trim();
                    } catch (err) {
                        return (presets[presetId]?.prompt || presets[presetId]?.defaultPrompt || "").trim();
                    }
                }

                function ensurePresetOptions(allowedIds) {
                    if (!promptPresetSelect || !window.GoToolkitChatPrompt?.PRESETS) return;
                    const presets = window.GoToolkitChatPrompt.PRESETS;
                    promptPresetSelect.innerHTML = "";
                    allowedIds.forEach(id => {
                        const preset = presets[id] || {};
                        const btn = document.createElement("button");
                        btn.type = "button";
                        btn.className = "btn-secondary memo-prompt-preset-btn";
                        btn.dataset.id = id;
                        btn.innerHTML = (preset.icon ? `<i data-lucide="${preset.icon}"></i> ` : '') + (preset.label || id);
                        btn.addEventListener("click", () => {
                            setActivePreset(id);
                        });
                        promptPresetSelect.appendChild(btn);
                    });
                    if (window.lucide) window.lucide.createIcons();
                }

                function setActivePreset(id) {
                    if (promptEditor) {
                        promptEditor.value = readPromptForPreset(id);
                    }

                    promptPresetSelect?.querySelectorAll(".memo-prompt-preset-btn").forEach(btn => {
                        btn.classList.toggle("active", btn.dataset.id === id);
                    });
                    if (promptPresetSelect) promptPresetSelect.dataset.value = id;
                }

                if (promptEditor && window.GoToolkitChatPrompt) {
                    const allowedIds = getAllowedPresetIds();
                    ensurePresetOptions(allowedIds);

                    const assistPreset = window.GoToolkitAssistInstance?.promptPresetId;
                    const fallbackPreset = state?.promptPresetId;
                    const activeId = (assistPreset && allowedIds.includes(assistPreset))
                        ? assistPreset
                        : (fallbackPreset && allowedIds.includes(fallbackPreset))
                            ? fallbackPreset
                            : (allowedIds.includes("edit") ? "edit" : (allowedIds[0] || "edit"));

                    if (promptPresetSelect) {
                        setActivePreset(activeId);
                    }
                    promptEditor.value = readPromptForPreset(activeId);
                }

                promptModal?.classList.add("open");
                promptModal?.setAttribute("aria-hidden", "false");
            }

            function closePromptModal() {
                promptModal?.classList.remove("open");
                promptModal?.setAttribute("aria-hidden", "true");
