            function setupMemoPrompt() {
                const promptStore = window.GoToolkitChatPrompt || {};
                const defaultPrompt = promptStore.DEFAULT_SYSTEM_PROMPT || promptStore.SYSTEM_PROMPT || "";
                const defaultInfoPrompt = promptStore.DEFAULT_INFO_PROMPT || promptStore.INFO_PROMPT || "";
                const defaultSuggestPrompt = promptStore.PRESETS?.suggest?.defaultPrompt || promptStore.PRESETS?.suggest?.prompt || "";
                const defaultEditPrompt = promptStore.PRESETS?.edit?.defaultPrompt || promptStore.PRESETS?.edit?.prompt || "";
                promptStore.SYSTEM_PROMPT = promptStore.SYSTEM_PROMPT || defaultPrompt;
                promptStore.DEFAULT_SYSTEM_PROMPT = defaultPrompt;
                promptStore.INFO_PROMPT = promptStore.INFO_PROMPT || defaultInfoPrompt;
                promptStore.DEFAULT_INFO_PROMPT = defaultInfoPrompt;
                // Use standard presets from prompt.js if available, otherwise fallback to defaults
                if (!promptStore.PRESETS) {
                    promptStore.PRESETS = {
                        advice: {
                            id: "advice",
                            label: "Demander",
                            prompt: promptStore.SYSTEM_PROMPT,
                            defaultPrompt: defaultPrompt
                        },
                        ask: {
                            id: "ask",
                            label: "Explorer",
                            prompt: promptStore.INFO_PROMPT,
                            defaultPrompt: defaultInfoPrompt
                        },
                        suggest: {
                            id: "suggest",
                            label: "Suggérer",
                            prompt: defaultSuggestPrompt,
                            defaultPrompt: defaultSuggestPrompt
                        },
                        edit: {
                            id: "edit",
                            label: "Éditer",
                            prompt: defaultEditPrompt,
                            defaultPrompt: defaultEditPrompt
                        }
                    };
                }
                window.GoToolkitChatPrompt = promptStore;
            }

            function applyPromptChanges(presetId, value) {
                if (!window.GoToolkitChatPrompt) return;
                const trimmed = (value || "").trim();

                if (presetId !== "edit" && presetId !== "suggest" && presetId !== "advice" && presetId !== "import" && presetId !== "draw" && presetId !== "extract") return;

                const preset = window.GoToolkitChatPrompt.PRESETS?.[presetId];
                const fallback = preset?.defaultPrompt || "";
                const next = trimmed || fallback;
                if (preset) {
                    preset.prompt = next;
                }
                const keyMap = {
                    "advice": "goToolkit.chat.prompt",
                    "suggest": "goToolkit.chat.prompt.suggest",
                    "edit": "goToolkit.chat.prompt.edit",
                    "import": "goToolkit.chat.prompt.import",
                    "draw": "goToolkit.chat.prompt.draw",
                    "extract": "goToolkit.chat.prompt.extract"
                };
                const key = keyMap[presetId] || "goToolkit.chat.prompt.edit";
                try {
                    localStorage.setItem(key, next);
                } catch (err) {
                    console.warn("Prompt save failed", err);
                }
            }

            function normalizeMemoPromptPresetId(value) {
                if (value === "advice") return "advice";
                if (value === "suggest") return "suggest";
                return "edit";
            }

            function syncAssistPresetFromState() {

            document.addEventListener("goToolkitChatPromptPresetChanged", (event) => {

            document.addEventListener("goToolkitMemoImportStatus", event => {

            function exportJson() {
                const payload = buildSharePayload();
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });

            function handleJsonImport(file) {
                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const payload = JSON.parse(reader.result);
                        const loaded = normalizeState(payload);
                        if (!loaded) {
                            setStatus("Fichier invalide", true);
                            return;
                        }
                        state = loaded;
                        renderTabs();
                        setActiveTab(state.activeTabId);
                        syncAssistPresetFromState();
                        persistState();
                        if (!activeDocumentId) {
                            activeDocumentId = createId();
                        }
                        upsertOpenDocument({
                            id: activeDocumentId,
                            title: getDocumentTitleFromState(state),
                            payload: buildSharePayload(),
                            updatedAt: new Date().toISOString()
                        });
                        renderDocumentTabs();
                        setStatus("Mémo importé");
                    } catch (err) {
                        console.error("Import failed", err);
                        setStatus("Import impossible", true);
                    }
                };
                reader.readAsText(file);
            }

            async function ensureDefaultDocumentRecord() {
                if (!documentApi) return [];
                const all = await documentApi.getAllRecords();
                const memoDocs = (all || []).filter(item => item && item.app === "memo");
                if (memoDocs.length) return memoDocs;
                const nextState = createDefaultState(true);
                const payload = nextState;
                const now = new Date().toISOString();
                const id = (documentApi.generateId && documentApi.generateId()) || createId();
                const record = await documentApi.upsertRecord({
                    id,
                    app: "memo",
                    payload,
                    title: nextState.tabs?.[0]?.title || "Doc 1",
                    description: "",
                    updatedAt: now
                });
                return record ? [record] : [];
            }

            async function restoreOpenDocumentsFromStorage() {
                if (!documentApi) return false;
                const stored = loadOpenDocumentState();
                if (!stored || !stored.openDocumentIds.length) return false;
                const restoredDocs = [];
                for (const id of stored.openDocumentIds) {
                    if (!id) continue;
                    try {
                        const record = await documentApi.getRecord(id);
                        if (!record || !record.payload) continue;
                        restoredDocs.push({
                            id: record.id,
                            title: record.title || "Mémo",
                            payload: record.payload,
                            updatedAt: record.updatedAt || new Date().toISOString()
                        });
                    } catch (err) {
                        console.warn("Failed to restore memo document", err);
                    }
                }
                if (!restoredDocs.length) return false;
                openDocuments = restoredDocs;
                const preferred = stored.activeDocumentId;
                const active = restoredDocs.find(doc => doc.id === preferred) || restoredDocs[0];
                const loaded = normalizeState(active.payload);
                if (loaded) {
                    state = loaded;
                    activeDocumentId = active.id;
                }
                return true;
            }

            async function openMostRecentDocumentFromStore() {
                if (!documentApi) return false;
                try {
                    const all = await documentApi.getAllRecords();
                    const memoDocs = (all || []).filter(item => item && item.app === "memo");
                    if (!memoDocs.length) return false;
                    memoDocs.sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));
                    const record = memoDocs[0];
                    if (!record || !record.payload) return false;
                    const loaded = normalizeState(record.payload);
                    if (!loaded) return false;
                    state = loaded;
                    activeDocumentId = record.id;
                    upsertOpenDocument({
                        id: record.id,
                        title: record.title || getDocumentTitleFromState(state),
                        payload: record.payload,
                        updatedAt: record.updatedAt || new Date().toISOString()
                    });
                    return true;
                } catch (err) {
                    console.warn("Failed to open stored memo document", err);
                    return false;
                }
            }

            resetDevState();
            const initialState = loadState();

                window.__memoState = state;
                renderTabs();
                renderDocumentTabs();
                if (openDocuments.length) {
                    ensureActiveDocument();
                }
                setupMemoPrompt();
                syncAssistPresetFromState();
                hydrateMemoContextEmbeddings();
                migrateLegacyContextEmbeddings();
            });

            Promise.all([memoEditorReady, documentLoadedPromise])
                .then(([api]) => {
                    memoEditorApi = api;
                    if (!memoEditorApi) return;
                    const debouncedChange = debounce(value => updateActiveTabContent(value), 500);
                    memoEditorApi.onChange(value => debouncedChange(value));
                    setActiveTab(state.activeTabId);
                    if (autoSaveTimer) {
                        clearInterval(autoSaveTimer);
                    }
                    autoSaveTimer = setInterval(() => {
                        if (activeDocumentId) {
                            saveDocument({ showToast: false });

                .catch(err => {
                    console.error("Initialisation de l'éditeur Mémo impossible", err);

            window.addEventListener("beforeunload", () => {

                    persistState();

                }

            fileMenuBtn?.addEventListener("click", event => {

            renameDocumentBtn?.addEventListener("click", async () => {

            deleteDocumentBtn?.addEventListener("click", async () => {

                await deleteActiveDocument();

            memoOpenImportBtn?.addEventListener("click", () => {

                    skipEmbeddings: true
                });
            });

            importJsonInput?.addEventListener("change", event => {

            infoButton?.addEventListener("click", event => {

            memoUpdateBtn?.addEventListener("click", async () => {
                if (!confirm("Les documents seront effacés. Continuer ?")) {
                    return;
                }

                try {
                    indexedDB.deleteDatabase('go-toolkit');
                    indexedDB.deleteDatabase('gotoolkit-documents');
                } catch (e) { }

                localStorage.clear();
                sessionStorage.clear();

                if ('caches' in window) {
                    try {
                        const names = await caches.keys();

                    } catch (e) { }
                }

                window.location.reload();
            });

            shareBtn?.addEventListener("click", event => {

                closeMenus(shareMenu);
                shareMenu?.classList.toggle("open");

            templateModalApply?.addEventListener("click", () => {

            document.addEventListener("click", event => {

                if (!trigger) return;

                openPromptModal();
            });
            promptModalClose?.addEventListener("click", () => closePromptModal());
            promptModal?.addEventListener("click", event => {
                if (event.target === promptModal) closePromptModal();
            });
            resetPromptBtn?.addEventListener("click", () => {
                if (!window.GoToolkitChatPrompt) return;
                const presetId = (promptPresetSelect?.dataset.value || "edit").trim();
                promptEditor.value = window.GoToolkitChatPrompt.PRESETS?.[presetId]?.defaultPrompt || "";
            });
            applyPromptBtn?.addEventListener("click", () => {

                applyPromptChanges(presetId, promptEditor.value);

            document.addEventListener("click", event => {

                if (shareMenu?.contains(event.target) || shareBtn?.contains(event.target)) return;
                if (memoInfoPopup?.contains(event.target) || infoButton?.contains(event.target)) return;
                closeMenus();
                closeInfoPopup();
            });

            document.addEventListener("keydown", event => {
                if (event.key === "Escape") {
                    closeMenus();
                    closeTemplateModal();
                    closePromptModal();
                    closeInfoPopup();
                }
            });

            loadShareFromUrl();

            const EDGE_DROP_BUFFER = 50;
            let draggedDocumentId = null;
            documentTabsEl?.addEventListener("dragstart", event => {
                const tab = event.target.closest(".document-tab");
                if (!tab || !tab.dataset.documentId) return;
                draggedDocumentId = tab.dataset.documentId;
                tab.classList.add("is-dragging");
                event.dataTransfer.effectAllowed = "move";
                event.dataTransfer.setData("text/plain", draggedDocumentId);
            });
            documentTabsEl?.addEventListener("dragend", event => {
                const tab = event.target.closest(".document-tab");
                tab?.classList.remove("is-dragging");
                draggedDocumentId = null;
            });
            documentTabsEl?.addEventListener("dragover", event => {
                if (!draggedDocumentId) return;
                const target = event.target.closest(".document-tab");
                if (target) {
                    if (target.dataset.documentId === draggedDocumentId) return;
                    event.preventDefault();
                    return;
                }
                const containerRect = documentTabsEl.getBoundingClientRect();
                if (event.clientX <= containerRect.right + EDGE_DROP_BUFFER && event.clientX >= containerRect.left) {
                    event.preventDefault();
                }
            });
            documentTabsEl?.addEventListener("drop", event => {
                const target = event.target.closest(".document-tab");
                if (!draggedDocumentId) return;
                event.preventDefault();
                const fromIndex = openDocuments.findIndex(doc => doc.id === draggedDocumentId);
                const [moved] = openDocuments.splice(fromIndex, 1);
                if (!target) {
                    const containerRect = documentTabsEl.getBoundingClientRect();
                    if (event.clientX <= containerRect.right + EDGE_DROP_BUFFER) {
                        openDocuments.push(moved);
                        renderDocumentTabs();
                    } else {
                        openDocuments.splice(fromIndex, 0, moved);
                    }
                    return;
                }
                const targetId = target.dataset.documentId;
                if (!targetId || targetId === draggedDocumentId) return;
                const toIndex = openDocuments.findIndex(doc => doc.id === targetId);
                if (fromIndex < 0 || toIndex < 0) return;
                const rect = target.getBoundingClientRect();
                const insertAfter = event.clientX > rect.left + rect.width / 2;
                let nextIndex = toIndex;
                if (insertAfter) {
                    nextIndex = toIndex + (fromIndex < toIndex ? 0 : 1);
                } else {
                    nextIndex = toIndex + (fromIndex < toIndex ? -1 : 0);
                }
                if (nextIndex < 0) nextIndex = 0;
                if (nextIndex > openDocuments.length) nextIndex = openDocuments.length;
                openDocuments.splice(nextIndex, 0, moved);
                renderDocumentTabs();
            });

            const navSwitcherBtn = document.getElementById("navSwitcherBtn");
            const navSwitcherMenu = document.getElementById("navSwitcherMenu");
            navSwitcherBtn?.addEventListener("click", event => {
                event.stopPropagation();
                navSwitcherMenu?.classList.toggle("open");
            });
            document.addEventListener("click", event => {
                if (!navSwitcherMenu) return;
                if (navSwitcherMenu.contains(event.target) || navSwitcherBtn === event.target) return;
                navSwitcherMenu.classList.remove("open");
            });

            window.applyMemoOperations = function (operations) {
                if (!memoEditorApi || !Array.isArray(operations) || !operations.length) return;
                try {
                    // Sort by start descending to avoid position shifts
                    operations.sort((a, b) => (b.start || 0) - (a.start || 0));
                    operations.forEach(op => {
                        const action = op.action;
                        const text = op.text || "";
                        const start = op.start || 0;
                        const end = op.end || start;
                        const newHtml = '<span class="highlight-added">' + text + '</span>';
                        if (action === 'replace' && op.old_text) {
                            // Find and replace text
                            const content = memoEditorApi.getValue();
                            const updated = content.replace(op.old_text, newHtml);
                            if (updated !== content) {
                                memoEditorApi.setValue(updated);
                            } else {
                                // Fallback: use start/end, but approximate by replacing at position in text
                                // Complex, skip for now
                            }
                        } else if (action === 'insert' && text) {
                            // Insert at position in content
                            const content = memoEditorApi.getValue();
                            const textContent = content.replace(/<[^>]*>/g, '').replace(/\s+/g, ' '); // rough text
                            if (start <= textContent.length) {
                                // Approximate position in HTML
                                const htmlAtPos = start; // placeholder
                                const updated = content.slice(0, htmlAtPos) + newHtml + content.slice(htmlAtPos);
                                memoEditorApi.setValue(updated);
                            }
                        } else if (action === 'delete') {
                            if (op.old_text) {
                                const content = memoEditorApi.getValue();
                                const updated = content.replace(op.old_text, '');
                                memoEditorApi.setValue(updated);
                            }
                        }
                    });
                    updateActiveTabContent(memoEditorApi.getValue());
                } catch (err) {
                    console.warn("Apply operations failed", err);
                }
            };
        })();

            const input = document.getElementById('chat-inline-editor-input');
            const btn = document.getElementById('chat-inline-editor-btn');

            // Créer l'overlay de sélection
            const selectionOverlay = document.createElement('div');
            selectionOverlay.id = 'chat-selection-overlay';
            selectionOverlay.style.cssText = `
                position: fixed;
                background: rgba(255, 235, 59, 0.15);
                border: 1px solid rgba(255, 235, 59, 0.3);
                pointer-events: none;
                display: none;
                z-index: 998;
                border-radius: 4px;
            `;
            document.body.appendChild(selectionOverlay);

            // État
            let currentSelection = null;
            let currentCoords = null;
            let currentBlockCoords = null;

            // Écouter l'événement custom du memo-editor
            document.addEventListener('memoEditorSelectionChanged', (e) => {
                const { detail } = e;

                // Vérifier le preset actif
                const assistSidebar = window.GoToolkitAssistInstance;
                const activePreset = assistSidebar?.promptPresetId || "edit";

                // Mettre à jour le placeholder selon le preset
                const placeholders = {
                    'edit': 'Que veux-tu modifier ?',
                    'advice': 'Que veux-tu demander ?',
                    'draw': 'Que veux-tu dessiner ?',
                    'suggest': 'Que veux-tu corriger ?',
                    'ask': 'Que veux-tu explorer ?',
                    'import': 'Que veux-tu importer ?',
                    'extract': 'Que veux-tu extraire ?'
                };
                input.placeholder = placeholders[activePreset] || 'Que veux-tu faire ?';

                if (!detail.isSelected) {
                    // Pas de sélection - cacher le composant et l'overlay
                    container.style.display = 'none';
                    selectionOverlay.style.display = 'none';
                    currentSelection = null;
                    currentCoords = null;
                    currentBlockCoords = null;
                    return;
                }

                // Mettre à jour l'état avec le bloc complet
                currentSelection = {
                    text: detail.selectionText,
                    blockText: detail.blockText || detail.selectionText,
                    blockMarkdown: detail.blockMarkdown || detail.blockText || detail.selectionText,
                    excerpt: detail.selectionExcerpt,
                    from: detail.positionFrom,
                    to: detail.positionTo,
                };
                currentCoords = detail.coords;

                // Stocker les coords du bloc pour l'overlay
                try {
                    const editorInstance = window.memoEditor;
                    if (editorInstance) {
                        const blockStart = editorInstance.view.coordsAtPos(detail.positionFrom);
                        const blockEnd = editorInstance.view.coordsAtPos(detail.positionTo);
                        currentBlockCoords = {
                            top: blockStart.top,
                            left: blockStart.left,
                            width: blockEnd.right - blockStart.left,
                            height: blockEnd.bottom - blockStart.top,
                        };
                    }
                } catch (err) {
                    console.warn('Error getting block coords:', err);
                }

                // Positionner et afficher le composant (mais pas l'overlay immédiatement)
                positionEditor();
                container.style.display = 'block';

                // Si l'événement demande explicitement le focus (ex: via le bubble menu)
                if (detail.focus) {
                    setTimeout(() => {
                        input.focus();
                        // Positionner l'overlay puisque l'input a maintenant le focus
                        if (currentBlockCoords) {
                            positionOverlay();
                            selectionOverlay.style.display = 'block';
                        }
                    }, 50);
                }
                // L'overlay s'affiche seulement au focus du textarea
                // Pas de focus automatique - l'utilisateur clique quand il est prêt
            });

            // Positionner le composant
            function positionEditor() {
                if (!currentCoords) return;

                // Largeur du composant : utiliser la largeur du wrapper (350px en CSS)
                const wrapper = editor.querySelector('.chat-inline-editor__wrapper');
                const componentWidth = wrapper ? wrapper.offsetWidth : 350;
                const margin = 40;

                // Position : left de la sélection + offset de 40px
                let leftPos = currentCoords.left + 40;

                // Vérifier les limites droite avec marge de 40px
                const maxLeft = window.innerWidth - componentWidth - margin;

                // Clamper si dépasse à droite
                leftPos = Math.min(leftPos, maxLeft);
                // Mais ne pas laisser être trop à gauche
                if (leftPos < margin) {
                    leftPos = margin;
                }

                editor.style.position = 'fixed';

                // Calculer la hauteur du composant et limiter le bas à 40px du viewport
                const editorHeight = editor.offsetHeight || 80; // hauteur approximative si pas encore rendu
                let topPos = currentCoords.bottom + 10;
                const maxTop = window.innerHeight - editorHeight - 40;

                // Clamper si dépasse en bas (max 40px du bas)
                if (topPos > maxTop) {
                    topPos = maxTop;
                }
                // Assurer qu'il ne soit pas trop haut (au moins 10px de marge top)
                if (topPos < 10) {
                    topPos = 10;
                }

                editor.style.top = topPos + 'px';
                editor.style.left = leftPos + 'px';
                editor.style.zIndex = '1000';
            }

            // Positionner l'overlay
            function positionOverlay() {
                if (!currentBlockCoords) return;

                selectionOverlay.style.position = 'fixed';
                selectionOverlay.style.top = currentBlockCoords.top + 'px';
                selectionOverlay.style.left = currentBlockCoords.left + 'px';
                selectionOverlay.style.width = Math.max(currentBlockCoords.width, 100) + 'px';
                selectionOverlay.style.height = Math.max(currentBlockCoords.height, 20) + 'px';
            }

            // Synchroniser la position au scroll de l'éditeur
            const editorWrap = document.querySelector('.editor-wrap');
            if (editorWrap) {
                editorWrap.addEventListener('scroll', () => {
                    if (currentSelection && window.memoEditor) {
                        try {
                            const view = window.memoEditor.view;
                            const coordsStart = view.coordsAtPos(currentSelection.from);
                            const coordsEnd = view.coordsAtPos(currentSelection.to);

                            // Mettre à jour currentCoords
                            currentCoords = {
                                top: coordsEnd.bottom + 10,
                                left: coordsStart.left,
                                bottom: coordsEnd.bottom,
                                right: coordsEnd.right,
                            };

                            // Mettre à jour currentBlockCoords
                            currentBlockCoords = {
                                top: coordsStart.top,
                                left: coordsStart.left,
                                width: coordsEnd.right - coordsStart.left,
                                height: coordsEnd.bottom - coordsStart.top,
                            };

                            // Repositionner
                            if (container.style.display !== 'none') {
                                positionEditor();
                            }
                            if (selectionOverlay.style.display !== 'none') {
                                positionOverlay();
                            }
                        } catch (e) {
                            // Erreur silencieuse possible si l'éditeur est en train de se détruire
                        }
                    }
                }, { passive: true });
            }

            // Envoyer le message à l'IA
            async function sendMessage() {
                if (!input.value.trim() || !currentSelection) return;

                try {
                    // Récupérer l'éditeur Tiptap
                    const editorInstance = window.memoEditor;
                    if (!editorInstance) {
                        console.error('Éditeur Tiptap non trouvé');
                        return;
                    }

                    // S'assurer que le chat est ouvert
                    const assistSidebar = window.GoToolkitAssistInstance;
                    if (assistSidebar && !assistSidebar.isOpen) {
                        assistSidebar.open?.();
                    }

                    // Récupérer le contenu du document
                    const documentMarkdown = (
                        window.getEditorMarkdown?.() ||
                        window.getMemoEditorSource?.('markdown') ||
                        ''
                    );
                    const documentContent = (documentMarkdown ||
                        editorInstance.getHTML?.() ||
                        '');

                    // Calculer les numéros de ligne du bloc sélectionné (dans le Markdown)
                    let selectionStartLine = 0;
                    let selectionEndLine = 0;
                    const selectionBlockMarkdown = (currentSelection.blockMarkdown || '').toString().trim();

                    // 1) Méthode robuste: retrouver le bloc markdown dans le markdown du doc
                    if (documentMarkdown && selectionBlockMarkdown) {
                        const idx = documentMarkdown.indexOf(selectionBlockMarkdown);
                        if (idx >= 0) {
                            selectionStartLine = documentMarkdown.slice(0, idx).split('\n').length - 1;
                            selectionEndLine = selectionStartLine + selectionBlockMarkdown.split('\n').length;
                        }
                    }

                    // 2) Fallback historique: approximation via positions ProseMirror
                    if (!Number.isFinite(selectionEndLine) || selectionEndLine <= selectionStartLine) {
                        const lines = documentContent.split('\n');
                        let charCount = 0;

                        for (let i = 0; i < lines.length; i++) {
                            const lineLength = lines[i].length + 1; // +1 pour le newline
                            if (charCount + lineLength > currentSelection.from) {
                                selectionStartLine = i;
                                break;
                            }
                            charCount += lineLength;
                        }

                        // Calculer la ligne de fin
                        charCount = 0;
                        selectionEndLine = lines.length;
                        for (let i = 0; i < lines.length; i++) {
                            const lineLength = lines[i].length + 1;
                            if (charCount + lineLength > currentSelection.to) {
                                selectionEndLine = i + 1;
                                break;
                            }
                            charCount += lineLength;
                        }
                    }

                    // Construire le payload avec SELECTION structuré
                    const activePresetId = (window.GoToolkitAssistInstance?.promptPresetId || "edit").trim();

                    // Mapper l'ID du preset vers sa clé de stockage
                    const presetStorageKeys = {
                        'edit': 'goToolkit.chat.prompt.edit',
                        'suggest': 'goToolkit.chat.prompt.suggest',
                        'ask': 'goToolkit.chat.prompt.info',
                        'advice': 'goToolkit.chat.prompt.system',
                        'draw': 'goToolkit.chat.prompt.draw'
                    };
                    const presetKey = presetStorageKeys[activePresetId] || 'goToolkit.chat.prompt.edit';
                    const presetId = activePresetId;

                    let systemPrompt = '';
                    try {
                        systemPrompt = (localStorage.getItem(presetKey) || '').trim();
                    } catch (err) {
                        systemPrompt = '';
                    }
                    if (!systemPrompt) {
                        systemPrompt = (window.GoToolkitChatPrompt?.PRESETS?.[presetId]?.prompt
                            || window.GoToolkitChatPrompt?.PRESETS?.[presetId]?.defaultPrompt
                            || 'Éditer le texte fourni.');
                    }
                    const payload = {
                        system: systemPrompt,
                        messages: [
                            {
                                role: 'user',
                                content: `DOCUMENT:\n${documentContent}\n\nSELECTION:\n${JSON.stringify({
                                    text: (currentSelection.blockMarkdown || currentSelection.blockText),
                                    start: selectionStartLine,
                                    end: selectionEndLine
                                })}\n\nASK:\n${input.value}`,
                            },
                        ],
                        stream: false,
                    };

                    // ✨ Cacher immédiatement le composant et l'overlay (avant d'attendre la réponse)
                    const savedExcerpt = currentSelection.excerpt;
                    const savedPos = { from: currentSelection.from, to: currentSelection.to };
                    input.value = '';
                    container.style.display = 'none';
                    selectionOverlay.style.display = 'none';
                    currentSelection = null;
                    currentCoords = null;
                    currentBlockCoords = null;

                    // Appeler la fonction sendInlineEditToAssist
                    if (window.sendInlineEditToAssist) {
                        await window.sendInlineEditToAssist({
                            payload,
                            selectionExcerpt: savedExcerpt,
                            selectionPos: savedPos,
                            editor: editorInstance,
                        });
                    }
                } catch (error) {
                    console.error('Erreur lors de l\'envoi:', error);
                }
            }

            // Événements
            btn.addEventListener('click', sendMessage);
            input.addEventListener('mousedown', (e) => {
                e.preventDefault();
                setTimeout(() => input.focus(), 0);
            });
            input.addEventListener('focus', () => {
                // Afficher l'overlay quand le textarea a le focus
                if (currentBlockCoords) {
                    positionOverlay();
                    selectionOverlay.style.display = 'block';
                }
            });
            input.addEventListener('blur', () => {
                // Cacher l'overlay quand le textarea perd le focus
                selectionOverlay.style.display = 'none';
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                } else if (e.key === 'Enter' && e.shiftKey) {
                    // SHIFT+ENTER insère une nouvelle ligne (comportement par défaut)
                    e.preventDefault();
                    const start = input.selectionStart;
                    const end = input.selectionEnd;
                    input.value = input.value.substring(0, start) + '\n' + input.value.substring(end);
                    input.selectionStart = input.selectionEnd = start + 1;
                }
            });

            // Exposer la fonction pour réinitialiser si nécessaire
            window.closeMemoInlineEditor = function () {
                container.style.display = 'none';
                input.value = '';
                currentSelection = null;
                currentCoords = null;
            };
        })();
    </script>

    <script>
        // Expose the active tab content getter for the chat sidebar to use
        (function () {
            // Reference to the memo state (set in the main memo app script)
            let memoStateRef = null;
            let memoEditorApiRef = null;

            // Wait for memo state to be initialized
            const stateCheckInterval = setInterval(() => {
                // Try to access the scope where state and memoEditorApi are defined
                // We'll use a more direct approach: expose via document event listener
                if (window.__memoStateInitialized) {
                    clearInterval(stateCheckInterval);
                }
            }, 100);

            // Expose function to get active tab content
            // This will be called by assist.js to get the current memo document
            window.getMemoActiveTabContent = function () {
                // Try to get content from the currently displayed editor
                if (typeof window.getEditorMarkdown === 'function') {
                    return window.getEditorMarkdown();
                }
                // Fallback: empty string if not available
                return '';
            };

            // Store reference when memo is initialized
            document.addEventListener('memoStateReady', (e) => {
                memoStateRef = e.detail?.state;
                memoEditorApiRef = e.detail?.editorApi;
            });
        })();
    </script>

    <div id="memo-source-overlay"
        style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100000;">
        <div id="memo-source-modal" role="dialog" aria-modal="true" aria-label="Document source"
            style="position:absolute; top:1vh; left:50%; transform:translateX(-50%); width:1100px; max-width:calc(100vw - 24px); height:98vh; background:#111; color:#eee; border:1px solid rgba(255,255,255,.12); border-radius:8px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.6); font-size:13px;">
            <div
                style="display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid rgba(255,255,255,.12); font-size:13px;">
                <div style="font-weight:600; font-size:13px;">Source</div>
                <div style="flex:1;"></div>

                <label for="memo-source-format" style="font-size:13px; opacity:.8;">Format</label>
                <select id="memo-source-format"
                    style="height:28px; background:#1a1a1a; color:#eee; border:1px solid rgba(255,255,255,.16); border-radius:8px; padding:0 8px; font-size:13px;">
                    <option value="markdown" selected>Markdown</option>
                    <option value="html">HTML</option>
                    <option value="json">JSON</option>
                    <option value="ai_in">AI In</option>
                    <option value="ai_out">AI Out</option>
                </select>

                <button id="memo-source-close" type="button"
                    style="height:28px; padding:0 10px; background:#1a1a1a; color:#eee; border:1px solid rgba(255,255,255,.16); border-radius:8px; cursor:pointer; font-size:13px;">
                    Close
                </button>
            </div>

            <textarea id="memo-source-text" readonly spellcheck="false" title="Click to copy all"
                style="width:100%; height:calc(98vh - 52px); padding:12px; border:0; outline:none; resize:none; background:#0b0b0b; color:#eaeaea; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; font-size:13px; line-height:1.45;"></textarea>

            <div id="memo-source-toast" role="status" aria-live="polite"
                style="position:absolute; left:50%; bottom:14px; transform:translateX(-50%); background:rgba(20,20,20,.95); color:#fff; border:1px solid rgba(255,255,255,.12); padding:8px 10px; border-radius:8px; font-size:13px; display:none; pointer-events:none; max-width:calc(100% - 24px); text-align:center;">
            </div>
        </div>
    </div>

    <script>
        (function () {
            const overlay = document.getElementById('memo-source-overlay');
            const closeBtn = document.getElementById('memo-source-close');
            const formatEl = document.getElementById('memo-source-format');
            const textarea = document.getElementById('memo-source-text');
            const toast = document.getElementById('memo-source-toast');

            function showToast(message) {
                if (!toast) return;
                toast.textContent = message;
                toast.style.display = 'block';
                clearTimeout(showToast._t);
                showToast._t = setTimeout(() => {
                    toast.style.display = 'none';
                }, 1400);
            }

            function safeStringify(value) {
                if (value == null) return '';
                if (typeof value === 'string') return value;
                try {
                    return JSON.stringify(value, null, 2);
                } catch (e) {
                    return String(value);
                }
            }

            function getSource(format) {
                if (format === 'markdown' || format === 'html' || format === 'json') {
                    try {
                        const fn = window.getMemoEditorSource;
                        if (typeof fn === 'function') {
                            return fn(format) || '';
                        }
                    } catch (e) { }
                    return '';
                }

                if (format === 'ai_in') {
                    // Try to get the last AI request from assist.js storage
                    const lastRequest = window.getLastAIRequest?.();
                    if (lastRequest) {
                        return safeStringify(lastRequest);
                    }

                    // Fallback to legacy variables
                    const at = window.__memoEditorLastAIInAt || null;
                    const doc = window.__memoEditorLastAIInDocumentMarkdown || window.getEditorMarkdown?.() || '';
                    const messages = window.__memoEditorLastAIInMessages || null;
                    return safeStringify({
                        header: 'DOCUMENT',
                        at,
                        document_markdown: doc,
                        payload_messages: messages,
                    });
                }

                if (format === 'ai_out') {
                    // Try to get the last AI response from assist.js storage
                    const lastResponse = window.getLastAIResponse?.();
                    if (lastResponse) {
                        return safeStringify(lastResponse);
                    }

                    // Fallback to legacy variables
                    const at = window.__memoEditorLastAIOutAt || null;
                    const out = window.__memoEditorLastAIOut || null;
                    const extractText = () => {
                        if (typeof out === 'string') {
                            return out;
                        }
                        if (out && typeof out === 'object') {
                            if (typeof out.text === 'string') {
                                return out.text;
                            }
                            if (typeof out.ai_out === 'string') {
                                return out.ai_out;
                            }
                            if (typeof out.output === 'string') {
                                return out.output;
                            }
                        }
                        return null;
                    };
                    const text = extractText();
                    if (text) {
                        return text;
                    }
                    return safeStringify({ at, ai_out: out });
                }

                return '';
            }

            function refresh() {
                if (!formatEl || !textarea) return;
                const value = getSource(formatEl.value);
                textarea.value = value || '';
                textarea.focus();
                textarea.select();
            }

            async function copyAll() {
                if (!textarea) return;
                const text = textarea.value || '';
                try {
                    await navigator.clipboard.writeText(text);
                    showToast('Copié dans le presse-papiers');
                } catch (e) {
                    textarea.focus();
                    textarea.select();
                    const ok = document.execCommand && document.execCommand('copy');
                    showToast(ok ? 'Copié dans le presse-papiers' : 'Copie impossible');
                }
            }

            function open() {
                if (!overlay || !formatEl) return;
                overlay.style.display = 'block';

                // Auto-select AI IN if there's a recent request, otherwise AI OUT if there's a response, otherwise markdown
                const lastRequest = window.getLastAIRequest?.();
                const lastResponse = window.getLastAIResponse?.();
                if (lastRequest && lastRequest.payload) {
                    formatEl.value = 'ai_in';
                } else if (lastResponse && lastResponse.payload) {
                    formatEl.value = 'ai_out';
                } else {
                    formatEl.value = 'markdown';
                }
                refresh();
            }

            function close() {
                if (!overlay) return;
                overlay.style.display = 'none';
            }

            window.openMemoSourceModal = open;
            document.addEventListener('memoEditorOpenSourceModal', open);

            closeBtn?.addEventListener('click', close);
            overlay?.addEventListener('click', (e) => {
                if (e.target === overlay) close();
            });
            formatEl?.addEventListener('change', refresh);

            textarea?.addEventListener('click', () => {
                textarea.focus();
                textarea.select();
                copyAll();
            });

            textarea?.addEventListener('copy', (e) => {
                try {
                    e.preventDefault();
                    e.clipboardData.setData('text/plain', textarea.value || '');
                    showToast('Copié dans le presse-papiers');
                } catch (err) { }
            });

            document.addEventListener('keydown', (e) => {
                if (overlay?.style.display === 'block' && e.key === 'Escape') {
                    close();
                }
            });
        })();
        // Initialize Lucide icons
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
