<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>Mémo | Go-Toolkit</title>
    <link rel="stylesheet" href="styles/style.css?v=2026.01.08">
    <style>
        :root {
            --app-bg: #f3f4f6;
            --app-border: #cdd4ed;
            --app-border-strong: #cdd4ed;
            --app-text: #101428;
            --memo-card-bg: #ffffff;
        }

        html,
        body {
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--app-font, "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
            background: #f3f4f6;
            color: var(--app-text);
        }

        .memo-shell {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        #page {
            flex: 1 1 auto;
            min-width: 0;
        }

        .document-explorer {
            width: var(--doc-sidebar-width, 350px);
            flex: 0 0 var(--doc-sidebar-width, 350px);
            background: #ffffff;
            border-right: 1px solid var(--app-border, #dfe3f5);
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px;
            color: var(--app-text);
            overflow: hidden;
        }

        .document-explorer.document-explorer--collapsed {
            width: 0;
            flex: 0 0 0;
            padding: 0;
            border-right: none;
            opacity: 0;
            pointer-events: none;
        }

        .document-explorer__header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.02em;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--app-border, #dfe3f5);
        }

        .document-explorer__list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            padding: 4px 2px 8px;
        }

        .document-explorer__item {
            border: 1px solid var(--app-border, #dfe3f5);
            background: #fff;
            color: var(--app-text);
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .document-explorer__item>span:first-child {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .document-explorer__item-actions {
            margin-left: auto;
            display: inline-flex;
            gap: 4px;
        }

        .document-explorer__item-action {
            border: none;
            background: transparent;
            padding: 0 2px;
            font-size: 13px;
            line-height: 1;
            color: #111827;
            cursor: pointer;
        }

        .document-explorer__item-action:hover,
        .document-explorer__item-action:focus-visible {
            color: #0f172a;
            outline: none;
        }

        .document-explorer__item-action.document-explorer__delete {
            font-size: 12px;
        }

        .document-explorer .chat-knowledge-modal__add {
            width: auto;
            display: inline-flex;
            align-self: flex-end;
            margin-left: auto;
            padding: 6px 12px;
        }

        .document-explorer__item:hover,
        .document-explorer__item:focus-visible {
            border-color: var(--app-primary);
            outline: none;
        }

        .document-explorer__empty {
            font-size: 12px;
            color: #6b7280;
            padding: 8px 10px;
        }

        .document-explorer-resizer {
            width: 6px;
            cursor: col-resize;
            background: transparent;
            position: relative;
        }


        .document-explorer-resizer.is-hidden {
            display: none;
        }

        .app {
            width: 100%;
            max-width: none;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
            min-height: 100vh;
            height: 100vh;
            padding: 12px;
            overflow: hidden;
        }

        .tabs-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .global-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
            margin-left: auto;
        }

        #tabs {
            flex-direction: column;
            align-items: flex-start;
        }

        #document-tabs {
            width: 100%;
        }

        #memo-tabs {
            display: none;
        }

        .document-tab {
            background: transparent;
            border: 1px solid var(--app-border-strong);
            color: var(--app-primary-strong);
            padding: 4px 10px;
            border-radius: 8px;
            transition: background 0.2s ease, color 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .document-tab.active {
            background: var(--app-primary);
            border-color: var(--app-primary);
            color: #ffffff;
        }

        .document-tab__close {
            border: none;
            background: transparent;
            color: inherit;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
        }

        .document-tab__close:hover,
        .document-tab__close:focus-visible {
            color: var(--app-primary-strong);
            outline: none;
        }

        .app-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .memo-card {
            background: var(--memo-card-bg);
            border: 1px solid #ebe0d1;
            border-radius: 12px;
            box-shadow: var(--app-shadow);
            padding: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0;
            min-height: 0;
            overflow: hidden;
        }

        .editor-wrap {
            padding: 18px;
            flex: 1;
            overflow-y: auto;
            background: #fff;
        }

        .editor {
            border-radius: 8px;
            padding: 16px 16px 22px;
            min-height: 320px;
            outline: none;
            background: #fff;
        }

        .editor:focus-within {
            border-color: #cbd5e1;
            box-shadow: 0 0 0 4px rgba(203, 213, 225, .35);
        }

        /* Tiptap content */
        .ProseMirror {
            outline: none;
            font-size: 16px;
            line-height: 1.6;
        }

        .ProseMirror p {
            margin: 0 0 10px;
        }

        .ProseMirror h1 {
            font-size: 28px;
            line-height: 1.2;
            margin: 10px 0 12px;
        }

        .ProseMirror h2 {
            font-size: 22px;
            line-height: 1.25;
            margin: 10px 0 10px;
        }

        .ProseMirror ul {
            margin: 8px 0 10px 22px;
        }

        .ProseMirror ol {
            margin: 8px 0 10px 22px;
        }

        .ProseMirror li {
            margin: 4px 0;
        }

        .ProseMirror blockquote {
            margin: 10px 0;
            padding: 10px 12px;
            border-left: 3px solid #e5e7eb;
            color: #111827;
            background: #fafafa;
            border-radius: 10px;
        }

        .ProseMirror code {
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: .95em;
        }

        /* Bubble menu */
        .menu {
            display: flex;
            gap: 6px;
            padding: 8px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, .05);
            z-index: 10000;
        }

        .menu button {
            border: none;
            background: #fff;
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .menu button:hover {
            background: #eef2f7;
        }

        .menu button[data-active="true"] {
            border-color: #cbd5e1;
            background: #f8fafc;
            font-weight: 650;
        }

        /* Slash menu */
        .slash {
            position: fixed;
            z-index: 9999;
            width: 240px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            box-shadow: 0 14px 30px rgba(15, 23, 42, .14);
            padding: 6px;
            display: none;
        }

        .slash .item {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
        }

        .slash .item:hover {
            background: #eef2f7;
        }

        .slash .ico {
            width: 24px;
            height: 24px;
            display: grid;
            place-items: center;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            font-size: 12px;
            color: #64748b;
            background: #fff;
            flex: 0 0 auto;
        }

        .slash .meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .slash .meta small {
            color: #64748b;
            font-size: 11px;
        }

        .modal textarea {
            width: 100%;
            border-radius: 8px;
            border: 1px solid #d0c3ad;
            padding: 10px;
            font-family: "Menlo", "SFMono-Regular", "Consolas", "Liberation Mono", "Courier New", monospace;
            font-size: 13px;
            resize: vertical;
        }

        #memoPromptPresetSelect {
            font-size: 11px;
        }

        /* AI Request Counter Toaster */
        #aiRequestCounterToaster {
            position: fixed;
            bottom: 18px;
            right: 18px;
            background: rgba(15, 23, 42, 0.92);
            color: #fff;
            padding: 8px 16px;
            border-radius: 999px;
            box-shadow: 0 8px 26px rgba(0, 0, 0, 0.25);
            font-size: 12px;
            font-weight: 600;
            line-height: 1.4;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 240;
            font-family: "Menlo", "SFMono-Regular", "Consolas", "Liberation Mono", "Courier New", monospace;
            letter-spacing: 0.5px;
        }

        #aiRequestCounterToaster.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* Spinner animation for counter */
        @keyframes spinnerRotate {
            0% {
                content: "◴";
            }

            25% {
                content: "◷";
            }

            50% {
                content: "◶";
            }

            75% {
                content: "◵";
            }
        }

        @media (max-width: 900px) {
            .app-header {
                gap: 6px;
            }

            .memo-card {
                padding: 4px;
            }
        }
    </style>

    <script>
        (function () {
            const manager = window.GoToolkitDocumentManager;
            if (!manager || typeof manager.ingestFiles !== "function") return;

            const KNOWLEDGE_CONVERSATION_ID = window.GoToolkitKnowledgeConversationId || "knowledge";
            window.GoToolkitKnowledgeConversationId = KNOWLEDGE_CONVERSATION_ID;

            function getVersionParam() {
                try {
                    const params = new URLSearchParams(window.location.search || "");
                    return params.get("v") || "v";
                } catch (err) {
                    return "v";
                }
            }

            function createFileLike(data, fileName, type) {
                const normalizedType = (type || "").trim();
                const parts = [];
                if (data instanceof Blob) {
                    parts.push(data);
                } else if (ArrayBuffer.isView(data) || data instanceof ArrayBuffer) {
                    parts.push(data);
                } else {
                    parts.push(typeof data === "string" ? data : (data != null ? String(data) : ""));
                }
                const blobType = normalizedType || (data instanceof Blob ? data.type : "");
                if (typeof File !== "undefined") {
                    try {
                        return new File(parts, fileName, { type: blobType });
                    } catch (err) {
                        // fallback to Blob
                    }
                }
                const fallback = new Blob(parts, { type: blobType });
                fallback.name = fileName;
                return fallback;
            }

            function getFileNameFromPath(path) {
                if (!path) return "";
                const parts = path.split("/");
                return parts[parts.length - 1] || path;
            }

            function parseUpdatedAt(value) {
                if (typeof value === "number" && Number.isFinite(value)) {
                    return value;
                }
                if (typeof value === "string" && value.trim()) {
                    const parsed = Number(value);
                    if (Number.isFinite(parsed)) return parsed;
                    const date = Date.parse(value);
                    if (Number.isFinite(date)) return date;
                }
                return 0;
            }

            async function loadManifest() {
                try {
                    const url = new URL("content/files.json", window.location.href);
                    url.searchParams.set("v", getVersionParam());
                    const response = await fetch(url.toString(), { cache: "no-cache" });
                    if (!response.ok) {
                        console.warn("Index manifest fetch failed", response.status);
                        return [];
                    }
                    const items = await response.json();
                    if (!Array.isArray(items)) return [];
                    return items
                        .map((entry) => {
                            const fileName = (entry.fileName || getFileNameFromPath(entry.path || "")).trim();
                            return {
                                path: entry.path,
                                name: (entry.name || fileName).trim(),
                                abstract: entry.abstract || "",
                                updatedAt: parseUpdatedAt(entry.updatedAt),
                                fileName: fileName
                            };
                        })
                        .filter(entry => entry.path && entry.fileName && entry.name);
                } catch (err) {
                    console.error("Index manifest load failed", err);
                    return [];
                }
            }

            function detectFileTypeFromPath(path) {
                if (!path) return "";
                const lower = path.toLowerCase();
                if (lower.endsWith(".pdf")) return "pdf";
                if (lower.endsWith(".md")) return "markdown";
                if (lower.endsWith(".txt")) return "txt";
                return "";
            }

            async function fetchDocument(doc) {
                try {
                    const url = new URL(doc.path, window.location.href);
                    url.searchParams.set("v", getVersionParam());
                    const response = await fetch(url.toString(), { cache: "no-cache" });
                    if (!response.ok) {
                        console.warn("Index doc fetch failed", doc.path, response.status);
                        return null;
                    }
                    const fileName = doc.fileName || getFileNameFromPath(doc.path);
                    const contentTypeHeader = (response.headers.get("content-type") || "").toLowerCase();
                    const extensionHint = detectFileTypeFromPath(doc.path);
                    const isPdf = contentTypeHeader.includes("pdf") || extensionHint === "pdf";
                    if (isPdf) {
                        const buffer = await response.arrayBuffer();
                        const mime = contentTypeHeader.includes("/") ? contentTypeHeader : "application/pdf";
                        const blob = new Blob([buffer], { type: mime });
                        return createFileLike(blob, fileName, mime);
                    }
                    const text = await response.text();
                    const textMime = contentTypeHeader.includes("markdown") || extensionHint === "markdown"
                        ? "text/markdown"
                        : contentTypeHeader.includes("html")
                            ? "text/html"
                            : "text/plain";
                    return createFileLike(text, fileName, textMime);
                } catch (err) {
                    console.error("Index doc fetch error", doc.path, err);
                    return null;
                }
            }

            async function syncIndexDocs() {
                try {
                    await manager.waitReady();
                    const manifest = await loadManifest();
                    if (!manifest.length) return;

                    const existingDocs = await manager.getDocuments(KNOWLEDGE_CONVERSATION_ID);
                    const existingMap = new Map();
                    existingDocs.forEach((doc) => {
                        if (!doc || doc.sourceType !== "embedded") return;
                        const key = doc.sourceFileName || doc.name;
                        existingMap.set(key, doc);
                    });

                    const staleNames = [];
                    manifest.forEach((entry) => {
                        const stored = existingMap.get(entry.fileName);
                        if (!stored) return;
                        const storedUpdated = Number(stored.updatedAt) || 0;
                        if (!storedUpdated || entry.updatedAt > storedUpdated) {
                            staleNames.push(stored.name);
                            existingMap.delete(entry.fileName);
                        }
                    });
                    if (staleNames.length) {
                        await manager.deleteDocumentsByNames(KNOWLEDGE_CONVERSATION_ID, staleNames);
                    }

                    const toIngest = manifest.filter(entry => !existingMap.has(entry.fileName));
                    if (!toIngest.length) return;

                    const files = (await Promise.all(toIngest.map(fetchDocument))).filter(Boolean);
                    if (!files.length) return;

                    const metadata = new Map();
                    toIngest.forEach((entry) => {
                        metadata.set(entry.fileName, {
                            name: entry.name,
                            abstract: entry.abstract,
                            updatedAt: entry.updatedAt,
                            fileName: entry.fileName
                        });
                    });
                    await manager.ingestFiles(files, KNOWLEDGE_CONVERSATION_ID, {
                        sourceType: "embedded",
                        metadata
                    });
                } catch (err) {
                    console.error("Index document sync failed", err);
                }
            }

            async function refreshIndexDocs() {
                try {
                    await manager.waitReady();
                    const manifest = await loadManifest();
                    const fileNames = manifest.map(entry => entry.fileName);
                    if (fileNames.length) {
                        await manager.deleteDocumentsByNames(KNOWLEDGE_CONVERSATION_ID, fileNames);
                    }
                } catch (err) {
                    console.error("Index document cleanup failed", err);
                }
                return syncIndexDocs();
            }

            function runSync() {
                syncIndexDocs();
            }

            window.GoToolkitIndexDocSync = refreshIndexDocs;
            if (document.readyState === "loading") {
                window.addEventListener("DOMContentLoaded", runSync, { once: true });
            } else {
                runSync();
            }
        })();

            function createId() {
                if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {

            function normalizeState(raw) {
                if (!raw || typeof raw !== "object") return null;
                const tabs = Array.isArray(raw.tabs) ? raw.tabs.filter(Boolean) : [];
                if (!tabs.length) return null;
                const normalizedTabs = tabs.map((tab, index) => {
                    const id = typeof tab.id === "string" && tab.id ? tab.id : createId();
                    const title = typeof tab.title === "string" && tab.title.trim()
                        ? tab.title.trim()
                        : "Doc " + (index + 1);
                    const content = typeof tab.content === "string" ? tab.content : "";
                    return { id, title, content };
                });
                const activeId = normalizedTabs.some(tab => tab.id === raw.activeTabId)
                    ? raw.activeTabId
                    : normalizedTabs[0].id;
                const templateId = typeof raw.templateId === "string" ? raw.templateId : null;
                const templateLabel = typeof raw.templateLabel === "string" ? raw.templateLabel : null;
                const allowedPresets = ["edit", "suggest", "advice"];
                const promptPresetId = (typeof raw.promptPresetId === "string" && allowedPresets.includes(raw.promptPresetId))
                    ? raw.promptPresetId
                    : "edit";
                return { tabs: normalizedTabs, activeTabId: activeId, templateId, templateLabel, promptPresetId };
            }

            function getDocumentTitleFromState(docState) {
                if (!docState || !Array.isArray(docState.tabs)) return "Mémo";
                const tab = docState.tabs[0];
                return (tab && tab.title) || "Mémo";
            }

            function upsertOpenDocument(doc) {
                if (!doc || !doc.id) return;
                const existingIndex = openDocuments.findIndex(item => item.id === doc.id);
                if (existingIndex >= 0) {
                    openDocuments[existingIndex] = {
                        ...openDocuments[existingIndex],
                        ...doc
                    };
                    return;
                }
                openDocuments.unshift(doc);
            }

                if (!documentTabsEl) return;
                documentTabsEl.innerHTML = "";
                openDocuments.forEach(doc => {
                    const btn = document.createElement("button");

                    const close = document.createElement("span");
                    close.className = "document-tab__close";

                    close.setAttribute("aria-label", "Fermer le document");
                    close.tabIndex = 0;
                    const handleTabClose = async (event) => {
                        event.stopPropagation();
                        await saveDraft({ showToast: false });
                        closeDocumentTab(doc.id);
                    };
                    close.addEventListener("click", handleTabClose);
                    close.addEventListener("keydown", event => {

                        event.preventDefault();

                    });

                    btn.addEventListener("click", () => {
                        setActiveDocument(doc.id);

                        renameDocument(doc.id, doc.title || "");

                    documentTabsEl.appendChild(btn);
                });

            function ensureActiveDocument() {
                if (activeDocumentId) return;
                const payload = buildSharePayload();
                const fallbackId = currentDraftId || createId();
                activeDocumentId = fallbackId;
                upsertOpenDocument({
                    id: fallbackId,
                    title: getDocumentTitleFromState(state),
                    payload
                });
                renderDocumentTabs();
            }

            function syncActiveDocumentPayload() {
                if (!activeDocumentId) return;
                const payload = buildSharePayload();
                upsertOpenDocument({
                    id: activeDocumentId,
                    title: getDocumentTitleFromState(state),
                    payload,
                    updatedAt: new Date().toISOString()
                });
                renderDocumentTabs();
            }

            function setActiveDocument(docId) {
                if (!docId || docId === activeDocumentId) return;
                const target = openDocuments.find(item => item.id === docId);
                if (!target) return;
                syncActiveDocumentPayload();
                const loaded = normalizeState(target.payload);
                if (!loaded) return;
                state = loaded;
                activeDocumentId = target.id;
                currentDraftId = target.id;
                renderTabs();
                setActiveTab(state.activeTabId);
                syncAssistPresetFromState();
                renderDocumentTabs();
            }

            function closeDocumentTab(docId) {
                const index = openDocuments.findIndex(item => item.id === docId);
                if (index < 0) return;
                const wasActive = openDocuments[index].id === activeDocumentId;
                openDocuments.splice(index, 1);
                if (wasActive) {
                    const next = openDocuments[0];
                    if (next) {
                        activeDocumentId = null;
                        setActiveDocument(next.id);
                    } else {
                        state = createDefaultState();
                        activeDocumentId = null;
                        currentDraftId = null;
                        renderTabs();
                        setActiveTab(state.activeTabId);
                        renderDocumentTabs();
                    }
                } else {
                    renderDocumentTabs();
                }
            }

            function loadState() {
                if (typeof localStorage === "undefined") return null;
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return null;
                    return normalizeState(JSON.parse(raw));
                } catch (err) {
                    console.warn("Memo load state failed", err);
                    return null;
                }
            }

            function persistState() {
                if (typeof localStorage === "undefined") return;
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                } catch (err) {
                    console.warn("Memo save state failed", err);
                }
                syncActiveDocumentPayload();
                // Sync global state reference for assist.js
                window.__memoState = state;
                // Notify assist.js to update tab indicator
                if (window.GoToolkitAssistInstance?.updateTabIndicator) {
                    window.GoToolkitAssistInstance.updateTabIndicator();
                }

            function setVoiceRecordingId(memoId, recordingId) {

                    tabsEl.appendChild(btn);

                return state.tabs.find(tab => tab.id === state.activeTabId) || state.tabs[0];

                const target = state.tabs.find(tab => tab.id === tabId);

                state.activeTabId = target.id;

                tab.content = typeof value === "string" ? value : "";

                const index = state.tabs.findIndex(tab => tab.id === state.activeTabId);
                if (index < 0) return;
                state.tabs.splice(index, 1);
                const next = state.tabs[Math.max(0, index - 1)];
                state.activeTabId = next.id;
                setActiveTab(next.id);

            function buildSharePayload() {
                return {
                    tabs: state.tabs,

            function getShareTokenFromUrl() {
                try {
                    const params = new URLSearchParams(window.location.search);
                    const value = params.get(SHARE_QUERY_PARAM);

                } catch (err) {

            function updateUrlWithShareToken(token) {
                const url = new URL(window.location.href);
                if (token) {
                    url.searchParams.set(SHARE_QUERY_PARAM, token);

                    url.searchParams.delete(SHARE_QUERY_PARAM);

            function updateUrlWithEditId(id) {

            function createShareToken() {
                if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
                    return crypto.randomUUID();
                }
                const bytes = new Uint8Array(16);
                if (typeof crypto !== "undefined" && typeof crypto.getRandomValues === "function") {
                    crypto.getRandomValues(bytes);
                } else {
                    for (let i = 0; i < bytes.length; i++) {
                        bytes[i] = Math.floor(Math.random() * 256);
                    }
                }
                return Array.from(bytes)
                    .map(byte => byte.toString(16).padStart(2, "0"))
                    .join("");
            }

            async function saveShare(token) {
                if (!shareWorker || !shareWorker.isReady) {
                    throw new Error("Service de partage indisponible");

                const payload = buildSharePayload();
                const meta = await shareWorker.saveSharePayload(FIRESTORE_COLLECTION, token, payload);

            async function loadShareFromUrl() {

                    console.error("Share load failed", err);

                return false;

            async function openDocumentFromRecord(record) {
                if (!record || !record.payload) return;

                    record.payload.tabs
                        ? record.payload
                        : { tabs: [{ id: createId(), title: "Doc 1", content: record.payload }] }

            async function openDocumentById(docId) {

            async function applyDocumentRename(docId, nextName) {
                if (!docId || !nextName) return;
                const doc = openDocuments.find(item => item.id === docId);
                if (doc && doc.payload && Array.isArray(doc.payload.tabs) && doc.payload.tabs[0]) {
                    doc.payload.tabs[0].title = nextName;
                }
                if (docId === activeDocumentId && state.tabs[0]) {
                    state.tabs[0].title = nextName;
                    persistState();
                }
                if (capsuleDrafts) {
                    const payload = docId === activeDocumentId ? buildSharePayload() : doc?.payload;
                    await capsuleDrafts.upsertRecord({
                        id: docId,
                        app: "memo",
                        payload,
                        title: nextName,
                        description: doc?.description || "",
                        updatedAt: new Date().toISOString()
                    });
                }
                upsertOpenDocument({
                    id: docId,
                    title: nextName,
                    payload: doc?.payload || buildSharePayload(),
                    updatedAt: new Date().toISOString()
                });

                const explorer = getExplorer();

            async function createNewDocument(name) {
                syncActiveDocumentPayload();
                const nextState = createDefaultState();
                if (nextState.tabs[0]) {
                    nextState.tabs[0].title = name;
                }
                state = nextState;
                currentDraftId = (capsuleDrafts?.generateId && capsuleDrafts.generateId()) || createId();
                activeDocumentId = currentDraftId;
                renderTabs();
                setActiveTab(state.activeTabId);
                syncAssistPresetFromState();
                await saveDraft({ showToast: true });
                getExplorer()?.refresh?.();
                window.GoToolkitAssistInstance?.open?.();
            }

            const memoExplorer = window.GoToolkitDocumentExplorer?.create({
                appId: "memo",
                sidebar: "#documentExplorer",

            function escapeHtml(value) {
                return String(value || "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            function formatInlineMarkdown(text) {
                let out = escapeHtml(text);
                out = out.replace(/`([^`]+)`/g, (_, code) => `<code>${escapeHtml(code)}</code>`);
                out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
                out = out.replace(/__([^_]+)__/g, "<strong>$1</strong>");
                out = out.replace(/\*([^*]+)\*/g, "<em>$1</em>");
                out = out.replace(/_([^_]+)_/g, "<em>$1</em>");
                out = out.replace(/~~([^~]+)~~/g, "<s>$1</s>");
                out = out.replace(/==([^=]+)==/g, "<mark>$1</mark>");
                out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) => {
                    const safeLabel = escapeHtml(label);
                    const safeUrl = String(url || "").trim();
                    if (!/^https?:\/\//i.test(safeUrl)) return safeLabel;
                    return `<a href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer">${safeLabel}</a>`;
                });
                return out;
            }

            function renderMemoTemplateMarkdown(markdown) {
                const raw = String(markdown || "");
                if (!raw.trim()) return "";

                const lines = raw.replace(/\r\n/g, "\n").split("\n");
                const html = [];

                let inCodeBlock = false;
                let codeLines = [];

                let listItems = [];
                let taskItems = [];
                let quoteLines = [];

                function flushList() {
                    if (!listItems.length) return;
                    html.push(`<ul>${listItems.map(item => `<li>${formatInlineMarkdown(item)}</li>`).join("")}</ul>`);
                    listItems = [];
                }

                function flushTasks() {
                    if (!taskItems.length) return;
                    html.push(
                        `<ul data-type="taskList">${taskItems.map(item =>
                            `<li data-type="taskItem" data-checked="${item.checked ? "true" : "false"}">${formatInlineMarkdown(item.text)}</li>`
                        ).join("")}</ul>`
                    );
                    taskItems = [];
                }

                function flushQuote() {
                    if (!quoteLines.length) return;
                    const content = quoteLines.map(line => `<p>${formatInlineMarkdown(line)}</p>`).join("");
                    html.push(`<blockquote>${content}</blockquote>`);
                    quoteLines = [];
                }

                function tryParseTable(startIndex) {
                    const headerLine = lines[startIndex];
                    const sepLine = lines[startIndex + 1];
                    if (!headerLine || !sepLine) return null;
                    if (!/\|/.test(headerLine)) return null;
                    if (!/^\s*\|?\s*:?[-]{2,}.*\|.*$/.test(sepLine.trim())) return null;

                    const readRow = (line) => {
                        const trimmed = String(line || "").trim();
                        if (!trimmed) return null;
                        if (!/\|/.test(trimmed)) return null;
                        const parts = trimmed
                            .replace(/^\|/, "")
                            .replace(/\|$/, "")
                            .split("|")
                            .map(cell => cell.trim());
                        return parts;
                    };

                    const header = readRow(headerLine);
                    if (!header || !header.length) return null;

                    const rows = [];
                    let i = startIndex + 2;
                    for (; i < lines.length; i++) {
                        const row = readRow(lines[i]);
                        if (!row) break;
                        rows.push(row);
                    }

                    const thead = `<tr>${header.map(cell => `<th>${formatInlineMarkdown(cell)}</th>`).join("")}</tr>`;
                    const tbody = rows.map(r => `<tr>${r.map(cell => `<td>${formatInlineMarkdown(cell)}</td>`).join("")}</tr>`).join("");
                    const tableHtml = `<table><tbody>${thead}${tbody}</tbody></table>`;
                    return { html: tableHtml, nextIndex: i - 1 };
                }

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    const trimmed = String(line || "").trim();

                    if (/^```/.test(trimmed)) {
                        flushList();
                        flushTasks();
                        flushQuote();
                        if (inCodeBlock) {
                            html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
                            codeLines = [];
                            inCodeBlock = false;
                        } else {
                            inCodeBlock = true;
                        }
                        continue;
                    }

                    if (inCodeBlock) {
                        codeLines.push(line);
                        continue;
                    }

                    const maybeTable = tryParseTable(i);
                    if (maybeTable) {
                        flushList();
                        flushTasks();
                        flushQuote();
                        html.push(maybeTable.html);
                        i = maybeTable.nextIndex;
                        continue;
                    }

                    if (!trimmed) {
                        flushList();
                        flushTasks();
                        flushQuote();
                        continue;
                    }

                    const quoteMatch = trimmed.match(/^>\s?(.*)$/);
                    if (quoteMatch) {
                        flushList();
                        flushTasks();
                        quoteLines.push(quoteMatch[1] || "");
                        continue;
                    }

                    const headingMatch = trimmed.match(/^(#{1,3})\s+(.*)$/);
                    if (headingMatch) {
                        flushList();
                        flushTasks();
                        flushQuote();
                        const level = headingMatch[1].length;
                        const tag = level === 1 ? "h1" : level === 2 ? "h2" : "h3";
                        html.push(`<${tag}>${formatInlineMarkdown(headingMatch[2])}</${tag}>`);
                        continue;
                    }

                    const taskMatch = trimmed.match(/^[-*+]\s+\[( |x|X)\]\s+(.*)$/);
                    if (taskMatch) {
                        flushList();
                        flushQuote();
                        taskItems.push({ checked: /x/i.test(taskMatch[1]), text: taskMatch[2] || "" });
                        continue;
                    }

                    const listMatch = trimmed.match(/^[-*+]\s+(.*)$/);
                    if (listMatch) {
                        flushTasks();
                        flushQuote();
                        listItems.push(listMatch[1] || "");
                        continue;
                    }

                    flushList();
                    flushTasks();
                    flushQuote();
                    html.push(`<p>${formatInlineMarkdown(trimmed)}</p>`);
                }

                flushList();
                flushTasks();
                flushQuote();

                if (inCodeBlock && codeLines.length) {
                    html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
                }

                return html.join("\n");
            }

                    }
                    return ["edit", "suggest", "advice"].filter(id => Object.prototype.hasOwnProperty.call(storePresets, id));
                }

                function readPromptForPreset(presetId) {
                    const store = window.GoToolkitChatPrompt || {};
                    const presets = store.PRESETS || {};
                    const keyMap = {
                        "advice": "goToolkit.chat.prompt",
                        "suggest": "goToolkit.chat.prompt.suggest",
                        "edit": "goToolkit.chat.prompt.edit",
                        "import": "goToolkit.chat.prompt.import"
                    };
                    const key = keyMap[presetId] || "goToolkit.chat.prompt.edit";
                    try {
                        return (localStorage.getItem(key) || presets[presetId]?.prompt || presets[presetId]?.defaultPrompt || "").trim();
                    } catch (err) {
                        return (presets[presetId]?.prompt || presets[presetId]?.defaultPrompt || "").trim();

                function ensurePresetOptions(allowedIds) {
                    if (!promptPresetSelect || !window.GoToolkitChatPrompt?.PRESETS) return;

                    promptPresetSelect.innerHTML = "";

                        const opt = document.createElement("option");
                        opt.value = id;
                        opt.textContent = preset.label || id;
                        promptPresetSelect.appendChild(opt);

                    promptPresetSelect.disabled = allowedIds.length <= 1;

                    ensurePresetOptions(allowedIds);

                    const assistPreset = window.GoToolkitAssistInstance?.promptPresetId;

                    const activeId = (assistPreset && allowedIds.includes(assistPreset))
                        ? assistPreset
                        : (fallbackPreset && allowedIds.includes(fallbackPreset))
                            ? fallbackPreset
                            : (allowedIds.includes("edit") ? "edit" : (allowedIds[0] || "edit"));

            function setupMemoPrompt() {

                const defaultInfoPrompt = promptStore.DEFAULT_INFO_PROMPT || promptStore.INFO_PROMPT || "";
                const defaultSuggestPrompt = promptStore.PRESETS?.suggest?.defaultPrompt || promptStore.PRESETS?.suggest?.prompt || "";
                const defaultEditPrompt = promptStore.PRESETS?.edit?.defaultPrompt || promptStore.PRESETS?.edit?.prompt || "";
                promptStore.SYSTEM_PROMPT = promptStore.SYSTEM_PROMPT || defaultPrompt;
                promptStore.DEFAULT_SYSTEM_PROMPT = defaultPrompt;
                promptStore.INFO_PROMPT = promptStore.INFO_PROMPT || defaultInfoPrompt;
                promptStore.DEFAULT_INFO_PROMPT = defaultInfoPrompt;
                // Use standard presets from prompt.js if available, otherwise fallback to defaults
                if (!promptStore.PRESETS) {
                    promptStore.PRESETS = {
                        advice: {
                            id: "advice",
                            label: "↬ Conseiller",

                            defaultPrompt: defaultPrompt
                        },

            function applyPromptChanges(presetId, value) {
                if (!window.GoToolkitChatPrompt) return;
                const trimmed = (value || "").trim();

                if (presetId !== "edit" && presetId !== "suggest" && presetId !== "advice") return;

                const preset = window.GoToolkitChatPrompt.PRESETS?.[presetId];
                const fallback = preset?.defaultPrompt || "";
                const next = trimmed || fallback;
                if (preset) {
                    preset.prompt = next;
                }
                const keyMap = {
                    "advice": "goToolkit.chat.prompt",
                    "suggest": "goToolkit.chat.prompt.suggest",
                    "edit": "goToolkit.chat.prompt.edit",
                    "import": "goToolkit.chat.prompt.import"
                };
                const key = keyMap[presetId] || "goToolkit.chat.prompt.edit";
                try {
                    localStorage.setItem(key, next);
                } catch (err) {
                    console.warn("Prompt save failed", err);
                }
            }

            function normalizeMemoPromptPresetId(value) {
                if (value === "advice") return "advice";

                        renderDocumentTabs();
                        setStatus("Mémo importé");
                    } catch (err) {
                        console.error("Import failed", err);
                        setStatus("Import impossible", true);

                    let result = '';
                    for (let i = 0; i < 8; i++) {
                        result += chars.charAt(Math.floor(Math.random() * chars.length));
                    }
                    return result;
                };

                // Vérifier s'il y a des données non enregistrées dans capsule-drafts
                const hasUnsavedChanges = await (async () => {
                    try {
                        const store = goToolkitDocStore?.createStore('capsule-drafts');
                        if (!store || !store.getAll) return false;
                        const items = await store.getAll();
                        return items && items.length > 0;
                    } catch (e) {
                        return false;

                })();

                    "suggest": "goToolkit.chat.prompt.suggest",
                    "edit": "goToolkit.chat.prompt.edit",
                    "import": "goToolkit.chat.prompt.import"
                };
                const key = keyMap[presetId] || "goToolkit.chat.prompt.edit";
                try {
                    promptEditor.value = (localStorage.getItem(key) || presets[presetId]?.prompt || presets[presetId]?.defaultPrompt || "").trim();
                } catch (err) {
                    promptEditor.value = (presets[presetId]?.prompt || presets[presetId]?.defaultPrompt || "").trim();
                }
            });
            resetPromptBtn?.addEventListener("click", () => {
                if (!window.GoToolkitChatPrompt) return;
                const presetId = (promptPresetSelect?.value || "edit").trim();
                if (presetId !== "edit" && presetId !== "suggest" && presetId !== "import" && presetId !== "advice") return;
                promptEditor.value = window.GoToolkitChatPrompt.PRESETS?.[presetId]?.defaultPrompt || "";
            });
            applyPromptBtn?.addEventListener("click", () => {
                const presetId = (promptPresetSelect?.value || "edit").trim();
                applyPromptChanges(presetId, promptEditor.value);
                closePromptModal();
                setStatus("Prompt mis à jour");
            });

            document.addEventListener("click", event => {
                if (fileMenu?.contains(event.target) || fileMenuBtn?.contains(event.target)) return;
                if (shareMenu?.contains(event.target) || shareBtn?.contains(event.target)) return;
                if (memoInfoPopup?.contains(event.target) || infoButton?.contains(event.target)) return;
                closeMenus();
                closeInfoPopup();
            });

            document.addEventListener("keydown", event => {
                if (event.key === "Escape") {
                    closeMenus();
                    closeTemplateModal();
                    closePromptModal();
                    closeInfoPopup();
                }
            });

            loadShareFromUrl();

            const navSwitcherBtn = document.getElementById("navSwitcherBtn");
            const navSwitcherMenu = document.getElementById("navSwitcherMenu");
            navSwitcherBtn?.addEventListener("click", event => {
                event.stopPropagation();
                navSwitcherMenu?.classList.toggle("open");
            });
            document.addEventListener("click", event => {
                if (!navSwitcherMenu) return;
                if (navSwitcherMenu.contains(event.target) || navSwitcherBtn === event.target) return;
                navSwitcherMenu.classList.remove("open");
            });

            window.applyMemoOperations = function (operations) {
                if (!memoEditorApi || !Array.isArray(operations) || !operations.length) return;
                try {
                    // Sort by start descending to avoid position shifts
                    operations.sort((a, b) => (b.start || 0) - (a.start || 0));
                    operations.forEach(op => {
                        const action = op.action;
                        const text = op.text || "";
                        const start = op.start || 0;
                        const end = op.end || start;
                        const newHtml = '<span class="highlight-added">' + text + '</span>';
                        if (action === 'replace' && op.old_text) {
                            // Find and replace text
                            const content = memoEditorApi.getValue();
                            const updated = content.replace(op.old_text, newHtml);
                            if (updated !== content) {
                                memoEditorApi.setValue(updated);
                            } else {
                                // Fallback: use start/end, but approximate by replacing at position in text
                                // Complex, skip for now
                            }
                        } else if (action === 'insert' && text) {
                            // Insert at position in content
                            const content = memoEditorApi.getValue();
                            const textContent = content.replace(/<[^>]*>/g, '').replace(/\s+/g, ' '); // rough text
                            if (start <= textContent.length) {
                                // Approximate position in HTML
                                const htmlAtPos = start; // placeholder
                                const updated = content.slice(0, htmlAtPos) + newHtml + content.slice(htmlAtPos);
                                memoEditorApi.setValue(updated);
                            }
                        } else if (action === 'delete') {
                            if (op.old_text) {
                                const content = memoEditorApi.getValue();
                                const updated = content.replace(op.old_text, '');
                                memoEditorApi.setValue(updated);
                            }
                        }
                    });
                    updateActiveTabContent(memoEditorApi.getValue());
                } catch (err) {
                    console.warn("Apply operations failed", err);
                }
            };
        })();
    </script>

    <!-- Floating Chat Inline Editor -->
    <script>
        (function () {
            // Éléments DOM
            const container = document.getElementById('chat-inline-editor-container');
            const editor = document.getElementById('chat-inline-editor');
            const input = document.getElementById('chat-inline-editor-input');
            const btn = document.getElementById('chat-inline-editor-btn');

            // Créer l'overlay de sélection
            const selectionOverlay = document.createElement('div');
            selectionOverlay.id = 'chat-selection-overlay';
            selectionOverlay.style.cssText = `
                position: fixed;
                background: rgba(255, 235, 59, 0.15);
                border: 1px solid rgba(255, 235, 59, 0.3);
                pointer-events: none;
                display: none;
                z-index: 998;
                border-radius: 4px;
            `;
            document.body.appendChild(selectionOverlay);

            // État
            let currentSelection = null;
            let currentCoords = null;
            let currentBlockCoords = null;

            // Écouter l'événement custom du memo-editor
            document.addEventListener('memoEditorSelectionChanged', (e) => {
                const { detail } = e;

                if (!detail.isSelected) {
                    // Pas de sélection - cacher le composant et l'overlay
                    container.style.display = 'none';
                    selectionOverlay.style.display = 'none';
                    currentSelection = null;
                    currentCoords = null;
                    currentBlockCoords = null;
                    return;
                }

                // Mettre à jour l'état avec le bloc complet
                currentSelection = {
                    text: detail.selectionText,
                    blockText: detail.blockText || detail.selectionText,
                    blockMarkdown: detail.blockMarkdown || detail.blockText || detail.selectionText,
                    excerpt: detail.selectionExcerpt,
                    from: detail.positionFrom,
                    to: detail.positionTo,
                };
                currentCoords = detail.coords;

                // Stocker les coords du bloc pour l'overlay
                try {
                    const editorInstance = window.memoEditor;
                    if (editorInstance) {
                        const blockStart = editorInstance.view.coordsAtPos(detail.positionFrom);
                        const blockEnd = editorInstance.view.coordsAtPos(detail.positionTo);
                        currentBlockCoords = {
                            top: blockStart.top,
                            left: blockStart.left,
                            width: blockEnd.right - blockStart.left,
                            height: blockEnd.bottom - blockStart.top,
                        };
                    }
                } catch (err) {
                    console.warn('Error getting block coords:', err);
                }

                // Positionner et afficher le composant (mais pas l'overlay immédiatement)
                positionEditor();
                container.style.display = 'block';
                // L'overlay s'affiche seulement au focus du textarea
                // Pas de focus automatique - l'utilisateur clique quand il est prêt
            });

            // Positionner le composant
            function positionEditor() {
                if (!currentCoords) return;

                // Largeur du composant : utiliser la largeur du wrapper (350px en CSS)
                const wrapper = editor.querySelector('.chat-inline-editor__wrapper');
                const componentWidth = wrapper ? wrapper.offsetWidth : 350;
                const margin = 40;

                // Position : left de la sélection + offset de 40px
                let leftPos = currentCoords.left + 40;

                // Vérifier les limites droite avec marge de 40px
                const maxLeft = window.innerWidth - componentWidth - margin;

                // Clamper si dépasse à droite
                leftPos = Math.min(leftPos, maxLeft);
                // Mais ne pas laisser être trop à gauche
                if (leftPos < margin) {
                    leftPos = margin;
                }

                editor.style.position = 'fixed';

                // Calculer la hauteur du composant et limiter le bas à 40px du viewport
                const editorHeight = editor.offsetHeight || 80; // hauteur approximative si pas encore rendu
                let topPos = currentCoords.bottom + 10;
                const maxTop = window.innerHeight - editorHeight - 40;

                // Clamper si dépasse en bas (max 40px du bas)
                if (topPos > maxTop) {
                    topPos = maxTop;
                }
                // Assurer qu'il ne soit pas trop haut (au moins 10px de marge top)
                if (topPos < 10) {
                    topPos = 10;
                }

                editor.style.top = topPos + 'px';
                editor.style.left = leftPos + 'px';
                editor.style.zIndex = '1000';
            }

            // Positionner l'overlay
            function positionOverlay() {
                if (!currentBlockCoords) return;

                selectionOverlay.style.position = 'fixed';
                selectionOverlay.style.top = currentBlockCoords.top + 'px';
                selectionOverlay.style.left = currentBlockCoords.left + 'px';
                selectionOverlay.style.width = Math.max(currentBlockCoords.width, 100) + 'px';
                selectionOverlay.style.height = Math.max(currentBlockCoords.height, 20) + 'px';
            }

            // Envoyer le message à l'IA
            async function sendMessage() {
                if (!input.value.trim() || !currentSelection) return;

                try {
                    // Récupérer l'éditeur Tiptap
                    const editorInstance = window.memoEditor;
                    if (!editorInstance) {
                        console.error('Éditeur Tiptap non trouvé');
                        return;
                    }

                    // S'assurer que le chat est ouvert
                    const assistSidebar = window.GoToolkitAssistInstance;
                    if (assistSidebar && !assistSidebar.isOpen) {
                        assistSidebar.open?.();
                    }

                    // Récupérer le contenu du document
                    const documentMarkdown = (
                        window.getEditorMarkdown?.() ||
                        window.getMemoEditorSource?.('markdown') ||
                        ''
                    );
                    const documentContent = (documentMarkdown ||
                        editorInstance.getHTML?.() ||
                        '');

                    // Calculer les numéros de ligne du bloc sélectionné (dans le Markdown)
                    let selectionStartLine = 0;
                    let selectionEndLine = 0;
                    const selectionBlockMarkdown = (currentSelection.blockMarkdown || '').toString().trim();

                    // 1) Méthode robuste: retrouver le bloc markdown dans le markdown du doc
                    if (documentMarkdown && selectionBlockMarkdown) {
                        const idx = documentMarkdown.indexOf(selectionBlockMarkdown);
                        if (idx >= 0) {
                            selectionStartLine = documentMarkdown.slice(0, idx).split('\n').length - 1;
                            selectionEndLine = selectionStartLine + selectionBlockMarkdown.split('\n').length;
                        }
                    }

                    // 2) Fallback historique: approximation via positions ProseMirror
                    if (!Number.isFinite(selectionEndLine) || selectionEndLine <= selectionStartLine) {
                        const lines = documentContent.split('\n');
                        let charCount = 0;

                        for (let i = 0; i < lines.length; i++) {
                            const lineLength = lines[i].length + 1; // +1 pour le newline
                            if (charCount + lineLength > currentSelection.from) {
                                selectionStartLine = i;
                                break;
                            }
                            charCount += lineLength;
                        }

                        // Calculer la ligne de fin
                        charCount = 0;
                        selectionEndLine = lines.length;
                        for (let i = 0; i < lines.length; i++) {
                            const lineLength = lines[i].length + 1;
                            if (charCount + lineLength > currentSelection.to) {
                                selectionEndLine = i + 1;
                                break;
                            }
                            charCount += lineLength;
                        }
                    }

                    // Construire le payload avec SELECTION structuré
                    const activePresetId = (window.GoToolkitAssistInstance?.promptPresetId || "edit").trim();
                    const presetId = (activePresetId === "suggest" ? "suggest" : "edit");
                    const presetKey = presetId === "suggest" ? "goToolkit.chat.prompt.suggest" : "goToolkit.chat.prompt.edit";
                    let systemPrompt = '';
                    try {
                        systemPrompt = (localStorage.getItem(presetKey) || '').trim();
                    } catch (err) {
                        systemPrompt = '';
                    }
                    if (!systemPrompt) {
                        systemPrompt = (window.GoToolkitChatPrompt?.PRESETS?.[presetId]?.prompt
                            || window.GoToolkitChatPrompt?.PRESETS?.[presetId]?.defaultPrompt
                            || 'Éditer le texte fourni.');
                    }
                    const payload = {
                        system: systemPrompt,
                        messages: [
                            {
                                role: 'user',
                                content: `DOCUMENT:\n${documentContent}\n\nSELECTION:\n${JSON.stringify({
                                    text: (currentSelection.blockMarkdown || currentSelection.blockText),
                                    start: selectionStartLine,
                                    end: selectionEndLine
                                })}\n\nASK:\n${input.value}`,
                            },
                        ],
                        stream: false,
                    };

                    // 📤 Afficher le payload envoyé en console avec formatage structuré
                    console.log('%c📤 AI Payload Messages (Sent)', 'color: #FFF; background: #4CAF50; padding: 8px 12px; border-radius: 4px; font-weight: bold;');
                    console.log(JSON.stringify(payload, null, 2));

                    // ✨ Cacher immédiatement le composant et l'overlay (avant d'attendre la réponse)
                    const savedExcerpt = currentSelection.excerpt;
                    const savedPos = { from: currentSelection.from, to: currentSelection.to };
                    input.value = '';
                    container.style.display = 'none';
                    selectionOverlay.style.display = 'none';
                    currentSelection = null;
                    currentCoords = null;
                    currentBlockCoords = null;

                    // Appeler la fonction sendInlineEditToAssist
                    if (window.sendInlineEditToAssist) {
                        await window.sendInlineEditToAssist({
                            payload,
                            selectionExcerpt: savedExcerpt,
                            selectionPos: savedPos,
                            editor: editorInstance,
                        });
                    }
                } catch (error) {
                    console.error('Erreur lors de l\'envoi:', error);
                }
            }

            // Événements
            btn.addEventListener('click', sendMessage);
            input.addEventListener('mousedown', (e) => {
                e.preventDefault();
                setTimeout(() => input.focus(), 0);
            });
            input.addEventListener('focus', () => {
                // Afficher l'overlay quand le textarea a le focus
                if (currentBlockCoords) {
                    positionOverlay();
                    selectionOverlay.style.display = 'block';
                }
            });
            input.addEventListener('blur', () => {
                // Cacher l'overlay quand le textarea perd le focus
                selectionOverlay.style.display = 'none';
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                } else if (e.key === 'Enter' && e.shiftKey) {
                    // SHIFT+ENTER insère une nouvelle ligne (comportement par défaut)
                    e.preventDefault();
                    const start = input.selectionStart;
                    const end = input.selectionEnd;
                    input.value = input.value.substring(0, start) + '\n' + input.value.substring(end);
                    input.selectionStart = input.selectionEnd = start + 1;
                }
            });

            // Exposer la fonction pour réinitialiser si nécessaire
            window.closeMemoInlineEditor = function () {
                container.style.display = 'none';
                input.value = '';
                currentSelection = null;
                currentCoords = null;
            };
        })();
    </script>

    <script>
        // Expose the active tab content getter for the chat sidebar to use
        (function () {
            // Reference to the memo state (set in the main memo app script)
            let memoStateRef = null;
            let memoEditorApiRef = null;

            // Wait for memo state to be initialized
            const stateCheckInterval = setInterval(() => {
                // Try to access the scope where state and memoEditorApi are defined
                // We'll use a more direct approach: expose via document event listener
                if (window.__memoStateInitialized) {
                    clearInterval(stateCheckInterval);
                }
            }, 100);

            // Expose function to get active tab content
            // This will be called by assist.js to get the current memo document
            window.getMemoActiveTabContent = function () {
                // Try to get content from the currently displayed editor
                if (typeof window.getEditorMarkdown === 'function') {
                    return window.getEditorMarkdown();
                }
                // Fallback: empty string if not available
                return '';
            };

            // Store reference when memo is initialized
            document.addEventListener('memoStateReady', (e) => {
                memoStateRef = e.detail?.state;
                memoEditorApiRef = e.detail?.editorApi;
            });
        })();
    </script>

    <script>
        (function () {
            const overlay = document.getElementById('memo-source-overlay');
            const closeBtn = document.getElementById('memo-source-close');
            const formatEl = document.getElementById('memo-source-format');
            const textarea = document.getElementById('memo-source-text');
            const toast = document.getElementById('memo-source-toast');

            function showToast(message) {
                if (!toast) return;
                toast.textContent = message;
                toast.style.display = 'block';
                clearTimeout(showToast._t);
                showToast._t = setTimeout(() => {
                    toast.style.display = 'none';
                }, 1400);
            }

            function safeStringify(value) {
                if (value == null) return '';
                if (typeof value === 'string') return value;
                try {
                    return JSON.stringify(value, null, 2);
                } catch (e) {
                    return String(value);
                }
            }

            function getSource(format) {
                if (format === 'markdown' || format === 'html' || format === 'json') {
                    try {
                        const fn = window.getMemoEditorSource;
                        if (typeof fn === 'function') {
                            return fn(format) || '';
                        }
                    } catch (e) { }
                    return '';
                }

                if (format === 'ai_in') {
                    // Try to get the last AI request from assist.js storage
                    const lastRequest = window.getLastAIRequest?.();
                    if (lastRequest) {
                        return safeStringify(lastRequest);
                    }

                    // Fallback to legacy variables
                    const at = window.__memoEditorLastAIInAt || null;
                    const doc = window.__memoEditorLastAIInDocumentMarkdown || window.getEditorMarkdown?.() || '';
                    const messages = window.__memoEditorLastAIInMessages || null;
                    return safeStringify({
                        header: 'DOCUMENT',
                        at,
                        document_markdown: doc,
                        payload_messages: messages,
                    });
                }

                if (format === 'ai_out') {
                    // Try to get the last AI response from assist.js storage
                    const lastResponse = window.getLastAIResponse?.();
                    if (lastResponse) {
                        return safeStringify(lastResponse);
                    }

                    // Fallback to legacy variables
                    const at = window.__memoEditorLastAIOutAt || null;
                    const out = window.__memoEditorLastAIOut || null;
                    const extractText = () => {
                        if (typeof out === 'string') {
                            return out;
                        }
                        if (out && typeof out === 'object') {
                            if (typeof out.text === 'string') {
                                return out.text;
                            }
                            if (typeof out.ai_out === 'string') {
                                return out.ai_out;
                            }
                            if (typeof out.output === 'string') {
                                return out.output;
                            }
                        }
                        return null;
                    };
                    const text = extractText();
                    if (text) {
                        return text;
                    }
                    return safeStringify({ at, ai_out: out });
                }

                return '';
            }

            function refresh() {
                if (!formatEl || !textarea) return;
                const value = getSource(formatEl.value);
                textarea.value = value || '';
                textarea.focus();
                textarea.select();
            }

            async function copyAll() {
                if (!textarea) return;
                const text = textarea.value || '';
                try {
                    await navigator.clipboard.writeText(text);
                    showToast('Copié dans le presse-papiers');
                } catch (e) {
                    textarea.focus();
                    textarea.select();
                    const ok = document.execCommand && document.execCommand('copy');
                    showToast(ok ? 'Copié dans le presse-papiers' : 'Copie impossible');
                }
            }

            function open() {
                if (!overlay || !formatEl) return;
                overlay.style.display = 'block';

                // Auto-select AI IN if there's a recent request, otherwise AI OUT if there's a response, otherwise markdown
                const lastRequest = window.getLastAIRequest?.();
                const lastResponse = window.getLastAIResponse?.();
                if (lastRequest && lastRequest.payload) {
                    formatEl.value = 'ai_in';
                } else if (lastResponse && lastResponse.payload) {
                    formatEl.value = 'ai_out';
                } else {
                    formatEl.value = 'markdown';
                }
                refresh();
            }

            function close() {
                if (!overlay) return;
                overlay.style.display = 'none';
            }

            window.openMemoSourceModal = open;
            document.addEventListener('memoEditorOpenSourceModal', open);

            closeBtn?.addEventListener('click', close);
            overlay?.addEventListener('click', (e) => {
                if (e.target === overlay) close();
            });
            formatEl?.addEventListener('change', refresh);

            textarea?.addEventListener('click', () => {
                textarea.focus();
                textarea.select();
                copyAll();
            });

            textarea?.addEventListener('copy', (e) => {
                try {
                    e.preventDefault();
                    e.clipboardData.setData('text/plain', textarea.value || '');
                    showToast('Copié dans le presse-papiers');
                } catch (err) { }
            });

            document.addEventListener('keydown', (e) => {
                if (overlay?.style.display === 'block' && e.key === 'Escape') {
                    close();
                }
            });
        })();
    </script>
