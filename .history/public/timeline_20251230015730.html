                function extractJsonPayload(text) {
                    if (!text || typeof text !== "string") return text;
                    var trimmed = text.trim();
                    var fenceMatch = trimmed.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
                    if (fenceMatch && fenceMatch[1]) {
                        return fenceMatch[1].trim();
                    }
                    var firstBrace = trimmed.indexOf("{");
                    var lastBrace = trimmed.lastIndexOf("}");
                    if (firstBrace !== -1 && lastBrace !== -1 && lastBrace >= firstBrace) {
                        return trimmed.slice(firstBrace, lastBrace + 1);
                    }
                    return trimmed;
                }

                // Parse a human-readable script (as produced by buildTextExport) into a planning object.
                function parseScriptToPlanning(text) {
                    if (!text || !text.toString) return null;
                    var raw = text.toString().replace(/\r\n/g, "\n").replace(/\r/g, "\n");
                    var lines = raw.split(/\n/).map(function (l) { return (l || "").trim(); });
                    // Remove leading/trailing empty lines
                    while (lines.length && lines[0] === "") lines.shift();
                    while (lines.length && lines[lines.length - 1] === "") lines.pop();

                    var planning = { page: "", timeline: {}, groups: [], types: [], markers: [], items: [] };
                    var groupsMap = {};
                    var groupOrder = [];
                    var typesMap = {};
                    var typeOrder = [];
                    var markersMap = {};
                    var markerOrder = [];
                    var hasDeclaredGroups = false;
                    var hasDeclaredTypes = false;
                    var hasDeclaredMarkers = false;
                    var unknownReferences = [];

                    function registerGroup(label) {
                        var name = (label || "").toString().trim();
                        if (!name) return null;
                        var id = sanitizeTypeId(name) || name.replace(/\s+/g, "_").toLowerCase();
                        if (!groupsMap[id]) {
                            groupsMap[id] = { id: id, label: name };
                            groupOrder.push(id);
                        }
                        return id;
                    }

                    function registerType(label) {
                        var name = (label || "").toString().trim();
                        if (!name) return null;
                        var id = sanitizeTypeId(name) || name.replace(/\s+/g, "_").toLowerCase();
                        if (!typesMap[id]) {
                            typesMap[id] = { id: id, label: name };
                            typeOrder.push(id);
                        }
                        return id;
                    }

                    function registerMarker(label) {
                        var name = (label || "").toString().trim();
                        if (!name) return null;
                        var id = sanitizeTypeId(name) || name.replace(/\s+/g, "_").toLowerCase();
                        if (!markersMap[id]) {
                            markersMap[id] = { id: id, label: name, isMarker: true };
                            markerOrder.push(id);
                        }
                        return id;
                    }

                    // Parse header lines
                    var i = 0;
                    for (; i < lines.length; i++) {
                        var line = lines[i];
                        if (!line) continue;
                        var mPage = line.match(/^(?:Page|Bloc)\s*[:\-–]?\s*(.+)$/i);
                        if (mPage) {
                            planning.page = mPage[1].trim();
                            continue;
                        }
                        var mPeriod = line.match(/^P[eé]riode\s*[:]\s*(.+)$/i);
                        if (mPeriod) {
                            var range = mPeriod[1].split(/→|->|-|—/).map(function (s) { return s.trim(); }).filter(Boolean);
                            if (range.length) {
                                planning.timeline.start = range[0] || undefined;
                                planning.timeline.end = range[1] || range[0] || undefined;
                            }
                            continue;
                        }
                        var mGroups = line.match(/^Groupes?\s*[:]\s*(.+)$/i);
                        if (mGroups) {
                            hasDeclaredGroups = true;
                            var parts = mGroups[1].split(/,|;/).map(function (s) { return s.trim(); }).filter(Boolean);
                            parts.forEach(function (p) {
                                registerGroup(p);
                            });
                            continue;
                        }
                        var mMarkers = line.match(/^Rep[eè]res?\s*[:]\s*(.+)$/i);
                        if (mMarkers) {
                            hasDeclaredMarkers = true;
                            var markerParts = mMarkers[1].split(/,|;/).map(function (s) { return s.trim(); }).filter(Boolean);
                            markerParts.forEach(function (p) {
                                registerMarker(p);
                            });
                            continue;
                        }
                        var mTypes = line.match(/^(Types?|Cat[ée]gories?)\s*[:]\s*(.+)$/i);
                        if (mTypes) {
                            hasDeclaredTypes = true;
                            var typeParts = mTypes[2].split(/,|;/).map(function (s) { return s.trim(); }).filter(Boolean);
                            typeParts.forEach(function (p) {
                                registerType(p);
                            });
                            continue;
                        }
                        if (/^\s*(?:Actions?|Él[eé]ments?)\s*[:]?\s*$/i.test(line)) {
                            i++;
                            break;
                        }
                    }

                    // Now parse items blocks until end
                    var currentBlock = [];
                    for (; i <= lines.length; i++) {
                        var line = lines[i] || "";
                        if (line === "") {
                            if (currentBlock.length) {
                                // process block
                                var label = (currentBlock[0] || "").trim();
                                var item = { id: null, groupId: null, label: label, kind: "", start: null, end: null, date: null };
                                for (var j = 1; j < currentBlock.length; j++) {
                                    var l = currentBlock[j];
                                    var mDate = l.match(/^Date\s*[:]\s*(.+)$/i);
                                    if (mDate) {
                                        var val = mDate[1].trim();
                                        var durationMatch = val.match(/\((\d+)\s*jour[s]?\)/i);
                                        var durationDays = durationMatch ? parseInt(durationMatch[1], 10) : null;
                                        var cleaned = val.replace(/\s*\([^)]+\)\s*$/i, "").trim();
                                        var range = cleaned.split(/→|->|-|—/).map(function (s) { return s.trim(); }).filter(Boolean);
                                        if (range.length === 1) {
                                            item.date = range[0];
                                            item.start = range[0];
                                            item.end = range[0];
                                            if (durationDays && durationDays > 1) {
                                                var parsedStart = new Date(range[0]);
                                                if (!isNaN(parsedStart.getTime())) {
                                                    var calculatedEnd = new Date(parsedStart.getTime());
                                                    calculatedEnd.setDate(calculatedEnd.getDate() + (durationDays - 1));
                                                    item.end = calculatedEnd.toISOString().slice(0, 10);
                                                }
                                            }
                                        } else if (range.length >= 2) {
                                            item.start = range[0] || null;
                                            item.end = range[1] || null;
                                        }
                                        continue;
                                    }
                                    var mGroup = l.match(/^Groupe\s*[:]\s*(.+)$/i);
                                    if (mGroup) {
                                        var rawGroup = (mGroup[1] || "").trim();
                                        var gid = sanitizeTypeId(rawGroup || "");
                                        item.groupId = gid;
                                        item.rawGroupLabel = rawGroup;
                                        if (gid) {
                                            if (hasDeclaredGroups && !groupsMap[gid]) {
                                                unknownReferences.push({
                                                    action: label,
                                                    group: rawGroup,
                                                    type: item.kind || ""
                                                });
                                            } else if (!groupsMap[gid]) {
                                                registerGroup(rawGroup);
                                            }
                                        }
                                        continue;
                                    }
                                    var mType = l.match(/^Type\s*[:]\s*(.+)$/i);
                                    if (mType) {
                                        var rawType = (mType[1] || "").trim();
                                        var parsedType = parseKindLabelInput(rawType);
                                        var kind = parsedType.id;
                                        if (kind) {
                                            item.kind = kind;
                                            item.isMarker = parsedType.isMarker;
                                            if (parsedType.isMarker) {
                                                if (hasDeclaredMarkers && !markersMap[kind]) {
                                                    unknownReferences.push({
                                                        action: label,
                                                        group: item.rawGroupLabel || item.groupId || "",
                                                        type: rawType
                                                    });
                                                } else if (!markersMap[kind]) {
                                                    registerMarker(rawType);
                                                }
                                            } else {
                                                if (hasDeclaredTypes && !typesMap[kind]) {
                                                    unknownReferences.push({
                                                        action: label,
                                                        group: item.rawGroupLabel || item.groupId || "",
                                                        type: rawType
                                                    });
                                                } else if (!typesMap[kind]) {
                                                    registerType(rawType);
                                                }
                                            }
                                        }
                                        continue;
                                    }
                                }
                                // default group if missing
                                if (!item.groupId) {
                                    // assign to first group if exists or create 'default'
                                    var keys = Object.keys(groupsMap);
                                    if (keys.length) item.groupId = groupsMap[keys[0]].id;
                                    else {
                                        var gid = registerGroup("Général");
                                        item.groupId = gid;
                                    }
                                }
                                // default kind
                                if (!item.kind) {
                                    var defaultMarkerId = markerOrder.length ? markerOrder[0] : registerMarker("Repère") || "repere";
                                    var defaultTypeId = typeOrder.length ? typeOrder[0] : registerType("feature") || "feature";
                                    if (item.date && item.start && item.end && item.start === item.end) {
                                        item.kind = defaultMarkerId;
                                        item.isMarker = true;
                                    } else {
                                        item.kind = defaultTypeId;
                                        item.isMarker = false;
                                    }
                                }
                                // generate id
                                item.id = "item-" + Math.random().toString(36).slice(2, 9);
                                // if start/end equal, set date for markers
                                var itemIsMarker = item.isMarker || markersMap[item.kind];
                                if (itemIsMarker) {
                                    item.date = item.date || (item.start || null);
                                    item.start = null;
                                    item.end = null;
                                }
                                planning.items.push(item);
                                currentBlock = [];
                            }
                            continue;
                        }
                        currentBlock.push(line);
                    }

                    if (unknownReferences.length) {
                        var message = ["Groupes ou types inconnus détectés :"];
                        unknownReferences.forEach(function (ref) {
                            message.push(
                                "- Action \"" + (ref.action || "Sans titre") + "\" (Groupe : " + (ref.group || "non précisé") + ", Type : " + (ref.type || "non précisé") + ")"
                            );
                        });
                        throw new Error(message.join("\n"));
                    }

                    planning.groups = (groupOrder.length ? groupOrder : Object.keys(groupsMap)).map(function (k) {
                        return groupsMap[k];
                    }).filter(Boolean);

                    // Ensure every used type exists in definitions
                    planning.items.forEach(function (it) {
                        var kid = sanitizeTypeId(it.kind || it.type || "");
                        if (!kid) return;
                        var looksLikeMarker = it.isMarker || (it.date && (!it.end || it.start === it.end)) || markersMap[kid];
                        if (!typesMap[kid] && !markersMap[kid]) {
                            if (looksLikeMarker) {
                                registerMarker(kid);
                            } else {
                                registerType(kid);
                            }
                        }
                    });
                    planning.types = (typeOrder.length ? typeOrder : Object.keys(typesMap)).map(function (k) {
                        return typesMap[k];
                    }).filter(Boolean);
                    planning.markers = (markerOrder.length ? markerOrder : Object.keys(markersMap)).map(function (k) {
                        return markersMap[k];
                    }).filter(Boolean);
                    if (!planning.types || !planning.types.length) {
                        planning.types = [{ id: "feature", label: "feature" }];
                    }
                    if (!planning.markers || !planning.markers.length) {
                        planning.markers = [{ id: "repere", label: "Repère", isMarker: true }];
                    }
                    return planning;
                }

                async function callOpenAI(messages, controller) {
                    try {
                        if (!window.GoToolkitIA || typeof window.GoToolkitIA.chatCompletion !== "function") {
                            throw new Error("Client IA indisponible");
                        }
                        var reasoningEffort = (function () {
                            var value = reasoningEffortSelect ? reasoningEffortSelect.value : "low";
                            return REASONING_EFFORTS.indexOf(value) !== -1 ? value : "low";
                        })();
                        var payload = {
                            model:
                                window.GoToolkitIAConfig && typeof window.GoToolkitIAConfig.getOpenAiModel === "function"
                                    ? window.GoToolkitIAConfig.getOpenAiModel()
                                    : OPENAI_MODEL,
                            temperature: OPENAI_TEMPERATURE,
                            messages: messages,
                            reasoning: {
                                effort: reasoningEffort
                            },
                            stream: true
                        };
                        var messageText = await window.GoToolkitIA.chatCompletion({
                            payload: payload,
                            signal: controller && controller.signal
                        });
                        return messageText;
                    } catch (err) {
                        console.error("Erreur OpenAI", err);
                        if (err && err.name === "AbortError") {
                            try { showCopyToast("Requête annulée."); } catch (e) { }
                            return null;
                        }
                        if (err && (err.message === "OllamaUnavailable" || (err.backendInfo && err.backendInfo.type === "ollama-unavailable"))) {
                            try { showCopyToast("Ollama indisponible — vérifie l'URL ou la connexion."); } catch (e) { alert("Ollama indisponible — vérifie l'URL ou la connexion."); }
                        } else {
                            alert("Impossible de contacter OpenAI. Vérifie que le proxy est accessible.");
                        }
                        return null;
                    }
                }

                btnCall.addEventListener("click", async function () {
                    var mode = determineGenerationMode();
                    await generateFromMode(btnCall, mode);
                });

                if (clearTimelineBtn) {
                    clearTimelineBtn.addEventListener("click", function () {
                        clearActiveView({ clearRecit: false });
                    });
                }
                updateTimelineClearButtonState();

                function determineTimelineRestoreTarget(preferred, hasAi, hasManual) {
                    if (preferred === "ai") {
                        if (hasAi) return "ai";
                        if (hasManual) return "manual";
                    } else {
                        if (hasManual) return "manual";
                        if (hasAi) return "ai";
                    }
                    if (hasAi) return "ai";
                    if (hasManual) return "manual";
                    return null;
                }

                function nextTimelineRestorePreference(lastUsed, hasAi, hasManual) {
                    if (lastUsed === "ai") {
                        return hasManual ? "manual" : (hasAi ? "ai" : "manual");
                    }
                    if (lastUsed === "manual") {
                        return hasAi ? "ai" : (hasManual ? "manual" : "ai");
                    }
                    return hasAi ? "ai" : hasManual ? "manual" : "ai";
                }

                function applyTimelineScriptFromRestore(scriptText) {
                    if (!txtPromptModify) return;
                    txtPromptModify.value = scriptText || "";
                    persistActiveContext(function (ctx) {
                        ctx.prompts.modify = txtPromptModify.value || "";
                    });
                    var parsed = null;
                    try {
                        parsed = JSON.parse(scriptText || "");
                    } catch (jsonErr) {
                        parsed = parseScriptToPlanning(scriptText || "");
                        if (!parsed) {
                            throw jsonErr;
                        }
                    }
                    applyPlanningFromJson(parsed);
                }

                function restoreTimelineScript() {
                    var aiScript = lastAiPlanningJson || "";
                    var manualScript = lastManualPlanningScript;
                    var hasAi = Boolean(aiScript);
                    var hasManual = manualScript != null;
                    if (!hasAi && !hasManual) {
                        alert("Aucune réponse IA JSON récente à restaurer.");
                        return;
                    }
                    var target = determineTimelineRestoreTarget(lastPlanningRestoreTarget, hasAi, hasManual);
                    if (!target) {
                        alert("Aucune réponse IA JSON récente à restaurer.");
                        return;
                    }
                    var valueToApply = target === "manual" ? (manualScript || "") : aiScript;
                    try {
                        applyTimelineScriptFromRestore(valueToApply);
                    } catch (err) {
                        console.warn("Impossible de restaurer la réponse IA", err);
                        alert("Impossible de restaurer la réponse IA.");
                        return;
                    }
                    lastPlanningRestoreTarget = nextTimelineRestorePreference(target, hasAi, hasManual);
                }

                var restoreScriptBtn = document.getElementById("restoreScriptBtn");
                if (restoreScriptBtn) {
                    restoreScriptBtn.addEventListener("click", restoreTimelineScript);
                }
                if (txtPromptModify) {
                    txtPromptModify.addEventListener("input", function () {
                        lastPlanningRestoreTarget = "ai";
                    });
                }



                initShareWorkerService();
                updateShareMenuUI();
                tryLoadSharedStateFromUrl();

                setScale("week");
                if (txtPromptCreate) {
                    txtPromptCreate.focus();
                }

            })();
        </script>
        <script>
            (function removeVersionQueryParam() {
                try {
                    const url = new URL(window.location.href);
                    if (!url.searchParams.has("v")) return;
                    url.searchParams.delete("v");
                    const search = url.searchParams.toString();
                    const newUrl = url.pathname + (search ? `?${search}` : "") + url.hash;
                    window.history.replaceState({}, "", newUrl);
                } catch (err) {
                    /* noop */
                }
            })();
        </script>
        <script>
            window.GoToolkitAppFeedbackConfig = {
                appId: "timeline",
                appName: "Timeline",
                defaultType: "bug-timeline",
                shareCollection: "timelines",
                buildSharePayload: () => ({
                    app: "timeline",
                    url: window.location.href,
                    payload: typeof buildTimelineStatePayload === "function" ? buildTimelineStatePayload() : {}
                })
            };
        </script>
        <script src="js/feedback.js"></script>
        <script>
            (function () {
                const templateTrigger = document.getElementById("gtTemplateModalTrigger");
                const aiTrigger = document.getElementById("gtContextModalTrigger");
                const contextOverlay = document.getElementById("gtContextModal");
                const promptTrigger = document.getElementById("gtPromptModalTrigger");
                const shareTrigger = document.getElementById("shareBtn");
                const shareMenu = document.getElementById("shareMenu");
                const infoTrigger = document.getElementById("aboutTimelineBtn");
                const infoPanel = document.getElementById("timelineInfoPopup");
                const feedbackTrigger = document.getElementById("feedback-app-timeline-openBtn");
                const fileTrigger = document.getElementById("fileMenuBtn");
                const fileMenu = document.getElementById("fileMenu");
                const displayTrigger = document.getElementById("optionsBtn");
                const displayMenu = document.getElementById("optionsMenu");

                function clickWhenClosed(trigger, menu) {
                    if (!trigger) return false;
                    if (menu && menu.classList.contains("open")) return true;
                    trigger.click();
                    return true;
                }

                function openContextModal() {
                    if (!aiTrigger) return false;
                    if (contextOverlay?.classList.contains("open")) {
                        return true;
                    }
                    aiTrigger.click();
                    return true;
                }

                function openInfo() {
                    if (!infoTrigger || !infoPanel) return false;
                    if (infoPanel.classList.contains("open")) return true;
                    infoTrigger.click();
                    return true;
                }

                const handlers = {
                    "#template": () => clickWhenClosed(templateTrigger),
                    "#ai": openContextModal,
                    "#share": () => clickWhenClosed(shareTrigger, shareMenu),
                    "#info": openInfo,
                    "#feedback": () => {
                        if (!feedbackTrigger) return false;
                        feedbackTrigger.click();
                        return true;
                    },
                    "#prompt": () => clickWhenClosed(promptTrigger),
                    "#file": () => clickWhenClosed(fileTrigger, fileMenu),
                    "#display": () => clickWhenClosed(displayTrigger, displayMenu)
                };

                function normalize(hash) {
                    if (!hash) return "";
                    return hash.split(/[?#]/)[0].toLowerCase();
                }

                function removeHash() {
                    try {
                        window.history.replaceState(null, "", window.location.pathname + window.location.search);
                    } catch (error) {
                        // ignore
                    }
                }

                function handleFragment(hash) {
                    const target = normalize(hash);
                    if (!target) return;
                    const action = handlers[target];
                    if (typeof action !== "function") return;
                    const opened = action();
                    if (opened) {
                        removeHash();
                    }
                }

                window.addEventListener("hashchange", () => handleFragment(window.location.hash));
                window.addEventListener("DOMContentLoaded", () => handleFragment(window.location.hash));
                handleFragment(window.location.hash);
            })();
        </script>
